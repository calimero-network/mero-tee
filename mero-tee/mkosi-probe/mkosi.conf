# Phase 0 of the reproducible-image work (mdma#480): the smallest image that
# boots on a GCP TDX VM as a unified kernel image (UKI) and prints its own
# evidence. It is not a node image -- no merod, no network, no lockdown. It
# exists to answer two questions before the node image moves to mkosi:
#
#   1. Does replaying the CCEL event log reproduce the quote's RTMRs?
#   2. Is the UKI the build produced measured into RTMR1 under its Authenticode
#      SHA-384, so RTMR1 can be computed from the build output?
#
# Run by .github/workflows/uki-tdx-probe.yaml. Its `ubuntu_release` input
# overrides Release= below.
#
# mkosi.extra masks systemd-firstboot.service and systemd-homed-firstboot.service.
# Unmasked, the first boot stops at an interactive "Please configure the
# system!" prompt on the serial console and never reaches multi-user, so the
# evidence service never runs (the first probe run did exactly that).
# It also masks serial-getty@ttyS0.service: the probe has no login, and a getty
# starting on ttyS0 hangs the TTY up, which killed the evidence script mid-output
# on the second run.

[Distribution]
Distribution=ubuntu
# 26.04, the release the Packer images are built from (ubuntu-2604-lts-amd64).
Release=resolute
# systemd-boot-efi (the UKI stub) is in universe.
Repositories=main,universe

[Output]
ImageId=merotee-uki-probe
Format=disk
ManifestFormat=json
SplitArtifacts=uki
# Fixed, so systemd-repart derives the same disk and partition GUIDs on every
# build. RTMR1 measures the GPT (EV_EFI_GPT_EVENT), GUIDs included: with the
# default random seed, identical builds got different RTMR1s. This is
# uuid5(NAMESPACE_URL, "https://github.com/calimero-network/mero-tee/mero-tee/mkosi-probe").
Seed=fa4997f3-a854-5b12-b17a-9fd076b87f46

[Build]
ToolsTree=yes

[Content]
# Clamp every file time in the image, and so in the UKI's initrd, which RTMR1
# (the UKI's Authenticode hash) and RTMR2 (its sections) measure.
# 2026-01-01T00:00:00Z.
SourceDateEpoch=1767225600
Bootable=yes
# One UKI, installed as the ESP's default EFI/BOOT/BOOTX64.EFI: no shim, no
# boot menu, so it is the only EFI application the firmware loads.
Bootloader=uki
KernelCommandLine=console=ttyS0,115200 quiet systemd.show_status=no
Packages=
        linux-image-gcp
        systemd
        systemd-boot-efi
        udev
        kmod

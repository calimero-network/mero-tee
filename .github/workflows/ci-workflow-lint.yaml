name: CI workflow and shell lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/release/**"
      - "scripts/policy/**"
      - "scripts/attestation/**"
      - "scripts/kms/**"
      - "scripts/ci/**"
      - "mero-tee/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "scripts/release/**"
      - "scripts/policy/**"
      - "scripts/attestation/**"
      - "scripts/kms/**"
      - "scripts/ci/**"
      - "mero-tee/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        id: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -shellcheck=

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        id: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          shell_files=(scripts/release/**/*.sh scripts/policy/**/*.sh scripts/ci/**/*.sh mero-tee/**/*.sh .github/workflows/deps/**/*.sh)
          if [[ "${#shell_files[@]}" -eq 0 ]]; then
            echo "No shell files matched lint paths."
            exit 0
          fi

          shellcheck "${shell_files[@]}"

      # The sidecar tests below substitute the template's variables with `sed`,
      # which exercises the bash but never asks whether Jinja can parse the file.
      # `${#arr[@]}` opens with Jinja's comment delimiter, so a counted array
      # makes Ansible swallow the rest of the template and die with "Missing end
      # of comment tag" -- five minutes into a packer build, on a GCP VM, and
      # only on the read-only profiles, since the sidecar task is gated on
      # `merod_mode == "read-only"`. That took out the 2.3.55 and 2.3.56 node
      # images and then every later `Release mero-kms` run with it, because that
      # workflow refuses to publish without the node release's published-mrtds.
      # Parsing each template here costs a second and fails on the PR instead.
      - name: Check Ansible templates parse
        id: ansible_templates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet jinja2 pyyaml
          python3 scripts/ci/check-ansible-templates.py

      # Static, because the token is optional by construction: every header is
      # gated on a non-empty FLEET_TOKEN so an image built without one still
      # works against a manager that requires none. A dropped header therefore
      # changes nothing observable until the manager has a token configured, at
      # which point the node is a TEE VM in the field returning 401s. Cheaper to
      # assert here that every fleet-calling function offers it.
      - name: Check the sidecar offers its fleet token on every fleet call
        id: fleet_token_headers
        shell: bash
        run: python3 scripts/ci/check-fleet-token-headers.py

      # Runs here rather than in a probe workflow because it needs neither a TDX
      # node nor an MDMA: it renders the sidecar template and drives its
      # authorship-reporting logic against stubbed `meroctl` / `curl`. That logic
      # decides when this node tells MDMA it can serve delegated execution, and
      # it is silent in both failure directions, so it is worth checking on every
      # change to the template.
      - name: Run fleet-sidecar authorship test
        id: sidecar_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-authorship-test.sh

      # Same reasoning, for the other half of what the sidecar tells MDMA. The
      # context inventory is what makes `GET /api/cloud/contexts/{id}/relays`
      # able to answer at all, and it is wrong quietly in two directions: a
      # context reported under the wrong group routes a client to a relay that
      # will refuse the write, and a `full` report assembled from partial reads
      # makes MDMA prune rows for contexts this node is serving.
      - name: Run fleet-sidecar inventory test
        id: sidecar_inventory_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-inventory-test.sh

      # The recovery-envelope writer (mdma#223). Every way it can be wrong is
      # invisible until someone's last device dies and there is no retroactive
      # fix: writing for members with no cloud login hands MDMA the membership
      # roster the inventory half is careful never to send, a partial list at a
      # higher version destroys a good envelope exactly as a stale copy would,
      # a version that resets across a restart earns a permanent 409, and
      # detecting change by comparing ciphertexts rewrites forever because every
      # seal mints a fresh ephemeral key.
      - name: Run fleet-sidecar recovery test
        id: sidecar_recovery_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-recovery-test.sh

      # Attested node registration (mdma#225). The binding is a hash the
      # sidecar and MDMA compute independently, so a field-order or separator
      # change breaks every registration in a way that looks exactly like a bad
      # attestation. The rest is retry semantics that fail quietly: recording a
      # registration MDMA refused, or treating its 503 ("could not EVALUATE the
      # quote") as a verdict, each leave a healthy node unadvertised for as long
      # as it runs.
      - name: Run fleet-sidecar registration test
        id: sidecar_registration_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-registration-test.sh

      # The executor account's availability at boot. Its VALUE is fixed for the
      # life of the node, which is why it is read once -- but `After=merod.service`
      # orders this unit's start without waiting for merod to be READY, so a boot
      # that lost that race left the account empty for the life of the process.
      # `reconcile_registration` returns immediately without one, and everything
      # downstream hangs off that registration: no certificate row, so no A record
      # and no certificate, so the node's name answered NXDOMAIN and it was never
      # advertised as a relay -- while replicating and polling perfectly happily,
      # with nothing on either side saying why.
      - name: Run fleet-sidecar executor-account retry test
        id: sidecar_account_retry_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-account-retry-test.sh

      # The observability credential, which is HANDED TO THE NODE BY MDMA and
      # deliberately not baked into the image: the image is an artifact whose
      # distribution is not fully controlled, so anything in it should be assumed
      # readable. Secret Manager is not an alternative -- mdma creates these
      # instances with no service account, so there is no cloud identity to fetch
      # with. Every failure here is quiet: reporting the token instead of its
      # fingerprint sends a secret back up the wire once a second, and printing to
      # stdout from the install corrupts the assignments payload that drives the
      # LEAVE path, which purges keys.
      - name: Run fleet-sidecar observability token test
        id: sidecar_logs_token_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-logs-token-test.sh

      # Node TLS. Without it a browser cannot reach a fleet node at all -- a
      # page on an HTTPS origin may not call `http://`, and mixed content is
      # blocked with no override. Each failure mode here is silent: the
      # self-signed placeholder reporting its ten-year expiry means MDMA never
      # orders a real certificate; a chain that does not match the node's key
      # loads in traefik and breaks every handshake on a node already
      # advertised as a relay; and `log` tees to stdout, so a warning inside a
      # value-returning function is captured AS the value and MDMA is asked to
      # sign it.
      - name: Run fleet-sidecar TLS test
        id: sidecar_tls_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-tls-test.sh

      # Direct admission. The sidecar reports where its swarm can be dialed and
      # asks the peers MDMA names for admission, instead of only broadcasting
      # its attestation and hoping an owner's relayed laptop hears it. Wrong
      # quietly in several ways: an external address with no `/p2p/<peer id>`
      # cannot be dialed; a relay-circuit address contains the RELAY's peer id,
      # not ours; and passing `--admitter-addr` to a meroctl that predates it
      # fails every fleet-join on an unknown flag.
      - name: Run fleet-sidecar direct admission test
        id: sidecar_direct_admission_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-direct-admission-test.sh

      # Secrets must be CREATED restricted, not created loose and tightened.
      # None of these units set `UMask=`, so systemd's default 0022 makes a
      # token 0644 and a later `chmod` closes the window only after the secret
      # is already on disk world-readable.
      #
      # The sidecar's writes are covered behaviourally by the logs-token test,
      # which shadows `chmod` to observe the mode AS CREATED. calimero-init
      # cannot be: it is a linear boot script with nothing to source. It is also
      # where the observability token is written on every node at boot, so it is
      # where this matters most -- and it is exactly where the check was missing
      # when the sidecar was fixed.
      - name: Check every token file is created under a restrictive umask
        id: secret_umask_test
        shell: bash
        run: scripts/ci/tests/secret-file-umask-test.sh

      # The data disk has to be mounted before merod initialises into it, and
      # must never be mounted over a node whose state is already sitting on the
      # root filesystem -- that hides the state and merod mints a fresh
      # identity. It cannot be a GCP startup script: `merod-lockdown` blocks
      # those on `locked-read-only`.
      # A namespace enters `confirmed` only when the local join AND mdma's
      # /confirm both succeed, so a join whose confirm is raced by the disable
      # itself left the node a p2p member of a namespace in neither set -- and
      # `confirmed - desired` never named it, so it was never left.
      - name: Check the leave diff follows admission, not mdma's record
        id: leave_set_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-leave-set-test.sh

      # The set that diff reads starts EMPTY on the first boot after the build
      # that introduced it, and the join loop skips anything already confirmed --
      # so nothing ever records the namespaces joined under the previous build,
      # and a later disable never makes the node leave them. Seeding from
      # `confirmed` (a subset of admitted, by construction) bridges that boot.
      - name: Check the admitted set survives the upgrade that introduced it
        id: admitted_seed_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-admitted-seed-test.sh

      - name: Check the data disk is mounted before use
        id: data_disk_test
        shell: bash
        run: scripts/ci/tests/calimero-init-data-disk-test.sh

      # TDX protects memory, not disks, so merod's store -- the node's admitted
      # signing identity and account root -- must be encrypted with a KMS key,
      # and from `merod init` onwards. Runs the decision against a stub merod:
      # locked-read-only never creates a plaintext store, and a KMS that cannot
      # be verified (no tee-release-version) is never used.
      - name: Check new nodes get a KMS-encrypted store
        id: store_encryption_test
        shell: bash
        run: scripts/ci/tests/calimero-init-store-encryption-test.sh

      # The store is not the whole disk: config.toml, the TLS key, mero-auth's
      # database and the fleet token sit beside it. So the data disk itself is
      # LUKS2 with integrity, keyed from the KMS. Runs the disk block against
      # stub cryptsetup/blkid/mount/merod: only a disk blkid reports blank is
      # ever formatted, an existing LUKS disk is reopened from its header token,
      # a plain one is mounted and warned about, anything else stops the boot,
      # the key never outlives the script -- and tee-release-version cannot go
      # below the image's own version.
      - name: Check the data disk is encrypted and never reformatted
        id: disk_encryption_test
        shell: bash
        run: scripts/ci/tests/calimero-init-disk-encryption-test.sh

      # A node with no fleet token must still be able to register. should-join
      # requires a token; registration ISSUES one and takes none. Poll first and
      # a fresh node 401s, `continue`s, and never reaches the code that would
      # register it -- a closed, silent loop that only became reachable when the
      # baked fleet token was removed from the image.
      - name: Check registration runs before the should-join gate
        id: bootstrap_order_test
        shell: bash
        run: scripts/ci/tests/fleet-sidecar-bootstrap-order-test.sh

      # Node metrics must say which node they came from. The scrape target is
      # `localhost:9100` on every node, so without identifying labels the whole
      # fleet collapses into one series and samples interleave -- plausible,
      # wrong, and invisible until a second node exists.
      - name: Check vmagent labels its samples with the node identity
        id: vmagent_identity_test
        shell: bash
        run: scripts/ci/tests/vmagent-node-identity-test.sh

      # Which image a node runs. `locked-read-only` is production; the debug
      # profiles are rebuilt freely and use Let's Encrypt staging. Without the
      # field, a log line from a throwaway node reads exactly like one from
      # production -- and the placeholder shipping unsubstituted would be worse
      # still, since every node would report the literal string.
      - name: Check vector stamps and indexes the image profile
        id: vector_profile_test
        shell: bash
        run: scripts/ci/tests/vector-image-profile-test.sh

      # Every ingress router must carry a request-rate limit, first in its
      # chain. Two of these routes verify signatures for callers holding no
      # credential -- deliberately, since a credential would make both features
      # unreachable for the callers they exist for -- so an unlimited ingress is
      # a way to spend a node's CPU from anywhere. A limit placed after
      # `auth-node` is worse than none in one respect: it pays for a forwardAuth
      # subrequest per flooded request, so a flood of the node becomes a flood of
      # its auth service.
      - name: Check every ingress router is rate limited, first in its chain
        id: traefik_rate_limit_test
        shell: bash
        run: scripts/ci/tests/traefik-rate-limit-test.sh

      - name: Summarize lint outcomes
        if: ${{ always() }}
        run: |
          set -euo pipefail
          source scripts/ci/logging.sh
          result_line="$(ci_result "ci-workflow-lint" "${{ job.status }}" "ACTIONLINT_SHELLCHECK" "ref=${GITHUB_REF_NAME}" "run_id=${GITHUB_RUN_ID}")"
          ci_info "${result_line}"
          python3 scripts/ci/summary/write_workflow_summary.py \
            --output "${GITHUB_STEP_SUMMARY}" \
            --inputs-line "- Ref: ${GITHUB_REF_NAME}" \
            --checks-line "- actionlint: ${{ steps.actionlint.outcome }}" \
            --checks-line "- shellcheck: ${{ steps.shellcheck.outcome }}" \
            --checks-line "- fleet-sidecar authorship test: ${{ steps.sidecar_test.outcome }}" \
            --checks-line "- fleet-sidecar inventory test: ${{ steps.sidecar_inventory_test.outcome }}" \
            --checks-line "- fleet-sidecar recovery test: ${{ steps.sidecar_recovery_test.outcome }}" \
            --checks-line "- fleet-sidecar registration test: ${{ steps.sidecar_registration_test.outcome }}" \
            --checks-line "- fleet-sidecar executor-account retry test: ${{ steps.sidecar_account_retry_test.outcome }}" \
            --checks-line "- fleet-sidecar TLS test: ${{ steps.sidecar_tls_test.outcome }}" \
            --checks-line "- fleet-sidecar direct admission test: ${{ steps.sidecar_direct_admission_test.outcome }}" \
            --checks-line "- fleet-sidecar observability token test: ${{ steps.sidecar_logs_token_test.outcome }}" \
            --checks-line "- token files created under umask: ${{ steps.secret_umask_test.outcome }}" \
            --checks-line "- data disk mounted before use: ${{ steps.data_disk_test.outcome }}" \
            --checks-line "- new nodes get a KMS-encrypted store: ${{ steps.store_encryption_test.outcome }}" \
            --checks-line "- data disk encrypted, never reformatted: ${{ steps.disk_encryption_test.outcome }}" \
            --checks-line "- leave diff follows admission: ${{ steps.leave_set_test.outcome }}" \
            --checks-line "- admitted set seeded on upgrade: ${{ steps.admitted_seed_test.outcome }}" \
            --checks-line "- registration precedes the poll gate: ${{ steps.bootstrap_order_test.outcome }}" \
            --checks-line "- vmagent node identity labels: ${{ steps.vmagent_identity_test.outcome }}" \
            --checks-line "- vector image profile field: ${{ steps.vector_profile_test.outcome }}" \
            --checks-line "- ingress routers rate limited: ${{ steps.traefik_rate_limit_test.outcome }}" \
            --result-line "- Job status: ${{ job.status }}" \
            --result-line "- ${result_line}" \
            --artifacts-line "- n/a" \
            --next-line "- Fix first failing lint stage and rerun."

name: CI frontend verifier

# The browser extension that checks a Calimero app's page against what its attested node
# verified (frontend-verifier/; docs: understand/trust-model, "Levels of frontend trust").
on:
  push:
    branches:
      - master
    paths:
      - "frontend-verifier/**"
      - ".github/workflows/ci-frontend-verifier.yaml"
  pull_request:
    paths:
      - "frontend-verifier/**"
      - ".github/workflows/ci-frontend-verifier.yaml"

permissions:
  contents: read

concurrency:
  group: ci-frontend-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-verifier
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-verifier/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the unpacked extensions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-verifier
          path: frontend-verifier/dist/
          if-no-files-found: error

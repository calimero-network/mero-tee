# Calimero Authentication Service Configuration

# Server configuration
#
# Loopback only. Traefik is the only client (`auth-service` and the `auth-node`
# forwardAuth both dial http://127.0.0.1:3001), and the GCP firewall was the
# only thing keeping mero-auth's own listener -- CORS allow-all, the token
# endpoints -- off the network when it bound every interface.
listen_addr = "127.0.0.1:3001"

# JWT token settings
[jwt]
issuer = "calimero-auth"
access_token_expiry = 1800     # 30 minutes
refresh_token_expiry = 2592000 # 30 days

# Storage configuration
[storage]
type = "rocksdb"
path = "/mnt/data/calimero/default/auth_db"

# CORS configuration
[cors]
allow_all_origins = true
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["Authorization", "Content-Type", "Accept", "X-CSRF-Token"]
exposed_headers = ["X-Auth-Error"]
max_age = 100                                                                 # Match the accesscontrolmaxage from docker-compose
vary_header = true                                                            # Match addvaryheader from docker-compose

# Security configuration
[security]
# Request size limits (in bytes)
max_body_size = 1048576 # 1MB default request body size limit

# Rate limiting settings
[security.rate_limit]
rate_limit_rpm = 300  # Requests per minute (increased from 50)
rate_limit_burst = 50 # Burst size for rate limiting (increased from 20)

# Security headers configuration
[security.headers]
enabled = true
hsts_max_age = 31536000                             # 1 year in seconds
hsts_include_subdomains = true
frame_options = "DENY"                              # DENY, SAMEORIGIN, or ALLOW-FROM
content_type_options = "nosniff"
referrer_policy = "strict-origin-when-cross-origin"

# Content Security Policy
[security.headers.csp]
enabled = true
default_src = ["'self'"]
script_src = ["'self'", "'unsafe-inline'", "'unsafe-eval'"]
style_src = ["'self'", "'unsafe-inline'"]

# Authentication providers: none.
#
# A fleet relay is operated by Calimero and serves several tenants' namespaces
# at once. Nobody should be holding an interactive login on it, so no provider
# is enabled and no new token can be minted here.
#
# `user_password` was the only one that ever worked. A `near_wallet = true`
# entry and a `[near]` block pointing at NEAR testnet also sat here, and never
# did anything: `mero-auth` implements one provider
# (`crates/auth/src/providers/impls/user_password.rs`), `providers` is a
# `HashMap<String, bool>` so an unregistered name matches nothing, and
# `AuthConfig` has no `deny_unknown_fields` so serde discarded the block in
# silence. The image was advertising a login it could not perform.
#
# What this does NOT affect: the fleet sidecar talks to
# `http://127.0.0.1:<port>/admin-api/...` directly and `meroctl` uses the local
# `--home`, so neither passes through Traefik's `auth-node` forwardAuth. What it
# closes is external access to `/jsonrpc` and `/admin-api/` through the ingress,
# which on this machine had no legitimate user.
#
# `create_providers` collects enabled registrations into a `Vec` and returns it
# unconditionally, so an empty set starts cleanly -- token *validation* still
# works for `auth-node`, there is simply no way to obtain a new one.
[providers]
user_password = false

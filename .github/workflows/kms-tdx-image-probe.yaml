name: KMS TDX image probe
run-name: KMS TDX image probe (${{ inputs.profile }}, ${{ inputs.node_release_tag }})

# Builds the mero-kms TDX cluster image from this commit and runs a two-replica
# cluster on real TDX VMs (scripts/release/kms/run-cluster-probe.sh, the same
# probe Release mero-kms runs on its release images; docs/design/gcp-tdx-kms.md).
#
# Publishes nothing, and deletes its image, VMs and firewall rule at the end.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "KMS profile"
        required: true
        type: choice
        options:
          - locked-read-only
          - debug
      node_release_tag:
        description: "Node release whose allowlist the KMS serves (mero-tee-v<version>)"
        required: true
        default: "mero-tee-v2.3.72"
      wait_timeout_minutes:
        description: "How long to wait for each replica to hold the root"
        required: true
        default: "15"

concurrency:
  group: kms-tdx-image-probe-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

env:
  PACKER_GITHUB_API_TOKEN: ${{ github.token }}
  PACKER_GCP_PROJECT_ID: ${{ vars.GCP_PACKER_PROJECT_ID }}
  PACKER_GCP_REGION: ${{ vars.GCP_PACKER_REGION }}
  PACKER_GCP_ZONE: ${{ vars.GCP_PACKER_ZONE }}
  PACKER_GCP_SUBNETWORK: ${{ vars.GCP_PACKER_SUBNETWORK }}
  VM_PROJECT: ${{ vars.GCP_ATTESTATION_PROJECT_ID != '' && vars.GCP_ATTESTATION_PROJECT_ID || 'cloud-486420' }}
  VM_ZONE: ${{ vars.GCP_ATTESTATION_ZONE != '' && vars.GCP_ATTESTATION_ZONE || 'europe-west4-a' }}
  VM_MACHINE_TYPE: ${{ vars.GCP_ATTESTATION_MACHINE_TYPE != '' && vars.GCP_ATTESTATION_MACHINE_TYPE || 'c3-standard-4' }}
  ITA_APPRAISAL_URL: ${{ vars.ITA_APPRAISAL_URL }}
  KMS_PORT: "8080"
  # Never a release: a KMS probe image always carries a suffix and its own family.
  IMAGE_SUFFIX: ${{ format('-k{0}-{1}', github.run_number, github.run_attempt) }}
  PROFILE: ${{ inputs.profile }}

jobs:
  probe:
    name: Build and run a two-replica KMS cluster (${{ inputs.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: kms-tdx-image-probe

      - name: Build mero-kms
        run: |
          cargo build -p mero-kms --release --locked
          mkdir -p probe
          cp target/release/mero-kms probe/mero-kms
          sha256sum probe/mero-kms | tee probe/mero-kms.sha256

      - name: Fetch the node allowlist the KMS serves
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_TAG: ${{ inputs.node_release_tag }}
        run: |
          set -euo pipefail
          gh release download "${NODE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "published-mrtds.json" --dir probe
          jq --arg p "${PROFILE}" '.profiles[$p] | {
              allowed_tcb_statuses, allowed_mrtd,
              allowed_rtmr0, allowed_rtmr1, allowed_rtmr2, allowed_rtmr3
            }' probe/published-mrtds.json > probe/node-allowlist.json
          jq -e 'all(.[]; type == "array" and length > 0)' probe/node-allowlist.json >/dev/null \
            || { echo "::error::${NODE_TAG} has no complete ${PROFILE} node allowlist"; exit 1; }
          cat probe/node-allowlist.json

      - name: Authenticate to GCP via service account key
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: v1.11.2

      - name: Build the KMS image
        working-directory: mero-tee
        env:
          IMAGE_ROLE: kms
          MERO_KMS_BINARY: ../probe/mero-kms
          KMS_NODE_POLICY_FILE: ../probe/node-allowlist.json
          PACKER_LOG: 1
        run: |
          set -euo pipefail
          ./init.sh
          ./build-and-release.sh "${PROFILE}" 2>&1 | tee /tmp/packer-build.log

      - name: Show build log on failure
        if: ${{ failure() }}
        run: tail -200 /tmp/packer-build.log 2>/dev/null || true

      - name: Resolve names
        id: names
        run: |
          set -euo pipefail
          version="$(jq -r '.imageVersion' mero-tee/versions.json)"
          {
            echo "image=merotee-kms-${PROFILE}-${version//./-}${IMAGE_SUFFIX}"
            echo "image_project=${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run the two-replica cluster and verify both quotes
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          IMAGE_PROJECT: ${{ steps.names.outputs.image_project }}
          PROBE_NAME: kms-probe${{ env.IMAGE_SUFFIX }}
          WAIT_TIMEOUT_MINUTES: ${{ inputs.wait_timeout_minutes }}
          ITA_API_KEY: ${{ secrets.ITA_API_KEY }}
          OUT_DIR: probe
        run: bash scripts/release/kms/run-cluster-probe.sh

      - name: Upload probe artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: kms-tdx-image-probe-${{ inputs.profile }}-${{ github.run_id }}
          path: probe/
          if-no-files-found: ignore

      - name: Delete the probe image
        if: ${{ always() }}
        run: |
          image="${{ steps.names.outputs.image }}"
          [[ -n "${image}" && "${image}" == *"${IMAGE_SUFFIX}" ]] && gcloud compute images delete \
            "${image}" --project "${{ steps.names.outputs.image_project }}" --quiet || true

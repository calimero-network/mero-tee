name: Image (mkosi)
run-name: Image (mkosi, ${{ inputs.role }}, ${{ inputs.profile }}${{ inputs.role == 'agent' && format(', {0}', inputs.agent) || '' }})

# The TEE images, built with mkosi (mdma#480) from a branch. Builds
# mero-tee/mkosi-image for one role (node, kms or agent) and profile
# (locked-read-only, debug-read-only or debug) from the pinned archive snapshot
# and the Ansible roles' files, as the releases do, then:
#   1. computes RTMR1, RTMR2 and RTMR3 from the disk and UKI before anything
#      boots (RTMR3: the init script's v3 event, naming the UKI's roothash=);
#   2. boots the image and runs that role's probe:
#      node: the staging probe (admin API, quote, ITA appraisal, policy
#        candidates);
#      kms: a two-replica cluster (scripts/release/kms/run-cluster-probe.sh),
#        serving the node allowlist of node_release_tag, which must verify
#        against its Sigstore bundle (scripts/release/kms/verify-node-policy.sh);
#      agent: ITA, then a throwaway secret provisioned to the agent
#        (scripts/release/agent/run-agent-probe.sh). The agent is the stub
#        (scripts/agent/stub-mero-agent.py) or, with agent=mero-bot, the
#        mero-bot release versions.json pins, as the releases bake it; that
#        needs the MERO_BOT_RELEASE_TOKEN secret;
#   3. compares the quote's RTMR1-3 with the computed ones.
# With log_auth_check (debug profiles), the probe VM also gets the two log keys
# and must push to a throwaway receiver with its token, as in the releases
# (scripts/ci/probes/node_log_auth_probe.sh).
# Manual only; it publishes nothing, and the image is deleted afterwards unless
# keep_image is set.

on:
  workflow_dispatch:
    inputs:
      role:
        description: "Image to build and probe"
        required: true
        type: choice
        options:
          - node
          - kms
          - agent
        default: node
      profile:
        description: "Profile to build and probe"
        required: true
        type: choice
        options:
          - locked-read-only
          - debug-read-only
          - debug
        default: locked-read-only
      node_release_tag:
        description: "kms only: the node release whose allowlist the KMS serves (mero-tee-v<version>)"
        required: false
        default: "mero-tee-v2.3.118"
      agent:
        description: "agent only: the agent the image runs"
        required: false
        type: choice
        options:
          - stub
          - mero-bot
        default: stub
      keep_image:
        description: "Keep the GCE image after the run (for booting it again by hand)"
        required: false
        type: boolean
        default: false
      serial_console:
        description: "Diagnostic build: kernel and journal on the serial console (console=ttyS0). Not the profile's measurement: it changes RTMR2"
        required: false
        type: boolean
        default: false
      log_auth_check:
        description: "Boot with a log token and logs-endpoint pointed at a throwaway receiver, as the releases do, and check the pushes carry it (debug and debug-read-only only)"
        required: false
        type: boolean
        default: false
      wait_timeout_minutes:
        description: "kms and agent: how long to wait for the replicas or the gate"
        required: false
        default: "15"
      log_verbosity:
        description: "node: staging probe logging verbosity"
        required: false
        type: choice
        options:
          - compact
          - debug
        default: compact

permissions:
  contents: read

jobs:
  build:
    name: Build the image and compute RTMR1 and RTMR2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      GCP_ATTESTATION_PROJECT_ID: ${{ vars.GCP_ATTESTATION_PROJECT_ID != '' && vars.GCP_ATTESTATION_PROJECT_ID || 'cloud-486420' }}
      GCP_ATTESTATION_ZONE: ${{ vars.GCP_ATTESTATION_ZONE != '' && vars.GCP_ATTESTATION_ZONE || 'europe-west4-a' }}
      UPLOAD_BUCKET: ${{ vars.GCP_IMAGE_UPLOAD_BUCKET }}
      MKOSI_OUT: ${{ github.workspace }}/mkosi-out
      EVIDENCE_DIR: ${{ github.workspace }}/mkosi-evidence
      SERIAL_CONSOLE: ${{ inputs.serial_console }}
      PROFILE: ${{ inputs.profile }}
      ROLE: ${{ inputs.role }}
    outputs:
      image: ${{ steps.params.outputs.image }}
      project: ${{ steps.params.outputs.project }}
      merod_version: ${{ steps.params.outputs.merod_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mkosi
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Setup rust cache
        if: ${{ inputs.role != 'node' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: image-mkosi-${{ inputs.role }}

      # What a KMS or agent image bakes: the binaries from this commit, and the
      # stub agent or the pinned mero-bot bundle.
      - name: Build mero-kms
        if: ${{ inputs.role == 'kms' }}
        run: |
          set -euo pipefail
          cargo build -p mero-kms --release --locked
          mkdir -p inputs
          cp target/release/mero-kms inputs/
          echo "MERO_KMS_BINARY=${PWD}/inputs/mero-kms" >> "${GITHUB_ENV}"

      - name: Install cosign to verify the node policy
        if: ${{ inputs.role == 'kms' }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # As Release mero-kms does: only the node release workflow's own signed
      # policy, in shapes kms.env carries intact.
      - name: Fetch the node allowlist the KMS serves
        if: ${{ inputs.role == 'kms' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_TAG: ${{ inputs.node_release_tag }}
        run: |
          set -euo pipefail
          # Straight into inputs/: the build hashes inputs/* as evidence, and
          # sha256sum refuses a directory.
          gh release download "${NODE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "published-mrtds.json" --pattern "published-mrtds.json.bundle.json" \
            --dir inputs
          bash scripts/release/kms/verify-node-policy.sh inputs
          bash scripts/release/kms/extract-node-allowlist.sh \
            inputs/published-mrtds.json "${PROFILE}" inputs/node-allowlist.json
          echo "KMS_NODE_POLICY_FILE=${PWD}/inputs/node-allowlist.json" >> "${GITHUB_ENV}"

      - name: Build mero-agent-gate and stage the agent
        if: ${{ inputs.role == 'agent' }}
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          set -euo pipefail
          cargo build -p mero-agent-gate --release --locked
          mkdir -p inputs agent-tools
          cp target/release/mero-agent-gate inputs/
          cp target/release/mero-agent-provision agent-tools/
          echo "MERO_AGENT_GATE_BINARY=${PWD}/inputs/mero-agent-gate" >> "${GITHUB_ENV}"
          # With mero-bot, build.sh bakes the mero-bot launcher as the agent.
          if [[ "${AGENT}" != mero-bot ]]; then
            cp scripts/agent/stub-mero-agent.py inputs/mero-agent
            echo "MERO_AGENT_BINARY=${PWD}/inputs/mero-agent" >> "${GITHUB_ENV}"
          fi

      # As Release mero-kms fetches it; the mero-agent role checks it against
      # its pin again.
      - name: Download the pinned mero-bot bundle
        if: ${{ inputs.role == 'agent' && inputs.agent == 'mero-bot' }}
        env:
          GH_TOKEN: ${{ secrets.MERO_BOT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN}" ]] || { echo "::error::agent=mero-bot needs the MERO_BOT_RELEASE_TOKEN secret"; exit 1; }
          version="$(jq -r '.meroBotVersion // empty' mero-tee/versions.json)"
          [[ -n "${version}" ]] || { echo "::error::versions.json pins no meroBotVersion"; exit 1; }
          asset="mero-bot-${version}-linux-x64.tar.gz"
          gh release download "v${version}" --repo calimero-network/mero-bot --pattern "${asset}" --dir inputs
          want="$(jq -r --arg a "${asset}" '.meroBot.sha256[$a] // empty' mero-tee/build-inputs.lock.json)"
          [[ -n "${want}" ]] || { echo "::error::build-inputs.lock.json pins no sha256 for ${asset}"; exit 1; }
          echo "${want}  inputs/${asset}" | sha256sum -c -
          echo "MERO_BOT_BUNDLE=$(realpath "inputs/${asset}")" >> "${GITHUB_ENV}"

      - name: Upload the agent probe's provisioning client
        if: ${{ inputs.role == 'agent' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mkosi-agent-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: agent-tools/
          retention-days: 3

      - name: Install the build tools
        run: scripts/release/mkosi/install-tools.sh

      # As the releases build it: as root, then the command line, ownership,
      # RTMR1-3 before boot and the root and initrd digests
      # (scripts/release/mkosi/build-image.sh).
      - name: Build the image
        run: |
          set -euo pipefail
          scripts/release/mkosi/build-image.sh
          if [[ -n "${MERO_KMS_BINARY:-}${MERO_AGENT_GATE_BINARY:-}" ]]; then
            sha256sum inputs/* | tee "${EVIDENCE_DIR}/inputs.sha256"
          fi

      - name: Upload the build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mkosi-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 14

      - name: Determine GCP auth mode
        id: auth_mode
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
        run: |
          mode="key"
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            mode="wif"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to GCP via workload identity
        if: ${{ steps.auth_mode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to GCP via service account key
        if: ${{ steps.auth_mode.outputs.mode != 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Prepare image parameters
        id: params
        run: |
          set -euo pipefail
          if [[ -z "${UPLOAD_BUCKET}" ]]; then
            echo "::error::The GCP_IMAGE_UPLOAD_BUCKET repo variable must name the upload bucket."
            exit 1
          fi
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "project=${GCP_ATTESTATION_PROJECT_ID}"
            echo "image=merotee-${ROLE}-mkosi-${PROFILE}-${suffix}"
            echo "merod_version=$(jq -r .merodVersion mero-tee/versions.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload and create the GCE image
        env:
          IMAGE_PROJECT: ${{ steps.params.outputs.project }}
          IMAGE_NAME: ${{ steps.params.outputs.image }}
        run: scripts/release/mkosi/create-gce-image.sh

  probe:
    name: Boot and probe the node image
    needs: build
    if: ${{ inputs.role == 'node' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/node-image-gcp-staging-probe.yaml
    with:
      profile: ${{ inputs.profile }}
      image_name: ${{ needs.build.outputs.image }}
      image_project: ${{ needs.build.outputs.project }}
      merod_version: ${{ needs.build.outputs.merod_version }}
      log_verbosity: ${{ inputs.log_verbosity }}
      log_auth_check: ${{ inputs.log_auth_check }}
    secrets: inherit

  probe-tdx:
    name: Boot and probe the ${{ inputs.role }} image
    needs: build
    if: ${{ inputs.role != 'node' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      IMAGE_PROJECT: ${{ needs.build.outputs.project }}
      PROFILE: ${{ inputs.profile }}
      VM_PROJECT: ${{ vars.GCP_ATTESTATION_PROJECT_ID != '' && vars.GCP_ATTESTATION_PROJECT_ID || 'cloud-486420' }}
      VM_ZONE: ${{ vars.GCP_ATTESTATION_ZONE != '' && vars.GCP_ATTESTATION_ZONE || 'europe-west4-a' }}
      VM_MACHINE_TYPE: ${{ vars.GCP_ATTESTATION_MACHINE_TYPE != '' && vars.GCP_ATTESTATION_MACHINE_TYPE || 'c3-standard-4' }}
      ITA_APPRAISAL_URL: ${{ vars.ITA_APPRAISAL_URL }}
      ITA_API_KEY: ${{ secrets.ITA_API_KEY }}
      WAIT_TIMEOUT_MINUTES: ${{ inputs.wait_timeout_minutes }}
      PROBE_NAME: ${{ inputs.role }}-mkosi-${{ github.run_number }}-${{ github.run_attempt }}
      OUT_DIR: ${{ github.workspace }}/probe
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the agent probe's provisioning client
        if: ${{ inputs.role == 'agent' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mkosi-agent-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: agent-tools

      # The same credentials the TDX image probes boot their VMs with.
      - name: Authenticate to GCP via service account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # `log_auth_check`: the check release-kms.yaml runs on the KMS and agent
      # images of the debug profiles, here on demand, with the same receiver
      # names (the node release's sweep catches stale ones). Setup refuses
      # locked-read-only (LOG_AUTH_UNSUPPORTED_PROFILE) before creating anything.
      - name: Set up log-auth check
        id: log_auth
        if: ${{ inputs.log_auth_check }}
        env:
          IMAGE_PROFILE: ${{ inputs.profile }}
          VM_NETWORK: default
          VM_SUBNETWORK: ""
          NODE_TAG: ${{ env.PROBE_NAME }}
          RECEIVER_PREFIX: ${{ inputs.role }}-attest-rcv
          RUN_SUFFIX: ${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          TOKEN_FILE: ${{ runner.temp }}/log-auth-token
        run: bash scripts/ci/probes/node_log_auth_probe.sh setup

      - name: Run the two-replica cluster and verify both quotes
        if: ${{ inputs.role == 'kms' }}
        env:
          KMS_PORT: "8080"
          LOGS_ENDPOINT: ${{ steps.log_auth.outputs.receiver_ip && format('http://{0}:9200', steps.log_auth.outputs.receiver_ip) || '' }}
          OBSERVABILITY_TOKEN_FILE: ${{ steps.log_auth.outputs.receiver_ip && format('{0}/log-auth-token', runner.temp) || '' }}
        run: bash scripts/release/kms/run-cluster-probe.sh

      - name: Boot, measure and provision the agent
        if: ${{ inputs.role == 'agent' }}
        env:
          LOGS_ENDPOINT: ${{ steps.log_auth.outputs.receiver_ip && format('http://{0}:9200', steps.log_auth.outputs.receiver_ip) || '' }}
          OBSERVABILITY_TOKEN_FILE: ${{ steps.log_auth.outputs.receiver_ip && format('{0}/log-auth-token', runner.temp) || '' }}
        run: |
          set -euo pipefail
          chmod +x agent-tools/mero-agent-provision
          PROVISION_BIN="${PWD}/agent-tools/mero-agent-provision" bash scripts/release/agent/run-agent-probe.sh

      - name: Verify the image pushed logs with its metadata token
        if: ${{ inputs.log_auth_check }}
        env:
          RECEIVER_PREFIX: ${{ inputs.role }}-attest-rcv
          RUN_SUFFIX: ${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACTS_DIR: ${{ github.workspace }}/probe
          VERIFY_TIMEOUT_SECONDS: "180"
        run: bash scripts/ci/probes/node_log_auth_probe.sh verify

      - name: Delete the log-auth receiver
        if: ${{ always() && steps.log_auth.outcome != 'skipped' && steps.log_auth.outcome != '' }}
        env:
          RECEIVER_PREFIX: ${{ inputs.role }}-attest-rcv
          RUN_SUFFIX: ${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci/probes/node_log_auth_probe.sh cleanup

      - name: Upload the probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mkosi-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe/
          if-no-files-found: ignore
          retention-days: 14

  compare:
    name: Compare the quote with the computed registers
    needs: [build, probe, probe-tdx]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ needs.build.outputs.project }}
      IMAGE: ${{ needs.build.outputs.image }}
      KEEP_IMAGE: ${{ inputs.keep_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the build and probe evidence
        if: ${{ needs.probe.result == 'success' || needs.probe-tdx.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: evidence

      - name: Compare the quote's RTMR1-3 with the computed ones
        if: ${{ needs.probe.result == 'success' || needs.probe-tdx.result == 'success' }}
        env:
          ROLE: ${{ inputs.role }}
        run: |
          set -euo pipefail
          build="$(echo evidence/mkosi-build-*)"
          # The attest response of the booted image, as compute_rtmr.py reads
          # evidence: quoteB64, and eventLogB64 when it returns one. The node's
          # /admin-api/tee/attest, the bootstrap KMS replica's /attest, the
          # agent gate's /attest.
          case "${ROLE}" in
            node) attest="$(echo evidence/node-gcp-staging-probe-*)/tee-attest-response.json" ;;
            kms) attest="$(echo evidence/mkosi-probe-*)/bootstrap-attest.json" ;;
            agent) attest="$(echo evidence/mkosi-probe-*)/agent-attest.json" ;;
          esac
          jq '(.data // .) | {quoteB64, eventLogB64}' "${attest}" > evidence/evidence.json
          python3 scripts/attestation/shared/compute_rtmr.py compare \
            "${build}/computed.json" evidence/evidence.json | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Determine GCP auth mode
        id: auth_mode
        if: ${{ always() }}
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
        run: |
          mode="key"
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            mode="wif"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to GCP via workload identity
        if: ${{ always() && steps.auth_mode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to GCP via service account key
        if: ${{ always() && steps.auth_mode.outputs.mode != 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        if: ${{ always() }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Delete the image
        if: ${{ always() && inputs.keep_image != true }}
        run: gcloud compute images delete "${IMAGE}" --project "${PROJECT}" --quiet || true

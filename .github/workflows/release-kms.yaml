name: Release mero-kms

# Releases mero-kms as GCP Intel TDX images (docs/design/gcp-tdx-kms.md), one
# per profile: merotee-kms-<profile>-<version> in family merotee-kms-<profile>.
# Each image is booted as a two-replica cluster (bootstrap + attested join) and
# both replicas' quotes are verified by Intel Trust Authority; the measured
# MRTD/RTMR0-3 become the KMS allowlist of the signed
# kms-attestation-policy[.<profile>].json that merod applies at
# `tee.kms.attestation`. Publishes mero-kms-v<version> only from a push to
# master, and only when that tag does not exist yet; a manual dispatch builds
# nothing (see scripts/release/kms/get-version-info.sh).
#
# Agents (docs/design/private-agents.md): `agent-image` builds and measures the
# reference agent image per profile (mero-agent-gate and mero-bot, the release
# versions.json pins, else the stub agent) and,
# when that succeeds, the profile's KMS image also serves it (its agent
# allowlist, published as kms-agent-attestation-policy.<profile>.json). It is
# best effort: an agent build or measurement that fails leaves that KMS image
# node-only, exactly as before agents, and never blocks the release.
#
# Inference (docs/design/private-inference.md): `inference-image` builds the
# GPU inference image per profile and measures it on an a3 (H100) TDX VM with
# measure-only, publishing kms-inference-attestation-policy.<profile>.json,
# signed with the rest. Opt-in (repository variable INFERENCE_RELEASE=true: it
# needs H100 quota and costs GPU time) and best effort: no KMS image serves it,
# and a failure only leaves the release without it.
#
# Logs: on debug and debug-read-only, the agent and KMS probe VMs boot with
# `logs-endpoint` and `observability-token` pointed at a throwaway receiver
# (scripts/ci/probes/node_log_auth_probe.sh, as in release-node-image-gcp.yaml),
# and the job fails unless the receiver saw a push carrying that token. A KMS
# image that fails it stops the release; an agent that fails it is left out,
# as above. locked-read-only ships only over https, so it skips the check.
#
# The workflow `name:` is the Sigstore identity merod and the verifiers expect;
# do not rename it.

on:
  push:
    branches:
      - master
    paths:
      - Cargo.toml
      - "mero-kms/Cargo.toml"
      - Cargo.lock
      - "mero-kms/src/**"
      - "mero-tee/playbook-kms.yml"
      - "mero-tee/ansible/roles/mero-kms/**"
      - "mero-agent-gate/**"
      - "mero-tee/playbook-agent.yml"
      - "mero-tee/ansible/roles/mero-agent/**"
      - "scripts/agent/**"
      - "scripts/release/agent/**"
      - "mero-inference-gate/**"
      - "mero-tee/playbook-inference.yml"
      - "mero-tee/ansible/roles/mero-inference/**"
      - "mero-tee/inference/**"
      - "scripts/inference/**"
      - "scripts/release/inference/**"
      - ".github/workflows/release-kms.yaml"
      - "scripts/attestation/**"
      - "scripts/release/kms/**"
  workflow_dispatch:
    inputs:
      log_verbosity:
        description: "Logging verbosity: compact (default) or debug"
        required: false
        type: choice
        options:
          - compact
          - debug
        default: compact

permissions:
  contents: read

concurrency:
  group: release-kms-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI_LOG_VERBOSITY: ${{ github.event_name == 'workflow_dispatch' && inputs.log_verbosity || 'compact' }}
  BINARY_TARGET: x86_64-unknown-linux-gnu
  PACKER_GCP_PROJECT_ID: ${{ vars.GCP_PACKER_PROJECT_ID }}
  PACKER_GCP_REGION: ${{ vars.GCP_PACKER_REGION }}
  PACKER_GCP_ZONE: ${{ vars.GCP_PACKER_ZONE }}
  PACKER_GCP_SUBNETWORK: ${{ vars.GCP_PACKER_SUBNETWORK }}
  VM_PROJECT: ${{ vars.GCP_ATTESTATION_PROJECT_ID != '' && vars.GCP_ATTESTATION_PROJECT_ID || 'cloud-486420' }}
  VM_ZONE: ${{ vars.GCP_ATTESTATION_ZONE != '' && vars.GCP_ATTESTATION_ZONE || 'europe-west4-a' }}
  VM_MACHINE_TYPE: ${{ vars.GCP_ATTESTATION_MACHINE_TYPE != '' && vars.GCP_ATTESTATION_MACHINE_TYPE || 'c3-standard-4' }}
  ITA_APPRAISAL_URL: ${{ vars.ITA_APPRAISAL_URL }}
  KMS_PORT: "8080"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      kms_release_tag: ${{ steps.version_info.outputs.kms_release_tag }}
      publish_release: ${{ steps.version_info.outputs.publish_release }}
      target_commit: ${{ steps.version_info.outputs.target_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release helper scripts
        run: |
          set -euo pipefail
          for script in scripts/release/kms/*.sh scripts/release/verify-kms-release-assets.sh \
            scripts/release/agent/run-agent-probe.sh scripts/release/inference/run-inference-probe.sh \
            scripts/ci/probes/node_log_auth_probe.sh scripts/ci/probes/log_auth_metadata.sh; do
            bash -n "${script}"
          done
          python3 -m py_compile \
            scripts/ci/probes/log_auth_receiver.py \
            scripts/attestation/shared/verify_tdx_quote_ita.py \
            scripts/attestation/shared/extract_tdx_policy_candidates.py

      - name: Get version info
        id: version_info
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
        run: bash scripts/release/kms/get-version-info.sh

  node-policy:
    name: Wait for the node release
    needs: prepare
    if: ${{ github.ref == 'refs/heads/master' && needs.prepare.outputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    # wait-for-node-release.sh polls up to 90 minutes for the image build.
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign to verify the node policy
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Wait for mero-tee-v${{ needs.prepare.outputs.version }}, fetch its node policy and verify its signature
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NODE_TAG: mero-tee-v${{ needs.prepare.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/release/kms/wait-for-node-release.sh

      - name: Upload node policy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-policy
          path: node-policy/published-mrtds.json
          retention-days: 2

  build-binary:
    name: Build mero-kms
    needs: prepare
    if: ${{ github.ref == 'refs/heads/master' && needs.prepare.outputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-mero-kms

      # One binary for every profile (the profile is baked into the image's
      # env), and the archive published is the binary the images run.
      - name: Build binary
        run: |
          set -euo pipefail
          cargo build --release --locked -p mero-kms
          mkdir -p artifacts
          tar -czf "artifacts/mero-kms_${BINARY_TARGET}.tar.gz" -C target/release mero-kms

      - name: Upload binary archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mero-kms-binary
          path: artifacts/*.tar.gz
          retention-days: 2

  agent-image:
    name: Build and measure agent image (${{ matrix.profile }})
    needs: prepare
    if: ${{ github.ref == 'refs/heads/master' && needs.prepare.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Best effort: see the header. kms-image does not depend on this job's result.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, debug-read-only, locked-read-only]
    permissions:
      contents: read
      id-token: write
    env:
      PROFILE: ${{ matrix.profile }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PROBE_NAME: agent-rel-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The log-auth check, as in the node release, on debug and
      # debug-read-only only: configure_vector.sh lets no other profile ship
      # over the receiver's plain http, and agent-init hands it the same two
      # keys and its role's image-profile. See "Set up log-auth check".
      LOG_AUTH_CHECK: ${{ matrix.profile != 'locked-read-only' }}
      RECEIVER_PREFIX: agent-attest-rcv
      RUN_SUFFIX: ${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-mero-agent-gate

      - name: Build mero-agent-gate and stage the reference agent
        run: |
          set -euo pipefail
          cargo build --release --locked -p mero-agent-gate
          mkdir -p agent probe
          cp target/release/mero-agent-gate target/release/mero-agent-provision agent/
          cp scripts/agent/stub-mero-agent.py agent/mero-agent

      # The release's agent is mero-bot once versions.json pins it
      # (meroBotVersion, with its sha256 in build-inputs.lock.json); until then,
      # the stub. The bundle is checked against its pin again in the build
      # (mero-agent role). A pin without the token fails this job, which leaves
      # the KMS image node-only, as any failed agent build does.
      - name: Download the pinned mero-bot bundle
        env:
          GH_TOKEN: ${{ secrets.MERO_BOT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          version="$(jq -r '.meroBotVersion // empty' mero-tee/versions.json)"
          if [[ -z "${version}" ]]; then
            echo "versions.json pins no meroBotVersion: the reference agent is the stub"
            exit 0
          fi
          [[ -n "${GH_TOKEN}" ]] || { echo "::error::versions.json pins mero-bot ${version}; the release needs the MERO_BOT_RELEASE_TOKEN secret to fetch it"; exit 1; }
          asset="mero-bot-${version}-linux-x64.tar.gz"
          gh release download "v${version}" --repo calimero-network/mero-bot --pattern "${asset}" --dir agent
          want="$(jq -r --arg a "${asset}" '.meroBot.sha256[$a] // empty' mero-tee/build-inputs.lock.json)"
          [[ -n "${want}" ]] || { echo "::error::build-inputs.lock.json pins no sha256 for ${asset}; run scripts/release/pin-build-inputs.sh"; exit 1; }
          echo "${want}  agent/${asset}" | sha256sum -c -
          echo "MERO_BOT_BUNDLE=$(realpath "agent/${asset}")" >>"${GITHUB_ENV}"

      - name: Record the agent's inputs
        run: |
          set -euo pipefail
          if [[ -n "${MERO_BOT_BUNDLE:-}" ]]; then
            sha256sum scripts/agent/mero-bot-agent.sh "agent/$(basename "${MERO_BOT_BUNDLE}")" agent/mero-agent-gate
          else
            sha256sum agent/mero-agent agent/mero-agent-gate
          fi | tee probe/agent-binaries.sha256

      - name: Determine GCP auth mode
        id: auth_mode
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            echo "mode=wif" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${SA_KEY}" ]]; then
            echo "mode=key" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_PACKER_SERVICE_ACCOUNT_EMAIL, or GCP_SERVICE_ACCOUNT_KEY."
            exit 1
          fi

      - name: Authenticate to GCP via workload identity
        if: ${{ steps.auth_mode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to GCP via service account key
        if: ${{ steps.auth_mode.outputs.mode == 'key' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Built with mkosi (mero-tee/mkosi-image, mdma#480), under the name mdma
      # looks up (release-image-name.sh). The release agent image: kept, so the post-release agent
      # e2e boots the image this KMS serves, and mdma boots it by this exact
      # name (merotee-agent-<profile>-<version>) for its agent hosts.
      - name: Set up mkosi
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Install the build tools
        run: scripts/release/mkosi/install-tools.sh

      - name: Build the agent image
        id: build_image
        env:
          ROLE: agent
          MKOSI_OUT: ${{ runner.temp }}/mkosi-out
          EVIDENCE_DIR: ${{ runner.temp }}/mkosi-evidence
          UPLOAD_BUCKET: ${{ vars.GCP_IMAGE_UPLOAD_BUCKET }}
        run: |
          set -euo pipefail
          export MERO_AGENT_GATE_BINARY="${PWD}/agent/mero-agent-gate"
          # With MERO_BOT_BUNDLE, build.sh bakes the mero-bot launcher instead.
          [[ -n "${MERO_BOT_BUNDLE:-}" ]] || export MERO_AGENT_BINARY="${PWD}/agent/mero-agent"
          scripts/release/mkosi/build-image.sh 2>&1 | tee /tmp/mkosi-agent-build.log
          names="$(scripts/release/mkosi/release-image-name.sh agent "${PROFILE}" "${VERSION}")"
          IMAGE_NAME="$(sed -n 's/^name=//p' <<< "${names}")"
          IMAGE_FAMILY="$(sed -n 's/^family=//p' <<< "${names}")"
          IMAGE_DESCRIPTION="$(sed -n 's/^description=//p' <<< "${names}")"
          IMAGE_PROJECT="${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          export IMAGE_NAME IMAGE_FAMILY IMAGE_DESCRIPTION IMAGE_PROJECT REPLACE=true
          scripts/release/mkosi/create-gce-image.sh

      - name: Show build log on failure
        if: ${{ failure() && steps.build_image.outcome == 'failure' }}
        run: tail -200 /tmp/mkosi-agent-build.log 2>/dev/null || true

      # The agent must ship its logs before its allowlist reaches a KMS image:
      # 2.3.120's agent image ran a vector that exited at boot. A throwaway
      # receiver VM (node_log_auth_probe.sh, as in the node release) stands in
      # for the sink, and the measurement VM boots with `logs-endpoint` pointed
      # at it and a random `observability-token`, the two keys mdma sets.
      # Neither is measured (agent-init reads them after extending RTMR3), so
      # the allowlist is the one an mdma agent has. The probe VM sits on the
      # `default` network, so the receiver does too (no VM_SUBNETWORK), and its
      # rule admits the probe VM's tag on tcp:9200.
      - name: Set up log-auth check
        id: log_auth
        if: ${{ env.LOG_AUTH_CHECK == 'true' }}
        env:
          IMAGE_PROFILE: ${{ matrix.profile }}
          VM_NETWORK: default
          VM_SUBNETWORK: ""
          NODE_TAG: ${{ env.PROBE_NAME }}
          TOKEN_FILE: ${{ runner.temp }}/log-auth-token
        run: bash scripts/ci/probes/node_log_auth_probe.sh setup

      # Measures only, on an ephemeral store: the measurement VM is never
      # claimed. Provisioning is checked end to end by the post-release agent
      # e2e, which claims its own VM with a throwaway key.
      - name: Boot and measure the agent image
        env:
          ITA_API_KEY: ${{ secrets.ITA_API_KEY }}
          PROVISION_MODE: skip
          OUT_DIR: probe
          LOGS_ENDPOINT: ${{ steps.log_auth.outputs.receiver_ip && format('http://{0}:9200', steps.log_auth.outputs.receiver_ip) || '' }}
          OBSERVABILITY_TOKEN_FILE: ${{ steps.log_auth.outputs.receiver_ip && format('{0}/log-auth-token', runner.temp) || '' }}
        run: |
          set -euo pipefail
          export IMAGE="merotee-agent-${PROFILE}-${VERSION//./-}"
          export IMAGE_PROJECT="${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          bash scripts/release/agent/run-agent-probe.sh
          gcloud compute images describe "${IMAGE}" --project "${IMAGE_PROJECT}" --format=json \
            | jq --arg project "${IMAGE_PROJECT}" '{name, family, id, project: $project}' > probe/agent-image.json

      # After the probe, whose trap has deleted the VM: the receiver keeps each
      # push on its own serial console, and vector pushes within seconds of
      # agent-init starting it, before the gate answers the probe at all. A
      # failure fails this job, so the agent image is deleted below and its
      # allowlist never uploaded: that profile's KMS image serves nodes only,
      # as for any agent that fails here (see the header).
      - name: Verify the agent pushed logs with its metadata token
        id: verify_log_auth
        if: ${{ env.LOG_AUTH_CHECK == 'true' }}
        env:
          ARTIFACTS_DIR: probe
          VERIFY_TIMEOUT_SECONDS: "180"
        run: bash scripts/ci/probes/node_log_auth_probe.sh verify

      # mdma#480: the quote's RTMR1-3 must be the ones computed from the build.
      - name: Compare the quote's RTMR1-3 with the computed ones
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mkosi-evidence
        run: |
          set -euo pipefail
          cp "${EVIDENCE_DIR}/computed.json" "probe/agent-computed-rtmrs.${PROFILE}.json"
          jq '{quoteB64, eventLogB64}' probe/agent-attest.json > "${RUNNER_TEMP}/evidence.json"
          python3 scripts/attestation/shared/compute_rtmr.py compare \
            "${EVIDENCE_DIR}/computed.json" "${RUNNER_TEMP}/evidence.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload the agent policy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-policy-${{ needs.prepare.outputs.version }}-${{ matrix.profile }}
          path: |
            probe/agent-attestation-policy.${{ matrix.profile }}.json
            probe/agent-image.json
            probe/agent-binaries.sha256
            probe/agent-computed-rtmrs.${{ matrix.profile }}.json
          retention-days: 7

      - name: Delete the agent image if it was not measured
        if: ${{ failure() && steps.build_image.outcome == 'success' }}
        run: |
          gcloud compute images delete "merotee-agent-${PROFILE}-${VERSION//./-}" \
            --project "${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}" --quiet || true

      # On success, failure and cancellation, once setup has started. Best
      # effort and safe after a partial setup. The node release's sweep deletes
      # a receiver a lost runner left, once past its max age.
      - name: Delete the log-auth receiver
        if: ${{ always() && steps.log_auth.outcome != 'skipped' && steps.log_auth.outcome != '' }}
        run: bash scripts/ci/probes/node_log_auth_probe.sh cleanup

  inference-image:
    name: Build and measure inference image (${{ matrix.profile }})
    needs: prepare
    if: ${{ github.ref == 'refs/heads/master' && needs.prepare.outputs.publish_release == 'true' && vars.INFERENCE_RELEASE == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Best effort: see the header. Nothing waits on its success.
    continue-on-error: true
    strategy:
      fail-fast: false
      # One GPU VM at a time: H100 quota is usually one or two.
      max-parallel: 1
      matrix:
        profile: [debug, debug-read-only, locked-read-only]
    permissions:
      contents: read
      id-token: write
    env:
      PROFILE: ${{ matrix.profile }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PROBE_NAME: inf-rel-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
      LOG_AUTH_CHECK: ${{ matrix.profile != 'locked-read-only' }}
      RECEIVER_PREFIX: inference-attest-rcv
      RUN_SUFFIX: ${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The shape hosts run on: RTMR0 measures it. a3-highgpu-1g is one H100.
      INFERENCE_VM_MACHINE_TYPE: ${{ vars.INFERENCE_VM_MACHINE_TYPE != '' && vars.INFERENCE_VM_MACHINE_TYPE || 'a3-highgpu-1g' }}
      INFERENCE_VM_ZONE: ${{ vars.INFERENCE_VM_ZONE != '' && vars.INFERENCE_VM_ZONE || 'us-central1-a us-east5-a europe-west4-c' }}
      INFERENCE_VM_PROVISIONING_MODEL: ${{ vars.INFERENCE_VM_PROVISIONING_MODEL != '' && vars.INFERENCE_VM_PROVISIONING_MODEL || 'STANDARD' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # vLLM and torch's CUDA libraries are several GB installed, and the
      # image is built beside them: make room on the runner.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-mero-inference-gate

      - name: Build mero-inference-gate
        run: |
          set -euo pipefail
          cargo build --release --locked -p mero-inference-gate
          mkdir -p inference probe
          cp target/release/mero-inference-gate inference/
          sha256sum inference/mero-inference-gate mero-tee/inference/requirements.lock | tee probe/inference-inputs.sha256

      - name: Determine GCP auth mode
        id: auth_mode
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            echo "mode=wif" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${SA_KEY}" ]]; then
            echo "mode=key" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_PACKER_SERVICE_ACCOUNT_EMAIL, or GCP_SERVICE_ACCOUNT_KEY."
            exit 1
          fi

      - name: Authenticate to GCP via workload identity
        if: ${{ steps.auth_mode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to GCP via service account key
        if: ${{ steps.auth_mode.outputs.mode == 'key' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set up mkosi
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Install the build tools
        run: scripts/release/mkosi/install-tools.sh

      # Kept under the name mdma looks up (release-image-name.sh): its
      # dispatcher boots merotee-inference-<profile>-<version> for its hosts.
      - name: Build the inference image
        id: build_image
        env:
          ROLE: inference
          MKOSI_OUT: ${{ runner.temp }}/mkosi-out
          EVIDENCE_DIR: ${{ runner.temp }}/mkosi-evidence
          UPLOAD_BUCKET: ${{ vars.GCP_IMAGE_UPLOAD_BUCKET }}
        run: |
          set -euo pipefail
          export MERO_INFERENCE_GATE_BINARY="${PWD}/inference/mero-inference-gate"
          scripts/release/mkosi/build-image.sh 2>&1 | tee /tmp/mkosi-inference-build.log
          names="$(scripts/release/mkosi/release-image-name.sh inference "${PROFILE}" "${VERSION}")"
          IMAGE_NAME="$(sed -n 's/^name=//p' <<< "${names}")"
          IMAGE_FAMILY="$(sed -n 's/^family=//p' <<< "${names}")"
          IMAGE_DESCRIPTION="$(sed -n 's/^description=//p' <<< "${names}")"
          IMAGE_PROJECT="${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          export IMAGE_NAME IMAGE_FAMILY IMAGE_DESCRIPTION IMAGE_PROJECT REPLACE=true
          scripts/release/mkosi/create-gce-image.sh

      - name: Show build log on failure
        if: ${{ failure() && steps.build_image.outcome == 'failure' }}
        run: tail -200 /tmp/mkosi-inference-build.log 2>/dev/null || true

      # As for the agent: the measurement VM must ship its logs with the token
      # mdma would set. Neither key is measured. The receiver stays in the
      # job's VM_ZONE, where verify and cleanup look for it; the GPU VM
      # reaches its internal address from any zone of the default network.
      - name: Set up log-auth check
        id: log_auth
        if: ${{ env.LOG_AUTH_CHECK == 'true' }}
        env:
          IMAGE_PROFILE: ${{ matrix.profile }}
          VM_NETWORK: default
          VM_SUBNETWORK: ""
          NODE_TAG: ${{ env.PROBE_NAME }}
          TOKEN_FILE: ${{ runner.temp }}/log-auth-token
        run: bash scripts/ci/probes/node_log_auth_probe.sh setup

      - name: Boot and measure the inference image
        env:
          ITA_API_KEY: ${{ secrets.ITA_API_KEY }}
          OUT_DIR: probe
          VM_ZONE: ${{ env.INFERENCE_VM_ZONE }}
          VM_MACHINE_TYPE: ${{ env.INFERENCE_VM_MACHINE_TYPE }}
          VM_PROVISIONING_MODEL: ${{ env.INFERENCE_VM_PROVISIONING_MODEL }}
          LOGS_ENDPOINT: ${{ steps.log_auth.outputs.receiver_ip && format('http://{0}:9200', steps.log_auth.outputs.receiver_ip) || '' }}
          OBSERVABILITY_TOKEN_FILE: ${{ steps.log_auth.outputs.receiver_ip && format('{0}/log-auth-token', runner.temp) || '' }}
        run: |
          set -euo pipefail
          export IMAGE="merotee-inference-${PROFILE}-${VERSION//./-}"
          export IMAGE_PROJECT="${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          bash scripts/release/inference/run-inference-probe.sh
          gcloud compute images describe "${IMAGE}" --project "${IMAGE_PROJECT}" --format=json \
            | jq --arg project "${IMAGE_PROJECT}" '{name, family, id, project: $project}' > probe/inference-image.json

      - name: Verify the inference VM pushed logs with its metadata token
        id: verify_log_auth
        if: ${{ env.LOG_AUTH_CHECK == 'true' }}
        env:
          ARTIFACTS_DIR: probe
          VERIFY_TIMEOUT_SECONDS: "180"
        run: bash scripts/ci/probes/node_log_auth_probe.sh verify

      # RTMR1-3 against the ones computed from the build; RTMR3 is the image
      # event alone on a measure-only VM, which is what the build computes.
      - name: Compare the quote's RTMR1-3 with the computed ones
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mkosi-evidence
        run: |
          set -euo pipefail
          cp "${EVIDENCE_DIR}/computed.json" "probe/inference-computed-rtmrs.${PROFILE}.json"
          jq '{quoteB64}' probe/inference-attest.json > "${RUNNER_TEMP}/evidence.json"
          python3 scripts/attestation/shared/compute_rtmr.py compare \
            "${EVIDENCE_DIR}/computed.json" "${RUNNER_TEMP}/evidence.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Stamp the inference policy with its release
        run: |
          set -euo pipefail
          policy="probe/inference-attestation-policy.${PROFILE}.json"
          jq --arg v "${VERSION}" '. + {version: $v}' "${policy}" > "${policy}.tmp"
          mv "${policy}.tmp" "${policy}"

      - name: Upload the inference policy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inference-policy-${{ needs.prepare.outputs.version }}-${{ matrix.profile }}
          path: |
            probe/inference-attestation-policy.${{ matrix.profile }}.json
            probe/inference-image.json
            probe/inference-inputs.sha256
            probe/inference-computed-rtmrs.${{ matrix.profile }}.json
          retention-days: 7

      - name: Delete the inference image if it was not measured
        if: ${{ failure() && steps.build_image.outcome == 'success' }}
        run: |
          gcloud compute images delete "merotee-inference-${PROFILE}-${VERSION//./-}" \
            --project "${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}" --quiet || true

      - name: Delete the log-auth receiver
        if: ${{ always() && steps.log_auth.outcome != 'skipped' && steps.log_auth.outcome != '' }}
        run: bash scripts/ci/probes/node_log_auth_probe.sh cleanup

  kms-image:
    name: Build and probe KMS image (${{ matrix.profile }})
    needs: [prepare, node-policy, build-binary, agent-image]
    # Whatever agent-image concluded: it only adds an agent allowlist.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/master' &&
          needs.prepare.outputs.publish_release == 'true' &&
          needs.node-policy.result == 'success' && needs.build-binary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, debug-read-only, locked-read-only]
    permissions:
      contents: read
      id-token: write
    env:
      PROFILE: ${{ matrix.profile }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PROBE_NAME: kms-rel-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The log-auth check, as in the node release, on debug and
      # debug-read-only only: configure_vector.sh lets no other profile ship
      # over the receiver's plain http, and kms-init hands it the same two keys
      # and its role's image-profile. See "Set up log-auth check".
      LOG_AUTH_CHECK: ${{ matrix.profile != 'locked-read-only' }}
      RECEIVER_PREFIX: kms-attest-rcv
      RUN_SUFFIX: ${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binary archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mero-kms-binary
          path: artifacts/

      - name: Download node policy
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-policy
          path: node-policy/

      - name: Stage the binary and the node allowlist the KMS serves
        run: |
          set -euo pipefail
          image_version="$(jq -r '.imageVersion' mero-tee/versions.json)"
          if [[ "${image_version}" != "${VERSION}" ]]; then
            echo "::error::mero-tee/versions.json imageVersion ${image_version} != mero-kms ${VERSION}; the image would be named for the wrong release"
            exit 1
          fi
          mkdir -p build probe
          tar -xzf "artifacts/mero-kms_${BINARY_TARGET}.tar.gz" -C build --no-same-owner
          # Verified against the node release's signature in the node-policy
          # job; its values are checked here before they reach the measured kms.env.
          bash scripts/release/kms/extract-node-allowlist.sh \
            node-policy/published-mrtds.json "${PROFILE}" build/node-allowlist.json

      - name: Download the agent policy, if the agent image was measured
        id: agent_policy
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-policy-${{ needs.prepare.outputs.version }}-${{ matrix.profile }}
          path: agent-policy/

      # The KMS keeps one TCB list for every role (the mero-kms role asserts the
      # two files agree), so the agent entry takes the node's. Copied into the
      # probe artifacts, so release-metadata publishes exactly what was baked.
      - name: Stage the agent allowlist the KMS serves
        id: agent_allowlist
        run: |
          set -euo pipefail
          policy="agent-policy/agent-attestation-policy.${PROFILE}.json"
          if [[ ! -s "${policy}" ]]; then
            echo "::warning::No measured ${PROFILE} agent image: this KMS image serves nodes only"
            echo "file=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          jq --slurpfile node build/node-allowlist.json \
            '{allowed_tcb_statuses: $node[0].allowed_tcb_statuses,
              allowed_mrtd, allowed_rtmr0, allowed_rtmr1, allowed_rtmr2, allowed_rtmr3}' \
            "${policy}" > build/agent-allowlist.json
          jq -e 'all(.[]; type == "array" and length > 0)' build/agent-allowlist.json >/dev/null \
            || { echo "::warning::The ${PROFILE} agent policy is incomplete; serving nodes only"; echo "file=" >> "${GITHUB_OUTPUT}"; exit 0; }
          # This run measured the agent image, so there is no signature to check,
          # but its values reach kms.env as AGENT_ALLOWED_*: same rules as the node's.
          bash scripts/release/kms/extract-node-allowlist.sh --check build/agent-allowlist.json
          jq --arg p "${PROFILE}" --arg v "${VERSION}" \
            '. + {schema_version: 1, role: "agent", profile: $p, version: $v}' \
            build/agent-allowlist.json > "probe/agent-attestation-policy.${PROFILE}.json"
          cp agent-policy/agent-image.json probe/agent-image.json 2>/dev/null || true
          echo "file=../build/agent-allowlist.json" >> "${GITHUB_OUTPUT}"

      - name: Determine GCP auth mode
        id: auth_mode
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            echo "mode=wif" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${SA_KEY}" ]]; then
            echo "mode=key" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_PACKER_SERVICE_ACCOUNT_EMAIL, or GCP_SERVICE_ACCOUNT_KEY."
            exit 1
          fi

      - name: Authenticate to GCP via workload identity
        if: ${{ steps.auth_mode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to GCP via service account key
        if: ${{ steps.auth_mode.outputs.mode == 'key' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Built with mkosi (mero-tee/mkosi-image, mdma#480), under the name mdma
      # looks up (release-image-name.sh). No IMAGE_SUFFIX: this is the release image mdma deploys.
      # REPLACE lets a re-run replace an image a failed earlier attempt left
      # behind; the release tag does not exist yet (publish_release), so nothing
      # published refers to it.
      - name: Set up mkosi
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Install the build tools
        run: scripts/release/mkosi/install-tools.sh

      - name: Build the KMS image
        id: build_image
        env:
          ROLE: kms
          MKOSI_OUT: ${{ runner.temp }}/mkosi-out
          EVIDENCE_DIR: ${{ runner.temp }}/mkosi-evidence
          UPLOAD_BUCKET: ${{ vars.GCP_IMAGE_UPLOAD_BUCKET }}
          AGENT_ALLOWLIST: ${{ steps.agent_allowlist.outputs.file }}
        run: |
          set -euo pipefail
          export MERO_KMS_BINARY="${PWD}/build/mero-kms"
          export KMS_NODE_POLICY_FILE="${PWD}/build/node-allowlist.json"
          if [[ -n "${AGENT_ALLOWLIST}" ]]; then
            export KMS_AGENT_POLICY_FILE="${PWD}/build/agent-allowlist.json"
          fi
          scripts/release/mkosi/build-image.sh 2>&1 | tee /tmp/mkosi-build.log
          names="$(scripts/release/mkosi/release-image-name.sh kms "${PROFILE}" "${VERSION}")"
          IMAGE_NAME="$(sed -n 's/^name=//p' <<< "${names}")"
          IMAGE_FAMILY="$(sed -n 's/^family=//p' <<< "${names}")"
          IMAGE_DESCRIPTION="$(sed -n 's/^description=//p' <<< "${names}")"
          IMAGE_PROJECT="${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          export IMAGE_NAME IMAGE_FAMILY IMAGE_DESCRIPTION IMAGE_PROJECT REPLACE=true
          scripts/release/mkosi/create-gce-image.sh

      - name: Show build log on failure
        if: ${{ failure() && steps.build_image.outcome == 'failure' }}
        run: tail -200 /tmp/mkosi-build.log 2>/dev/null || true

      - name: Record the image
        id: image
        run: |
          set -euo pipefail
          image="merotee-kms-${PROFILE}-${VERSION//./-}"
          image_project="${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          gcloud compute images describe "${image}" --project "${image_project}" --format=json \
            | jq --arg project "${image_project}" '{
                name, family, id, project: $project,
                self_link: .selfLink, creation_timestamp: .creationTimestamp
              }' > probe/image.json
          jq -e --arg f "merotee-kms-${PROFILE}" '.family == $f' probe/image.json >/dev/null \
            || { echo "::error::${image} is not in family merotee-kms-${PROFILE}"; exit 1; }
          cat probe/image.json
          {
            echo "name=${image}"
            echo "project=${image_project}"
          } >> "${GITHUB_OUTPUT}"

      # The KMS must ship its logs before its release publishes: 2.3.120's KMS
      # image ran a vector that exited at boot. A throwaway receiver VM
      # (node_log_auth_probe.sh, as in the node release) stands in for the
      # sink, and the bootstrap replica boots with `logs-endpoint` pointed at
      # it and a random `observability-token`, the two keys mdma sets. One
      # replica is enough: both boot this image through the same kms-init, and
      # the bootstrap lives through the whole probe. Neither key is measured
      # (kms-init reads them after extending RTMR3), so the joiner still
      # measures like the bootstrap and the published measurements are the
      # ones an mdma replica has. The replicas sit on the `default` network, so
      # the receiver does too (no VM_SUBNETWORK), and its rule admits their tag
      # on tcp:9200.
      - name: Set up log-auth check
        id: log_auth
        if: ${{ env.LOG_AUTH_CHECK == 'true' }}
        env:
          IMAGE_PROFILE: ${{ matrix.profile }}
          VM_NETWORK: default
          VM_SUBNETWORK: ""
          NODE_TAG: ${{ env.PROBE_NAME }}
          TOKEN_FILE: ${{ runner.temp }}/log-auth-token
        run: bash scripts/ci/probes/node_log_auth_probe.sh setup

      - name: Run the two-replica cluster and measure the image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_PROJECT: ${{ steps.image.outputs.project }}
          ITA_API_KEY: ${{ secrets.ITA_API_KEY }}
          OUT_DIR: probe
          LOGS_ENDPOINT: ${{ steps.log_auth.outputs.receiver_ip && format('http://{0}:9200', steps.log_auth.outputs.receiver_ip) || '' }}
          OBSERVABILITY_TOKEN_FILE: ${{ steps.log_auth.outputs.receiver_ip && format('{0}/log-auth-token', runner.temp) || '' }}
        run: bash scripts/release/kms/run-cluster-probe.sh

      # After the probe, whose trap has deleted the replicas: the receiver keeps
      # each push on its own serial console. A failure fails this profile, so
      # its image is deleted below and release-metadata, which needs every
      # profile, publishes nothing.
      - name: Verify the KMS pushed logs with its metadata token
        id: verify_log_auth
        if: ${{ env.LOG_AUTH_CHECK == 'true' }}
        env:
          ARTIFACTS_DIR: probe
          VERIFY_TIMEOUT_SECONDS: "180"
        run: bash scripts/ci/probes/node_log_auth_probe.sh verify

      # mdma#480: the quote's RTMR1-3 must be the ones computed from the build.
      - name: Compare the quote's RTMR1-3 with the computed ones
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mkosi-evidence
        run: |
          set -euo pipefail
          cp "${EVIDENCE_DIR}/computed.json" "probe/kms-computed-rtmrs.${PROFILE}.json"
          jq '{quoteB64, eventLogB64}' probe/bootstrap-attest.json > "${RUNNER_TEMP}/evidence.json"
          python3 scripts/attestation/shared/compute_rtmr.py compare \
            "${EVIDENCE_DIR}/computed.json" "${RUNNER_TEMP}/evidence.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload probe artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kms-probe-${{ needs.prepare.outputs.version }}-${{ matrix.profile }}
          path: probe/
          if-no-files-found: ignore
          retention-days: 7

      # An image that failed its probe never stays in a release family.
      - name: Delete the image if it was not proven
        if: ${{ failure() && steps.build_image.outcome == 'success' }}
        run: |
          gcloud compute images delete "merotee-kms-${PROFILE}-${VERSION//./-}" \
            --project "${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}" --quiet || true

      # On success, failure and cancellation, once setup has started. Best
      # effort and safe after a partial setup. The node release's sweep deletes
      # a receiver a lost runner left, once past its max age.
      - name: Delete the log-auth receiver
        if: ${{ always() && steps.log_auth.outcome != 'skipped' && steps.log_auth.outcome != '' }}
        run: bash scripts/ci/probes/node_log_auth_probe.sh cleanup

  release-metadata:
    name: Release Metadata
    needs: [prepare, node-policy, build-binary, kms-image, inference-image]
    # Explicit results rather than the implicit success(): kms-image runs after
    # the best-effort agent-image, whatever it concluded, and so must this; and
    # after the best-effort, opt-in inference-image, whatever it concluded.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/master' &&
          needs.prepare.outputs.publish_release == 'true' &&
          needs.node-policy.result == 'success' && needs.build-binary.result == 'success' &&
          needs.kms-image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binary archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mero-kms-binary
          path: artifacts/

      - name: Download node policy
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-policy
          path: node-policy/

      - name: Download probe artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kms-probe-${{ needs.prepare.outputs.version }}-*
          path: probe-artifacts/

      - name: Download inference policies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: inference-policy-${{ needs.prepare.outputs.version }}-*
          path: inference-artifacts/

      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate release checksums, manifest, compatibility map and attestation policies
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_WORKFLOW_NAME: ${{ github.workflow }}
          GH_REF_NAME: ${{ github.ref }}
          PREP_VERSION: ${{ needs.prepare.outputs.version }}
          PREP_KMS_RELEASE_TAG: ${{ needs.prepare.outputs.kms_release_tag }}
          PREP_TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          syft dir:artifacts -o "spdx-json=release-assets/kms-binaries-sbom.spdx.json"
          bash scripts/release/kms/assemble-release-assets.sh
          # The agent allowlist each KMS image bakes, for the profiles that
          # serve agents; signed with the rest (sign-release-assets.sh).
          for policy in probe-artifacts/kms-probe-"${PREP_VERSION}"-*/agent-attestation-policy.*.json; do
            [[ -f "${policy}" ]] || continue
            profile="$(jq -r '.profile' "${policy}")"
            cp "${policy}" "release-assets/kms-agent-attestation-policy.${profile}.json"
            echo "Publishing the ${profile} agent allowlist"
          done
          # The inference allowlists (docs/design/private-inference.md), for the
          # profiles whose GPU measurement ran; no KMS image serves them.
          for policy in inference-artifacts/inference-policy-"${PREP_VERSION}"-*/inference-attestation-policy.*.json; do
            [[ -f "${policy}" ]] || continue
            profile="$(jq -r '.profile' "${policy}")"
            jq -e --arg v "${PREP_VERSION}" '.role == "inference" and .version == $v' "${policy}" >/dev/null \
              || { echo "::warning::${policy} is not this release's inference allowlist; not publishing it"; continue; }
            cp "${policy}" "release-assets/kms-inference-attestation-policy.${profile}.json"
            echo "Publishing the ${profile} inference allowlist"
          done

      - name: Install cosign for keyless signing
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign release assets with Sigstore keyless
        env:
          COSIGN_YES: "true"
          PREP_VERSION: ${{ needs.prepare.outputs.version }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/release/kms/sign-release-assets.sh

      - name: Verify generated signatures (sanity check)
        env:
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
          GH_REPOSITORY: ${{ github.repository }}
        run: bash scripts/release/kms/verify-generated-signatures.sh

      # release-assets/kms-* is every trust asset and its .sig/.pem/.bundle.json;
      # the archives' sidecars are named after the archives.
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          tag_name: ${{ needs.prepare.outputs.kms_release_tag }}
          target_commitish: ${{ needs.prepare.outputs.target_commit }}
          make_latest: false
          draft: false
          body_path: release-assets/release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            release-assets/mero-kms_*.tar.gz.sig
            release-assets/mero-kms_*.tar.gz.pem
            release-assets/mero-kms_*.tar.gz.bundle.json
            release-assets/kms-*

      - name: Enforce release notes body update
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.prepare.outputs.kms_release_tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-assets/release-notes.md \
            --draft=false

      - name: Smoke test published mero-kms release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/verify-kms-release-assets.sh "${{ needs.prepare.outputs.kms_release_tag }}"

      - name: Upsert umbrella version release links
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}
        run: bash scripts/release/kms/upsert-umbrella-release-links.sh

      - name: Summarize release-metadata outcome
        if: ${{ always() }}
        run: |
          set -euo pipefail
          source scripts/ci/logging.sh
          result_line="$(ci_result "release-kms-release-metadata" "${{ job.status }}" "RELEASE_METADATA_PIPELINE" "kms_tag=${{ needs.prepare.outputs.kms_release_tag }}" "run_id=${GITHUB_RUN_ID}")"
          ci_info "${result_line}"
          python3 scripts/ci/summary/write_workflow_summary.py \
            --output "${GITHUB_STEP_SUMMARY}" \
            --inputs-line "- KMS tag: ${{ needs.prepare.outputs.kms_release_tag }}" \
            --inputs-line "- Version: ${{ needs.prepare.outputs.version }}" \
            --result-line "- Job status: ${{ job.status }}" \
            --result-line "- ${result_line}" \
            --artifacts-line "- Release assets uploaded to ${{ needs.prepare.outputs.kms_release_tag }}; images merotee-kms-<profile>-<version>" \
            --next-line "- Deploy the KMS cluster from the released images; nodes verify it with kms-attestation-policy.json."

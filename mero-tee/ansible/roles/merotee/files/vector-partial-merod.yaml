# Partial Vector config for locked-down image (R7). configure_vector.sh appends the sink.
sources:
  app_journal:
    type: journald
    # `fleet-sidecar.service` is here because on a locked image this is the ONLY
    # way its output ever leaves the node. There is no shell on a confidential
    # VM -- that is the point of one -- so `/run/calimero/fleet-sidecar.log` is
    # unreadable by anyone, forever, and a unit missing from this list is a
    # subsystem that cannot be debugged at all.
    #
    # The sidecar is the whole of a node's relay lifecycle: reading its account,
    # attested registration, the CSR, certificate install, joins and leaves.
    # When a node silently failed to appear as a relay, every one of those steps
    # had already logged its reason on the box, and none of it was reachable.
    #
    # Cheap: `log` is called on events, not per cycle, so a healthy node is
    # quiet. A node in trouble is exactly the one whose lines are worth having.
    #
    # `calimero-init.service` is here for the same reason and is the one that
    # matters most, because it is the unit that starts every other unit in this
    # list. It launches the sidecar with `systemctl start --no-block`, which
    # logs "Queued non-blocking start" whether the unit then came up or died on
    # its first line -- so a sidecar that never ran at all is INVISIBLE from
    # anywhere else. It is also where the node is initialised, where the TLS key
    # is generated and where vector itself is configured, so a node that is
    # wrong before any of the services start says so only here.
    #
    # `traefik.service` fronts the admin API and terminates TLS. Every request
    # the sidecar makes to merod goes through it, so a node that looks like it
    # is refusing its own credentials is diagnosed here and nowhere else.
    #
    # `vector.service` and `vmagent.service` collect themselves. That is less
    # circular than it sounds: a shipper that fails at startup leaves nothing
    # behind, but one that starts and then degrades -- a rejected write, a full
    # buffer, a sink that stopped resolving -- reports it, and that is the
    # common case. The alternative is that the observability stack is the one
    # subsystem with no account of itself.
    include_units:
      [
        "calimero-init.service",
        "merod.service",
        "mero-auth.service",
        "traefik.service",
        "fleet-sidecar.service",
        "vector.service",
        "vmagent.service",
      ]
    data_dir: "/etc/vector/data"

transforms:
  add_labels:
    type: remap
    inputs: [app_journal]
    source: |
      .unit = ._SYSTEMD_UNIT
      .hostname = .host
      .instance_name = "merotee"
      .instance_type = "gcp"
      # Substituted by configure_vector.sh from /etc/calimero/image-profile,
      # which the playbook writes at build time and the root hash measures. A
      # literal placeholder rather than a lookup because Vector's VRL cannot
      # read a file, and because a value baked here would be wrong on every
      # profile but one.
      .instance_profile = "__IMAGE_PROFILE__"

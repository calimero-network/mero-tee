# The node, KMS and agent images, built by mkosi instead of Packer + Ansible
# (mdma#480), for any of the three profiles: build.sh's ROLE and PROFILE choose
# the playbook and profile. Same archive snapshot, tools tree, seed handling and
# UKI boot as mkosi-probe, which proved on GCP TDX that RTMR1 and RTMR2 can be
# computed from this build's output before it boots.
#
# Do not run mkosi on this directory directly: build.sh copies it, renders the
# role's playbook into an extra tree (scripts/image/render_role_tree.py, so
# the Packer image and this one take their files from one source), adds the
# roles' packages and unit enable/mask lists, and then runs mkosi.
#
# The root is EROFS behind dm-verity (mkosi.repart). mkosi puts the verity root
# hash on the UKI's command line as roothash=, the initrd opens the root with
# it, and RTMR2 measures that command line: the root hash, and with it every
# byte of the root filesystem, is in the measurement.

[Distribution]
Distribution=ubuntu
# 26.04, the release the Packer images are built from (ubuntu-2604-lts-amd64).
Release=resolute
Repositories=main,universe
# Every package as the archive stood at this instant (snapshot.ubuntu.com).
# mkosi.tools.conf pins the tools tree to the same snapshot. Moving it changes
# the UKI and the root, and so RTMR1 and RTMR2.
Snapshot=20261015T000000Z

[Output]
# ImageId (merotee-<role>) is set by build.sh.
Format=disk
ManifestFormat=json
SplitArtifacts=uki
# Fixed, so systemd-repart derives the same disk and partition GUIDs and the
# same EROFS and verity UUIDs on every build: RTMR1 measures the GPT. This is
# uuid5(NAMESPACE_URL, "https://github.com/calimero-network/mero-tee/mero-tee/mkosi-node"),
# the directory's name when the node image was first measured; changing it
# changes every role's RTMR1.
Seed=b2d3d411-2001-52be-abd1-f0b202d9349c

[Build]
ToolsTree=yes
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=resolute

[Content]
# 2026-01-01T00:00:00Z: clamps every file time in the root and the initrd.
SourceDateEpoch=1767225600
Bootable=yes
Bootloader=uki
# The apt lists of the build (some fetched from the live archive, not the
# snapshot, see mero-tee#499) stay out of the image.
CleanPackageMetadata=yes
# KernelCommandLine= is all build.sh's: quiet on locked-read-only only (the
# debug profiles show the kernel and systemd on the console);
# systemd.volatile=overlay, which gives the read-only root a tmpfs upper layer
# as the Packer image's sealed root has; calimero.role= and calimero.profile=,
# measured in RTMR2 here as they were on the GRUB command line; and on the
# debug profiles only console=ttyS0 (lockdown R2 offers nothing on the serial
# port).
#
# The packages every role shares; build.sh adds the role's own.
Packages=
        linux-image-gcp
        systemd
        systemd-boot-efi
        systemd-cryptsetup
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        bash
        coreutils
        util-linux
        # useradd and usermod, for mkosi.postinst (the node's roles pulled it
        # in; the KMS's do not).
        passwd
        procps
        iproute2
        ca-certificates
        curl
        wget
        openssl
        python3
        # merod, meroctl and mero-auth link it (the cloud image had it).
        libstdc++6
        xxd
        e2fsprogs
        gawk
        sed
        grep
        findutils
        tar
        gzip

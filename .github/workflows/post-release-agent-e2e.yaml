name: Post-release agent e2e
run-name: Post-release agent e2e (${{ inputs.release_version || github.event.workflow_run.head_sha }})

# The private agent end to end on a published mero-kms release
# (docs/design/private-agents.md; scripts/release/agent/run-agent-release-e2e.sh):
# the release's KMS image releases the release's agent image its disk key, the
# gate verifies against the release's SIGNED agent policy, a secret is
# provisioned, and the disk reopens after a reset.
#
# Runs after every successful "Release mero-kms" on master, for each profile
# whose agent policy the release published; skips a profile it published none
# for (an agent measurement that failed is best effort there, and
# locked-read-only has an agent image only when MERO_AGENT_PROVISIONERS is set).
# A locked-read-only agent is provisioned only with MERO_AGENT_PROVISIONER_KEY,
# a listed provisioner's secret; without it its gate and disk are verified. The probe VMs
# are deleted at the end; the release images are not touched.

on:
  workflow_run:
    workflows:
      - Release mero-kms
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_version:
        description: "Released mero-kms version (X.Y.Z)"
        required: true
        type: string
      profile:
        description: "Profile to run"
        required: true
        type: choice
        options:
          - debug
          - debug-read-only
          - locked-read-only
        default: debug

permissions:
  contents: read

concurrency:
  group: post-release-agent-e2e-${{ inputs.release_version || github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  VM_PROJECT: ${{ vars.GCP_ATTESTATION_PROJECT_ID != '' && vars.GCP_ATTESTATION_PROJECT_ID || 'cloud-486420' }}
  VM_ZONE: ${{ vars.GCP_ATTESTATION_ZONE != '' && vars.GCP_ATTESTATION_ZONE || 'europe-west4-a' }}
  VM_MACHINE_TYPE: ${{ vars.GCP_ATTESTATION_MACHINE_TYPE != '' && vars.GCP_ATTESTATION_MACHINE_TYPE || 'c3-standard-4' }}
  PACKER_GCP_PROJECT_ID: ${{ vars.GCP_PACKER_PROJECT_ID }}

jobs:
  e2e:
    name: Agent end to end (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profile && format('["{0}"]', inputs.profile) || '["debug","debug-read-only","locked-read-only"]') }}
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'master' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the release and its agent policy
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#mero-kms-v}"
          if [[ -z "${version}" ]]; then
            version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="mero-kms") | .version')"
          fi
          tag="mero-kms-v${version}"
          mkdir -p e2e
          asset="kms-agent-attestation-policy.${PROFILE}.json"
          if ! gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir e2e \
              --pattern "${asset}" --pattern "${asset}.sig" --pattern "${asset}.pem" 2>/dev/null \
              || [[ ! -s "e2e/${asset}" ]]; then
            echo "::notice::${tag} published no ${PROFILE} agent policy; nothing to run"
            echo "run=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo "run=true"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "policy=e2e/${asset}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        if: ${{ steps.release.outputs.run == 'true' }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # The policy a provisioner trusts must be the one the release signed.
      - name: Verify the agent policy's release signature
        if: ${{ steps.release.outputs.run == 'true' }}
        env:
          POLICY: ${{ steps.release.outputs.policy }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --certificate "${POLICY}.pem" --signature "${POLICY}.sig" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-kms.yaml@refs/heads/master$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${POLICY}"

      - name: Setup rust cache
        if: ${{ steps.release.outputs.run == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: post-release-agent-e2e

      - name: Build mero-agent-provision
        if: ${{ steps.release.outputs.run == 'true' }}
        run: cargo build --release --locked -p mero-agent-gate --bin mero-agent-provision

      - name: Authenticate to GCP via service account key
        if: ${{ steps.release.outputs.run == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        if: ${{ steps.release.outputs.run == 'true' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Run the agent end to end
        if: ${{ steps.release.outputs.run == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          AGENT_POLICY: ${{ steps.release.outputs.policy }}
          PROBE_NAME: agent-e2e-${{ matrix.profile == 'locked-read-only' && 'lro' || matrix.profile == 'debug-read-only' && 'dro' || 'dbg' }}-${{ github.run_id }}-${{ github.run_attempt }}
          PROVISION_BIN: target/release/mero-agent-provision
          # A listed provisioner's key, for a locked-read-only image.
          PROVISIONER_KEY_B64: ${{ secrets.MERO_AGENT_PROVISIONER_KEY }}
          OUT_DIR: e2e/out
        run: |
          set -euo pipefail
          export IMAGE_PROJECT="${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          if [[ -n "${PROVISIONER_KEY_B64}" ]]; then
            ( umask 077; printf '%s' "${PROVISIONER_KEY_B64}" > "${RUNNER_TEMP}/provisioner.key" )
            export PROVISIONER_KEY="${RUNNER_TEMP}/provisioner.key"
          fi
          bash scripts/release/agent/run-agent-release-e2e.sh

      - name: Upload e2e artifacts
        if: ${{ always() && steps.release.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-release-agent-e2e-${{ steps.release.outputs.version }}-${{ env.PROFILE }}
          path: e2e/
          if-no-files-found: ignore

---
# Merod TEE image (R1–R9). Profile (locked-read-only | debug-read-only | debug) controls which roles run.
# Built by mkosi (mero-tee/mkosi-image): scripts/image/render_role_tree.py renders
# these roles into the image, which is an EROFS root behind dm-verity booted as a
# UKI. calimero.role and calimero.profile are on its command line (RTMR[2]) with
# the verity root hash; calimero-init extends RTMR[3] with role, profile and
# that root hash at boot.
- hosts: all
  become: true
  pre_tasks:
    - name: Refresh apt metadata cache only (avoid non-deterministic full upgrades)
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure archive extraction tools are installed
      apt:
        name:
          - bzip2
          - xz-utils
          - unzip
          - gzip
          - tar
        state: present
  roles:
    - role: ansible/roles/mero-traefik
      vars:
        # Third-party releases use amd64 for x86_64; always amd64
        cpu_architecture: "amd64"
        traefik_version: "{{ traefik_version }}"

    # Bake merod/meroctl at build time (core tag). calimero-init skips download if present.
    - role: ansible/roles/calimero-core
      vars:
        merod_version: "{{ merod_version }}"
        cpu_platform: "{{ 'x86_64' if cpu_architecture in ['amd64', 'x86', 'x86_64'] else cpu_architecture }}"

    - role: ansible/roles/merotee
      vars:
        image_profile: "{{ lockdown_profile | default('locked-read-only') }}"

    - role: ansible/roles/node-exporter
      vars:
        version: "{{ node_exporter_version }}"
        cpu_architecture: "amd64"

    - role: ansible/roles/vmagent
      vars:
        vmagent_version: "{{ vmagent_version }}"
        cpu_architecture: "amd64"

    - role: ansible/roles/vector
      vars:
        version: "{{ vector_version }}"

    - role: ansible/roles/cleanup

    # Lockdown (no SSH, no getty, etc.) only for production profile so MRTD differs per profile
    - role: ansible/roles/merod-lockdown
      when: (lockdown_profile | default('locked-read-only')) == 'locked-read-only'

    - role: ansible/roles/merotee-conformance
      when: (lockdown_profile | default('locked-read-only')) == 'locked-read-only'
  post_tasks:
    # Ensure each profile has distinct content so MRTD differs (merotee role has created /etc/calimero)
    - name: Record image profile for attestation
      copy:
        content: "{{ lockdown_profile | default('locked-read-only') }}\n"
        dest: /etc/calimero/image-profile
        mode: "0644"

    # The GCE disk-naming rule and helper (roles/merotee/files/gce-udev), which
    # the data disk is found by. Last, after merod-lockdown: the
    # `google-compute-engine` package owns the same paths, and lockdown removes
    # it on locked-read-only. mkosi.finalize checks they are in the image.
    - name: Install the GCE disk-naming udev rule and helper
      copy:
        src: "ansible/roles/merotee/files/gce-udev/{{ item.name }}"
        dest: "{{ item.dest }}/{{ item.name }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { name: 65-gce-disk-naming.rules, dest: /usr/lib/udev/rules.d, mode: "0644" }
        - { name: google_nvme_id, dest: /usr/lib/udev, mode: "0755" }

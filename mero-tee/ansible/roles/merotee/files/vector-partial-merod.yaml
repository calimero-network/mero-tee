# Partial Vector config for locked-down image (R7). configure_vector.sh appends the sink.
sources:
  app_journal:
    type: journald
    # Every unit on a locked image logs only here: there is no shell on a
    # confidential VM -- that is the point of one -- so a unit missing from this
    # list is a subsystem that cannot be debugged at all.
    #
    # `calimero-init.service` is the one that matters most, because it is the
    # unit that starts every other unit in this list. It launches them with
    # `systemctl start --no-block`, which logs "Queued non-blocking start"
    # whether the unit then came up or died on its first line. It is also where
    # the node is initialised, where the TLS key
    # is generated and where vector itself is configured, so a node that is
    # wrong before any of the services start says so only here.
    #
    # `traefik.service` fronts the admin API and terminates TLS. Every request
    # the sidecar makes to merod goes through it, so a node that looks like it
    # is refusing its own credentials is diagnosed here and nowhere else.
    #
    # `calimero-tls-cert.service` turns the in-enclave key into a publicly
    # trusted certificate: it retries publishing the CSR and quote mdma orders
    # from, and installs the chain mdma writes back. A node left serving its
    # self-signed placeholder says why only here (calimero-init logs just the
    # first attempt), and that placeholder is also what stops a new cluster
    # finding its leader, since mdma reads /health over verified TLS.
    #
    # `vector.service` and `vmagent.service` collect themselves. That is less
    # circular than it sounds: a shipper that fails at startup leaves nothing
    # behind, but one that starts and then degrades -- a rejected write, a full
    # buffer, a sink that stopped resolving -- reports it, and that is the
    # common case. The alternative is that the observability stack is the one
    # subsystem with no account of itself.
    include_units:
      [
        "calimero-init.service",
        "calimero-tls-cert.service",
        "merod.service",
        "traefik.service",
        "vector.service",
        "vmagent.service",
      ]
    data_dir: "/etc/vector/data"

transforms:
  add_labels:
    type: remap
    inputs: [app_journal]
    source: |
      .unit = ._SYSTEMD_UNIT
      .hostname = .host
      .instance_name = "merotee"
      .instance_type = "gcp"
      # Substituted by configure_vector.sh from /etc/calimero/image-profile,
      # which the playbook writes at build time and the root hash measures. A
      # literal placeholder rather than a lookup because Vector's VRL cannot
      # read a file, and because a value baked here would be wrong on every
      # profile but one.
      .instance_profile = "__IMAGE_PROFILE__"

  # Every line passes egress-guard.vrl before it leaves: only named fields,
  # credential shapes masked, messages capped. A line the program cannot
  # process is dropped, never shipped as it came.
  guard_egress:
    type: remap
    inputs: [add_labels]
    file: /etc/vector/egress-guard.vrl
    drop_on_error: true
    drop_on_abort: true

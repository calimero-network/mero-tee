---
# Merod TEE image (R1–R9). Profile (locked-read-only | debug-read-only | debug) controls which roles run.
# Attestation: calimero.role + calimero.profile + calimero.root_hash in kernel cmdline (RTMR[2]).
# The root itself is sealed behind dm-verity as the last step, and its root hash
# is on the cmdline too (see the verity-root role).
# calimero-init extends RTMR[3] with role+profile+root_hash at boot (kernel 6.16+).
# calimero.root_hash covers /etc/calimero, /usr/local/lib/calimero, /etc/default/grub, and merod
# binaries at BUILD time and names the build in RTMR3. It is not what stops an offline edit of the
# boot disk: the dm-verity root hash is, because every block the booted system reads is checked
# against it (mero-tee#334).
- hosts: all
  become: true
  vars:
    # Installed by the merotee role, required in the sealed root (post_tasks).
    gce_udev_paths:
      - /usr/lib/udev/rules.d/65-gce-disk-naming.rules
      - /usr/lib/udev/google_nvme_id
      - /usr/sbin/nvme

    # Delegated execution: whether this image is a RELAY, i.e. whether a
    # keyholder with no account on this node may present a signed warrant to it
    # and have it write on their behalf.
    #
    # Defined here, at play level, rather than in either role's defaults,
    # because the posture has two edges that must move together:
    #
    #   * traefik exempts `/admin-api/contexts/<ctx>/intents`,
    #     `/admin-api/groups/<group>/context-intents` and
    #     `/admin-api/groups/<group>/governance-intents` from `auth-node`
    #     (ansible/roles/mero-traefik/templates/traefik-routing.yml.j2), and
    #   * merod serves those routes on its public router
    #     (`server.admin.delegated_access`, set in calimero-init).
    #   * traefik routes the sealed-transport envelope (`/sealed/v2`), also
    #     without `auth-node`, so a client can seal its intents to the TD;
    #     merod limits an opened request to its uncredentialed routes.
    #
    # A per-role default would let one drift from the other, and the failure is
    # silent in the bad direction: the traefik exemption alone opens the path
    # whatever merod's config says, since these nodes run merod in proxy auth
    # mode and traefik is the only gate.
    #
    # On for the read-only fleet profiles, which is what "fleet node" means
    # here — the replicas mdma assigns to a namespace, whose whole job is to be
    # available for other people's writes. Off for `debug`, a developer's own
    # node that authors its own. Override at build time with
    # `-e fleet_delegated_access=false` for a fleet with no hosted relaying.
    fleet_delegated_access: >-
      {{ (lockdown_profile | default('locked-read-only')) in ['debug-read-only', 'locked-read-only'] }}
  pre_tasks:
    - name: Refresh apt metadata cache only (avoid non-deterministic full upgrades)
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure archive extraction tools are installed
      apt:
        name:
          - bzip2
          - xz-utils
          - unzip
          - gzip
          - tar
        state: present
  roles:
    - role: ansible/roles/mero-traefik
      vars:
        # Third-party releases use amd64 for x86_64; always amd64
        cpu_architecture: "amd64"
        traefik_version: "{{ traefik_version }}"

    # Bake merod/meroctl/mero-auth at build time (core tag). calimero-init skips download if present.
    - role: ansible/roles/calimero-core
      vars:
        merod_version: "{{ merod_version }}"
        cpu_platform: "{{ 'x86_64' if cpu_architecture in ['amd64', 'x86', 'x86_64'] else cpu_architecture }}"

    - role: ansible/roles/merotee
      vars:
        image_profile: "{{ lockdown_profile | default('locked-read-only') }}"

    - role: ansible/roles/node-exporter
      vars:
        version: "{{ node_exporter_version }}"
        cpu_architecture: "amd64"

    - role: ansible/roles/vmagent
      vars:
        vmagent_version: "{{ vmagent_version }}"
        cpu_architecture: "amd64"

    - role: ansible/roles/vector
      vars:
        version: "{{ vector_version }}"

    - role: ansible/roles/cleanup

    # Lockdown (no SSH, no getty, etc.) only for production profile so MRTD differs per profile
    - role: ansible/roles/merod-lockdown
      when: (lockdown_profile | default('locked-read-only')) == 'locked-read-only'

    - role: ansible/roles/merotee-conformance
      when: (lockdown_profile | default('locked-read-only')) == 'locked-read-only'

    # Installs the root-sealing script; the seal itself is the last post_task.
    - role: ansible/roles/verity-root
  post_tasks:
    # Ensure each profile has distinct content so MRTD differs (merotee role has created /etc/calimero)
    - name: Record image profile for attestation
      copy:
        content: "{{ lockdown_profile | default('locked-read-only') }}\n"
        dest: /etc/calimero/image-profile
        mode: "0644"

    # Hash profile-specific root content and inject into kernel cmdline (measured into RTMR[2]).
    # Includes merod/meroctl/mero-auth so binary substitution changes measurements (no swap attack).
    - name: Compute root content hash for attestation
      shell: |
        # Hash calimero config, init, grub, and baked binaries (profile-specific)
        { find /etc/calimero /usr/local/lib/calimero -type f 2>/dev/null
          [ -f /etc/default/grub ] && echo /etc/default/grub
          [ -f /usr/local/bin/merod ] && echo /usr/local/bin/merod
          [ -f /usr/local/bin/meroctl ] && echo /usr/local/bin/meroctl
          [ -f /usr/local/bin/mero-auth ] && echo /usr/local/bin/mero-auth
        } | sort -u | xargs -r sha256sum 2>/dev/null | sha256sum | awk '{print $1}'
      register: root_hash_result
      changed_when: false

    - name: Add calimero.root_hash to kernel cmdline (measured as a string; see mero-tee#334)
      copy:
        content: |
          # Root content hash for attestation (RTMR[2]); identifies the build. The dm-verity root hash is what the disk is checked against.
          GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} calimero.root_hash={{ root_hash_result.stdout }}"
        dest: /etc/default/grub.d/60-calimero-root-hash.cfg
        mode: "0644"

    - name: Update GRUB with root hash
      command: update-grub
      changed_when: true

    # LAST task, on every profile: seal the root behind dm-verity (mero-tee#334).
    # Anything changed after this is not in the booted image.
    #
    # On locked-read-only it also removes the ubuntu user (R4) first. Both run in
    # one root process: Packer SSHs as ubuntu, so nothing can start after the user
    # is gone, and the user has to be gone before the root is copied.
    # The GCE disk-naming rule and helper (roles/merotee/files/gce-udev). 2.3.87
    # nodes logged MISSING for both although the build installed them, so their
    # presence is asserted twice: here, on the build host after every role has
    # run, and by the seal inside the EROFS image it writes. Whichever fails
    # names the step that loses them.
    # AFTER every role, and in particular after merod-lockdown. The base image's
    # `google-compute-engine` package owns these same two paths (`lib/udev/*`),
    # and lockdown's `openssh-server` purge takes it along (it depends on OS
    # Login and the guest agent), so dpkg deleted whatever was at those paths --
    # including the copies the merotee role wrote. Every locked-read-only image
    # since the rule was vendored shipped without it; the debug profiles, which
    # skip lockdown, kept it. The 2.3.89 build caught this with the assert below.
    - name: Install the GCE disk-naming udev rule and helper
      copy:
        src: "ansible/roles/merotee/files/gce-udev/{{ item.name }}"
        dest: "{{ item.dest }}/{{ item.name }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { name: 65-gce-disk-naming.rules, dest: /usr/lib/udev/rules.d, mode: "0644" }
        - { name: google_nvme_id, dest: /usr/lib/udev, mode: "0755" }

    - name: Stat the GCE disk-naming files before sealing
      stat:
        path: "{{ item }}"
      register: gce_udev_files
      loop: "{{ gce_udev_paths }}"

    - name: Assert the GCE disk-naming files survived every role
      assert:
        that: item.stat.exists
        fail_msg: "{{ item.item }} is missing just before the seal (installed above, or by the merotee role for nvme-cli)"
      loop: "{{ gce_udev_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Seal the root filesystem behind dm-verity
      command: >-
        /usr/local/sbin/calimero-seal-root
        {{ '--remove-user ubuntu' if (lockdown_profile | default('locked-read-only')) == 'locked-read-only' else '' }}
        {% for path in gce_udev_paths %}--require {{ path }} {% endfor %}
      changed_when: true
      register: seal_result

    - name: Show what the seal wrote (partitions, root hash)
      debug:
        var: seal_result.stdout_lines

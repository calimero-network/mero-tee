---
- name: Create base directory
  file:
    path: /etc/vector
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create data directory
  file:
    path: /etc/vector/data
    state: directory
    owner: root
    group: root
    mode: "0755"

# What every shipped line passes through first (see the file's header). Baked,
# so measured: an operator cannot loosen it.
- name: Install the log egress guard
  copy:
    src: egress-guard.vrl
    dest: /etc/vector/egress-guard.vrl
    owner: root
    group: root
    mode: "0644"

- name: Copy configure_vector.sh script
  copy:
    src: configure_vector.sh
    dest: /etc/vector/configure_vector.sh
    owner: root
    group: root
    mode: "0755"

- name: Copy fetch_secret.sh script
  copy:
    src: fetch_secret.sh
    dest: /etc/vector/fetch_secret.sh
    owner: root
    group: root
    mode: "0755"

# The release archive itself, checked against build-inputs.lock.json, rather
# than `curl https://sh.vector.dev | bash`: that ran whatever the installer
# host served at build time, and fetched an archive nothing here checked.
- name: Require Vector to be pinned for this version
  assert:
    that: build_inputs.vector.version == version
    fail_msg: >-
      build-inputs.lock.json pins Vector {{ build_inputs.vector.version }} but the
      build asked for {{ version }}. Run scripts/release/pin-build-inputs.sh.

- name: Download Vector from GitHub releases (sha256-pinned)
  get_url:
    url: "https://github.com/vectordotdev/vector/releases/download/v{{ version }}/vector-{{ version }}-x86_64-unknown-linux-gnu.tar.gz"
    dest: "/tmp/vector-{{ version }}-x86_64-unknown-linux-gnu.tar.gz"
    checksum: "sha256:{{ build_inputs.vector.sha256['vector-' ~ version ~ '-x86_64-unknown-linux-gnu.tar.gz'] }}"
    mode: "0644"
    timeout: 120
  register: vector_download
  retries: 5
  delay: 10
  until: vector_download is succeeded

- name: Create the Vector install directory
  file:
    path: /opt/vector
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Extract Vector
  unarchive:
    src: "/tmp/vector-{{ version }}-x86_64-unknown-linux-gnu.tar.gz"
    dest: /opt/vector
    remote_src: yes
    owner: root
    group: root
    extra_opts: [--strip-components=2]

- name: Remove the Vector archive
  file:
    path: "/tmp/vector-{{ version }}-x86_64-unknown-linux-gnu.tar.gz"
    state: absent

- name: Create symbolic link for binary
  file:
    src: /opt/vector/bin/vector
    dest: /usr/local/bin/vector
    state: link

- name: Create systemd service file
  copy:
    content: |
      [Unit]
      Description=vector

      [Service]
      ExecStart=/usr/local/bin/vector --config /etc/vector/vector.yaml
      Restart=always

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/vector.service

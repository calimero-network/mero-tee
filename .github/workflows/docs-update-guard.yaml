name: Docs update guard

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/release/**"
      - "scripts/policy/**"
      - "scripts/attestation/**"
      - "scripts/kms/**"
      - "scripts/ci/**"
      - "mero-tee/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  require-doc-updates:
    name: Require docs updates for workflow/script changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate docs changes are included
        id: validate_docs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source scripts/ci/logging.sh

          changed_files_output="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if [[ -z "${changed_files_output}" ]]; then
            ci_fail "NO_CHANGED_FILES" "No changed files detected between ${BASE_SHA} and ${HEAD_SHA}; this is unexpected for this workflow trigger."
            exit 1
          fi
          mapfile -t changed_files <<< "${changed_files_output}"

          # A workflow file whose diff touches ONLY `uses:` lines is an action
          # version pin bump -- there is no behaviour to document, so demanding a
          # docs update asks for a line nobody can honestly write. Dependabot
          # opens these constantly and every one of them was stuck: eight were
          # open at once, the oldest since July, which is both a supply-chain
          # staleness problem and a good way to teach people that this guard is
          # noise. It is not noise about real workflow changes, which is exactly
          # why the exemption is content-based and narrow: change one line that
          # is not a `uses:` and the guard re-arms for that file.
          only_action_pin_bump() {
            local file="$1" changed
            changed="$(git diff "${BASE_SHA}...${HEAD_SHA}" -- "${file}" \
              | grep -E '^[+-]' \
              | grep -vE '^(\+\+\+|---)' || true)"
            # No +/- lines at all (mode change, rename) is not a pin bump.
            [[ -n "${changed}" ]] || return 1
            # Any changed line that is not a `uses:` line disqualifies the file.
            # `uses:` appears both as a bare key and as a YAML list item
            # (`- uses: ...`); the optional dash covers the latter.
            ! grep -qvE '^[+-][[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*\S' <<< "${changed}"
          }

          requires_docs_update="false"
          has_docs_update="false"

          for file in "${changed_files[@]}"; do
            if [[ "${file}" == .github/workflows/* ]]; then
              if only_action_pin_bump "${file}"; then
                ci_info "docs guard: ${file} changes only \`uses:\` pins; no docs required for it."
              else
                requires_docs_update="true"
              fi
            elif [[ "${file}" == scripts/release/* || "${file}" == scripts/policy/* || "${file}" == scripts/attestation/* || "${file}" == scripts/kms/* || "${file}" == scripts/ci/* || "${file}" == mero-tee/* ]]; then
              requires_docs_update="true"
            fi

            if [[ "${file}" == docs/* || "${file}" == README.md || "${file}" == CHANGELOG.md ]]; then
              has_docs_update="true"
            fi
          done

          if [[ "${requires_docs_update}" == "true" && "${has_docs_update}" != "true" ]]; then
            ci_fail "DOCS_UPDATE_REQUIRED" "This PR changes workflows/scripts/node-image-gcp but does not update docs."
            ci_next "Please update at least one of: docs/** or README.md."
            exit 1
          fi

          ci_ok "Docs update guard passed."

      - name: Summarize docs guard outcome
        if: ${{ always() }}
        run: |
          set -euo pipefail
          source scripts/ci/logging.sh
          result_line="$(ci_result "docs-update-guard" "${{ job.status }}" "DOCS_CONSISTENCY" "pr=${{ github.event.pull_request.number }}" "run_id=${GITHUB_RUN_ID}")"
          ci_info "${result_line}"
          python3 scripts/ci/summary/write_workflow_summary.py \
            --output "${GITHUB_STEP_SUMMARY}" \
            --inputs-line "- PR: #${{ github.event.pull_request.number }}" \
            --inputs-line "- Base SHA: ${{ github.event.pull_request.base.sha }}" \
            --inputs-line "- Head SHA: ${{ github.event.pull_request.head.sha }}" \
            --checks-line "- Docs validation: ${{ steps.validate_docs.outcome }}" \
            --result-line "- Job status: ${{ job.status }}" \
            --result-line "- ${result_line}" \
            --artifacts-line "- n/a" \
            --next-line "- Add docs/** or README.md updates when changing workflow/script behavior."

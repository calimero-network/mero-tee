name: Release mero-tee

on:
  push:
    branches:
      - master
    paths:
      - "mero-tee/versions.json"
  workflow_dispatch:
    inputs:
      log_verbosity:
        description: "Logging verbosity: compact (default) or debug"
        required: false
        type: choice
        options:
          - compact
          - debug
        default: compact

concurrency:
  group: mero-tee-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKER_GCP_PROJECT_ID: ${{ vars.GCP_PACKER_PROJECT_ID }}
  PACKER_GCP_REGION: ${{ vars.GCP_PACKER_REGION }}
  PACKER_GCP_ZONE: ${{ vars.GCP_PACKER_ZONE }}
  PACKER_GCP_SUBNETWORK: ${{ vars.GCP_PACKER_SUBNETWORK }}
  # Defaults match Calimero Cloud MDMA (cloud-486420, europe-west4-a, c3-standard-4) so
  # published-mrtds.json RTMRs match dispatcher-created VMs. Override via repo Variables.
  GCP_ATTESTATION_PROJECT_ID: ${{ vars.GCP_ATTESTATION_PROJECT_ID != '' && vars.GCP_ATTESTATION_PROJECT_ID || 'cloud-486420' }}
  GCP_ATTESTATION_ZONE: ${{ vars.GCP_ATTESTATION_ZONE != '' && vars.GCP_ATTESTATION_ZONE || 'europe-west4-a' }}
  GCP_ATTESTATION_SUBNETWORK: ${{ vars.GCP_ATTESTATION_SUBNETWORK }}
  GCP_ATTESTATION_MACHINE_TYPE: ${{ vars.GCP_ATTESTATION_MACHINE_TYPE != '' && vars.GCP_ATTESTATION_MACHINE_TYPE || 'c3-standard-4' }}
  GCP_ATTESTATION_ADMIN_API_PORT: ${{ vars.GCP_ATTESTATION_ADMIN_API_PORT }}
  GCP_ATTESTATION_ALLOWED_CIDRS: ${{ vars.GCP_ATTESTATION_ALLOWED_CIDRS }}
  GCP_ATTESTATION_CLEANUP_MAX_AGE_HOURS: ${{ vars.GCP_ATTESTATION_CLEANUP_MAX_AGE_HOURS }}
  GCP_ATTESTATION_MEROD_VERSION: ${{ vars.GCP_ATTESTATION_MEROD_VERSION }}
  ITA_APPRAISAL_URL: ${{ vars.ITA_APPRAISAL_URL }}
  ITA_POLICY_IDS: ${{ vars.ITA_POLICY_IDS }}
  ITA_POLICY_MUST_MATCH: ${{ vars.ITA_POLICY_MUST_MATCH }}
  CI_LOG_VERBOSITY: ${{ github.event_name == 'workflow_dispatch' && inputs.log_verbosity || 'compact' }}
  # Off master, images are named apart and put in a "-dev" family, so a branch
  # build can neither replace a released image nor be booted by mdma. See
  # scripts/release/mkosi/release-image-name.sh.
  # Short on purpose: GCP image names stop at 63 characters, and the longest
  # released name is 53.
  IMAGE_SUFFIX: ${{ github.ref != 'refs/heads/master' && format('-d{0}-{1}', github.run_number, github.run_attempt) || '' }}

jobs:
  preflight:
    name: Workflow preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_pipeline: ${{ steps.release_gate.outputs.run_pipeline }}
      latest_merod_version: ${{ steps.release_gate.outputs.latest_merod_version }}
      image_version: ${{ steps.version_manifest.outputs.image_version }}
      gate_reason: ${{ steps.release_gate.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the release scripts
        run: |
          bash -n mero-tee/mkosi-image/build.sh
          bash -n scripts/release/mkosi/install-tools.sh
          bash -n scripts/release/mkosi/build-image.sh
          bash -n scripts/release/mkosi/create-gce-image.sh
          bash -n scripts/release/mkosi/release-image-name.sh
          bash -n scripts/release/verify-node-image-gcp-release-assets.sh
          bash -n scripts/release/node-image-gcp/resolve-release-gate.sh
          bash -n scripts/release/node-image-gcp/resolve-image-vm-parameters.sh
          bash -n scripts/release/node-image-gcp/sweep-attestation-resources.sh
          bash -n scripts/release/node-image-gcp/assemble-published-mrtd-payload.sh
          bash -n scripts/release/node-image-gcp/sign-release-assets.sh
          bash -n scripts/release/node-image-gcp/verify-generated-signatures.sh
          bash -n scripts/release/node-image-gcp/upsert-umbrella-release-links.sh
          bash -n scripts/ci/probes/node_log_auth_probe.sh
          python3 -m py_compile scripts/ci/probes/log_auth_receiver.py
          python3 -m py_compile scripts/attestation/shared/verify_tdx_quote_ita.py
          python3 -m py_compile scripts/attestation/shared/extract_tdx_policy_candidates.py

      - name: Validate version manifest shape
        id: version_manifest
        run: |
          image_version="$(jq -er '.imageVersion' mero-tee/versions.json)"
          jq -e '
            has("imageVersion")
            and has("merodVersion")
            and has("traefikVersion")
            and has("nodeExporterVersion")
            and has("vmagentVersion")
            and has("vectorVersion")
          ' mero-tee/versions.json >/dev/null
          echo "image_version=${image_version}" >> "${GITHUB_OUTPUT}"

      # The build checks each download against mero-tee/build-inputs.lock.json
      # (get_url checksum). Check the lock against the publishers here too, so
      # a stale or wrong pin fails in seconds rather than three builds in.
      # mero-bot is private: it is checked against its release only with a
      # token that reads it. The node image does not bake it, and the agent
      # build checks the bundle it downloads against the same lock.
      - name: Check build inputs are pinned to what was published
        env:
          GH_TOKEN: ${{ secrets.MERO_BOT_RELEASE_TOKEN }}
        run: |
          scripts/ci/tests/build-inputs-pinned-test.sh
          if [[ -n "${GH_TOKEN}" ]]; then
            scripts/release/pin-build-inputs.sh --check
          else
            scripts/release/pin-build-inputs.sh --check --skip-private
          fi

      - name: Resolve merod release gate (master only)
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/node-image-gcp/resolve-release-gate.sh

      - name: Report release gate decision
        run: |
          {
            echo "## Merod release gate"
            echo ""
            echo "- Latest merod release: ${{ steps.release_gate.outputs.latest_merod_version }}"
            echo "- Run pipeline: ${{ steps.release_gate.outputs.run_pipeline }}"
            echo "- Reason: ${{ steps.release_gate.outputs.reason }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  profile_pipeline:
    name: Build and attest (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    needs: [preflight]
    if: ${{ needs.preflight.outputs.run_pipeline == 'true' }}
    env:
      GATED_MEROD_VERSION: ${{ needs.preflight.outputs.latest_merod_version }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # The log-auth check needs a node that ships over plain http to the
      # receiver. configure_vector.sh allows that only on the debug profiles:
      # locked-read-only refuses a non-https logs endpoint, so its vector never
      # starts against the receiver (run 39505209881: NO_LOG_PUSHES after 600s).
      # An https receiver cannot help, since vector trusts no CA given to it in
      # metadata. The debug profiles share vector's role, partial config,
      # data_dir and token chain with it, so they catch a vector that cannot
      # start (2.3.120).
      LOG_AUTH_CHECK: ${{ matrix.profile != 'locked-read-only' }}
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, debug-read-only, locked-read-only]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine GCP auth mode
        id: auth_mode
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          mode="none"
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            mode="wif"
          elif [[ -n "${SA_KEY}" ]]; then
            mode="key"
          fi

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "run_full_pipeline=true" >> "${GITHUB_OUTPUT}"

      - name: Require GCP auth
        if: ${{ steps.auth_mode.outputs.mode == 'none' }}
        run: |
          echo "Missing GCP auth configuration."
          echo "Set either:"
          echo "  - GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_PACKER_SERVICE_ACCOUNT_EMAIL"
          echo "or:"
          echo "  - GCP_SERVICE_ACCOUNT_KEY"
          exit 1

      # The image is built with mkosi (mero-tee/mkosi-image, mdma#480): from the
      # pinned archive snapshot, reproducibly, and with RTMR1-3 computed before
      # it boots (checked against the quote below).
      - name: Set up mkosi
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' }}
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Install the build tools
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' }}
        run: scripts/release/mkosi/install-tools.sh

      - name: Authenticate to GCP via workload identity
        if: ${{ steps.auth_mode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to GCP via service account key
        if: ${{ steps.auth_mode.outputs.mode == 'key' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Validate GCP compute access
        id: gcp_access
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' }}
        run: |
          image_project="${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT:-${CLOUDSDK_CORE_PROJECT:-calimero-p2p-development}}}"
          zone="${PACKER_GCP_ZONE:-europe-west4-a}"
          region="${PACKER_GCP_REGION:-europe-west4}"
          subnetwork="${PACKER_GCP_SUBNETWORK:-}"

          can_run="true"
          reason=""

          if ! gcloud compute zones describe "${zone}" --project "${image_project}" >/dev/null 2>&1; then
            can_run="false"
            reason="Missing compute.zones.get (or zone access) for project=${image_project}, zone=${zone}."
          fi

          # If subnet is not explicitly configured, auto-pick one accessible subnet in-region.
          if [[ "${can_run}" == "true" ]] && [[ -z "${subnetwork}" ]]; then
            subnetwork="$(gcloud compute networks subnets list \
              --project "${image_project}" \
              --regions "${region}" \
              --format="value(name)" \
              --limit=1 2>/dev/null | head -n1 || true)"
          fi

          if [[ "${can_run}" == "true" ]] && [[ -z "${subnetwork}" ]]; then
            can_run="false"
            reason="No accessible subnet found in region '${region}' for project '${image_project}'. Set GCP_PACKER_SUBNETWORK explicitly."
          fi

          if [[ "${can_run}" == "true" ]] && ! gcloud compute networks subnets describe "${subnetwork}" --region "${region}" --project "${image_project}" >/dev/null 2>&1; then
            can_run="false"
            reason="Subnetwork '${subnetwork}' in region '${region}' is not accessible in project '${image_project}'."
          fi

          if [[ "${can_run}" == "true" ]]; then
            # Normalize resolved values for subsequent steps in this job.
            echo "PACKER_GCP_PROJECT_ID=${image_project}" >> "${GITHUB_ENV}"
            echo "PACKER_GCP_REGION=${region}" >> "${GITHUB_ENV}"
            echo "PACKER_GCP_ZONE=${zone}" >> "${GITHUB_ENV}"
            echo "PACKER_GCP_SUBNETWORK=${subnetwork}" >> "${GITHUB_ENV}"
            echo "resolved_subnetwork=${subnetwork}" >> "${GITHUB_OUTPUT}"
          fi

          echo "can_run=${can_run}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

          if [[ "${can_run}" != "true" ]]; then
            echo "${reason}"
            exit 1
          fi

      - name: Show tool versions
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          mkosi --version
          gcloud --version
          jq --version

      - name: Build the profile image
        id: build_image
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        env:
          ROLE: node
          PROFILE: ${{ matrix.profile }}
          MKOSI_OUT: ${{ runner.temp }}/mkosi-out
          EVIDENCE_DIR: ${{ runner.temp }}/mkosi-evidence
        run: |
          set -euo pipefail
          scripts/release/mkosi/build-image.sh 2>&1 | tee /tmp/mkosi-build.log

      # The name, family and description mdma finds images by
      # (release-image-name.sh). Only a release may replace an existing image of that name.
      - name: Create the GCE image
        id: create_image
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        env:
          ROLE: node
          MKOSI_OUT: ${{ runner.temp }}/mkosi-out
          UPLOAD_BUCKET: ${{ vars.GCP_IMAGE_UPLOAD_BUCKET }}
          IMAGE_VERSION: ${{ needs.preflight.outputs.image_version }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [[ -z "${UPLOAD_BUCKET}" ]]; then
            echo "::error::The GCP_IMAGE_UPLOAD_BUCKET repo variable must name the image upload bucket."
            exit 1
          fi
          names="$(scripts/release/mkosi/release-image-name.sh node "${PROFILE}" "${IMAGE_VERSION}" "${IMAGE_SUFFIX}")"
          IMAGE_NAME="$(sed -n 's/^name=//p' <<< "${names}")"
          IMAGE_FAMILY="$(sed -n 's/^family=//p' <<< "${names}")"
          IMAGE_DESCRIPTION="$(sed -n 's/^description=//p' <<< "${names}")"
          IMAGE_PROJECT="${PACKER_GCP_PROJECT_ID}"
          export IMAGE_NAME IMAGE_FAMILY IMAGE_DESCRIPTION IMAGE_PROJECT
          if [[ -z "${IMAGE_SUFFIX}" ]]; then
            export REPLACE=true
          fi
          scripts/release/mkosi/create-gce-image.sh

      - name: Show build log on failure
        if: ${{ failure() && steps.build_image.outcome == 'failure' }}
        run: |
          echo "::error::The image build failed. Last 150 lines of output:"
          tail -150 /tmp/mkosi-build.log 2>/dev/null || echo "(no log captured)"
          echo ""
          echo "## Image build failure (profile: ${{ matrix.profile }})" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          tail -80 /tmp/mkosi-build.log 2>/dev/null >> "${GITHUB_STEP_SUMMARY}" || echo "(no log)" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the build log on failure
        if: ${{ failure() && steps.build_image.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mkosi-build-log-${{ matrix.profile }}-${{ github.run_id }}
          path: /tmp/mkosi-build.log
          if-no-files-found: ignore

      - name: Resolve image and VM parameters
        id: params
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        working-directory: mero-tee
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ matrix.profile }}
        run: bash ../scripts/release/node-image-gcp/resolve-image-vm-parameters.sh

      - name: Verify resulting image exists
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' && steps.params.outcome == 'success' }}
        run: |
          image_name="${{ steps.params.outputs.image_name }}"
          image_project="${{ steps.params.outputs.image_project }}"
          if [[ -z "${image_name}" || -z "${image_project}" ]]; then
            echo "::error::Resolve image and VM parameters step did not output image_name/image_project. Check that step for errors."
            exit 1
          fi
          echo "Checking for image: ${image_name} in project: ${image_project}"
          for i in 1 2 3 4 5 6; do
            if gcloud compute images describe "${image_name}" \
              --project "${image_project}" \
              --format="table(name,family,status)"; then
              echo "Image is ready."
              exit 0
            fi
            echo "Attempt ${i}/6: image not ready yet, waiting 15s..."
            sleep 15
          done
          echo "Image still not available after 90s."
          exit 1

      - name: Capture built image metadata
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          artifacts_dir="${{ steps.params.outputs.artifacts_dir }}"
          profile="${{ steps.params.outputs.profile }}"
          gcloud compute images describe "${{ steps.params.outputs.image_name }}" \
            --project "${{ steps.params.outputs.image_project }}" \
            --format=json > "${artifacts_dir}/image-${profile}.json"

      - name: Create ephemeral firewall rule for admin API
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          gcloud compute firewall-rules create "${{ steps.params.outputs.firewall_rule }}" \
            --project "${{ steps.params.outputs.vm_project }}" \
            --network "${{ steps.params.outputs.vm_network }}" \
            --direction INGRESS \
            --priority 1000 \
            --action ALLOW \
            --rules "tcp:${{ steps.params.outputs.admin_api_port }}" \
            --source-ranges "${{ steps.params.outputs.attestation_source_ranges }}" \
            --target-tags "${{ steps.params.outputs.firewall_tag }}" \
            --description "Temporary attestation ingress for run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"

      # The node must ship its logs before its release publishes: 2.3.120
      # shipped images whose vector exited at boot, and nothing noticed. The
      # node boots with `logs-endpoint` and `observability-token`, the two keys
      # mdma sets, pointed at a throwaway receiver VM that records whether each
      # push carried that token (node_log_auth_probe.sh, the staging probe's
      # `log_auth_check`). Neither key is measured, so the published MRTD and
      # RTMRs are the ones an mdma node, which gets both, has. Skipped on
      # locked-read-only (see LOG_AUTH_CHECK above).
      - name: Set up log-auth check
        id: log_auth
        if: ${{ success() && env.LOG_AUTH_CHECK == 'true' && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        env:
          IMAGE_PROFILE: ${{ matrix.profile }}
          VM_PROJECT: ${{ steps.params.outputs.vm_project }}
          VM_ZONE: ${{ steps.params.outputs.vm_zone }}
          VM_NETWORK: ${{ steps.params.outputs.vm_network }}
          VM_SUBNETWORK: ${{ steps.params.outputs.vm_subnetwork }}
          NODE_TAG: ${{ steps.params.outputs.firewall_tag }}
          RECEIVER_PREFIX: tee-attest-rcv
          RUN_SUFFIX: ${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          TOKEN_FILE: ${{ runner.temp }}/log-auth-token
        run: bash scripts/ci/probes/node_log_auth_probe.sh setup

      - name: Create ephemeral TDX VM
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        env:
          RECEIVER_IP: ${{ steps.log_auth.outputs.receiver_ip }}
          TOKEN_FILE: ${{ runner.temp }}/log-auth-token
        run: |
          set -euo pipefail
          metadata="merod-version=${{ steps.params.outputs.merod_version }},ephemeral-store=true"
          if [[ "${LOG_AUTH_CHECK}" == "true" ]]; then
            # The same two keys mdma sets; the receiver stands in for the sink.
            metadata+=",logs-endpoint=http://${RECEIVER_IP}:9200,observability-token=$(cat "${TOKEN_FILE}")"
            rm -f "${TOKEN_FILE}"
          fi
          # The data disk mdma attaches at creation (dispatcher/app/gcp/instances.py)
          # is part of the machine RTMR0 measures: a VM measured without it publishes
          # an RTMR0 no mdma node has, and the KMS refuses every node. Same size, type
          # and device name as mdma; the disk itself is unused here.
          # gcp_create_instance retries GCP's transient errors (run 39287102050
          # lost a release to one "Internal error") and keeps the name, so the
          # cleanup below still finds the VM.
          source scripts/ci/gcp_create_instance.sh
          gcp_create_instance "${{ steps.params.outputs.instance_name }}" \
            "${{ steps.params.outputs.vm_project }}" \
            "${{ steps.params.outputs.vm_zone }}" \
            --machine-type "${{ steps.params.outputs.vm_machine_type }}" \
            --confidential-compute-type "TDX" \
            --maintenance-policy "TERMINATE" \
            --min-cpu-platform "Intel Sapphire Rapids" \
            --no-service-account \
            --no-scopes \
            --image "${{ steps.params.outputs.image_name }}" \
            --image-project "${{ steps.params.outputs.image_project }}" \
            --subnet "${{ steps.params.outputs.vm_subnetwork }}" \
            --metadata "${metadata}" \
            --create-disk "size=200GB,type=pd-balanced,device-name=data,auto-delete=yes" \
            --tags "merotee,${{ steps.params.outputs.firewall_tag }}"

      - name: Wait for VM to reach RUNNING
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          source scripts/ci/logging.sh
          if ! python3 scripts/ci/polling/wait_for_gcp_instance_status.py \
            --instance "${{ steps.params.outputs.instance_name }}" \
            --project "${{ steps.params.outputs.vm_project }}" \
            --zone "${{ steps.params.outputs.vm_zone }}" \
            --target-status "RUNNING" \
            --attempts 30 \
            --sleep-seconds 10 \
            --heartbeat-interval 5 \
            --verbosity "${CI_LOG_VERBOSITY}" \
            --output-json "${{ steps.params.outputs.artifacts_dir }}/vm-running-wait.json"; then
            ci_fail "VM_RUNNING_TIMEOUT" "Instance did not reach RUNNING in time."
            gcloud compute instances describe "${{ steps.params.outputs.instance_name }}" \
              --project "${{ steps.params.outputs.vm_project }}" \
              --zone "${{ steps.params.outputs.vm_zone }}" \
              --format='yaml(name,status,lastStartTimestamp)'
            exit 1
          fi

      - name: Resolve attestation base URL
        id: endpoint
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          nat_ip="$(gcloud compute instances describe "${{ steps.params.outputs.instance_name }}" \
            --project "${{ steps.params.outputs.vm_project }}" \
            --zone "${{ steps.params.outputs.vm_zone }}" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')"

          if [[ -z "${nat_ip}" ]]; then
            echo "No external IP found on attestation VM; cannot reach admin API from GitHub runner."
            exit 1
          fi

          echo "nat_ip=${nat_ip}" >> "${GITHUB_OUTPUT}"
          echo "base_url=http://${nat_ip}:${{ steps.params.outputs.admin_api_port }}" >> "${GITHUB_OUTPUT}"

      - name: Collect TEE info and quote artifacts
        id: collect_tee
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          source scripts/ci/logging.sh
          artifacts_dir="${{ steps.params.outputs.artifacts_dir }}"
          base_url="${{ steps.endpoint.outputs.base_url }}"

          gcloud compute instances describe "${{ steps.params.outputs.instance_name }}" \
            --project "${{ steps.params.outputs.vm_project }}" \
            --zone "${{ steps.params.outputs.vm_zone }}" \
            --format='json(name,status,networkInterfaces,tags,creationTimestamp,lastStartTimestamp)' \
            > "${artifacts_dir}/instance.json"

          # merod 1.0 runs only with a KMS, which this VM has none of, so the
          # image serves its release attestation instead (`merod attest --serve`,
          # calimero-init): a quote over our nonce that needs no key or store.
          timeout_seconds=450
          set +e
          bash scripts/ci/probes/node_release_attestation.sh "${base_url}" "${artifacts_dir}" "${timeout_seconds}"
          attest_exit=$?
          set -e
          if [[ "${attest_exit}" -eq 2 ]]; then
            observed_attempts="$(jq -r '.attempts // "unknown"' "${artifacts_dir}/release-attestation-wait.json" 2>/dev/null || echo "unknown")"
            ci_fail "HEALTH_TIMEOUT" "Timed out waiting for ${base_url}/attestation/release after ${observed_attempts} attempts (timeout ${timeout_seconds}s)"
            ci_group_start "Failure diagnostics (bounded)"
            ci_info "Capturing serial console logs for diagnostics..."
            for serial_port in 1 2 3 4; do
              gcloud compute instances get-serial-port-output "${{ steps.params.outputs.instance_name }}" \
                --project "${{ steps.params.outputs.vm_project }}" \
                --zone "${{ steps.params.outputs.vm_zone }}" \
                --port "${serial_port}" \
                > "${artifacts_dir}/serial-port-${serial_port}.log" || true
            done
            echo "=== Targeted serial-port-1 matches (last 120): calimero-init|merod|ERROR|failed|WARN ==="
            grep -E -i "calimero-init|merod|ERROR|failed|WARN" "${artifacts_dir}/serial-port-1.log" 2>/dev/null | tail -120 || true
            echo "=== Last 120 lines of serial-port-1 ==="
            tail -120 "${artifacts_dir}/serial-port-1.log" 2>/dev/null || true
            ci_artifact "full serial logs are stored in workflow artifacts (serial-port-*.log)"
            ci_group_end
            exit 1
          elif [[ "${attest_exit}" -ne 0 ]]; then
            exit 1
          fi
          nonce="$(jq -r .nonce "${artifacts_dir}/tee-attest-request.json")"

          jq -n \
            --arg base_url "${base_url}" \
            --arg nonce "${nonce}" \
            --arg instance "${{ steps.params.outputs.instance_name }}" \
            --arg image "${{ steps.params.outputs.image_name }}" \
            --arg project "${{ steps.params.outputs.vm_project }}" \
            --arg zone "${{ steps.params.outputs.vm_zone }}" \
            '{base_url: $base_url, nonce: $nonce, instance: $instance, image: $image, project: $project, zone: $zone}' \
            > "${artifacts_dir}/attestation-context.json"

      # The node answering proves it booted, not WHICH root it booted: a boot
      # that fell back to the base partition would answer too. The profiles
      # that keep a serial console show the kernel cmdline and the initrd's
      # verity setup, so require both (mero-tee#334). locked-read-only has no
      # console; it runs the same seal and the same initrd.
      - name: Check the node booted its dm-verity root
        if: ${{ success() && matrix.profile != 'locked-read-only' && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          set -euo pipefail
          serial="$(gcloud compute instances get-serial-port-output "${{ steps.params.outputs.instance_name }}" \
            --project "${{ steps.params.outputs.vm_project }}" --zone "${{ steps.params.outputs.vm_zone }}" 2>/dev/null || true)"
          if ! grep -E 'Command line:.* roothash=[0-9a-f]{64} ' <<< "${serial}"; then
            echo "::error::the booted kernel cmdline carries no dm-verity root hash"
            exit 1
          fi
          if ! grep -E 'veritysetup@root' <<< "${serial}"; then
            echo "::error::the initrd never set up the dm-verity root"
            exit 1
          fi
          echo "Booted the dm-verity root."

      # Runs once /attestation/release answers, so vector has been up for a while and
      # the first poll usually passes. A failure fails this profile, and so
      # "Publish profile MRTDs", which needs every profile. Skipped on
      # locked-read-only (see LOG_AUTH_CHECK above).
      - name: Verify the node pushed logs with its metadata token
        id: verify_log_auth
        if: ${{ success() && env.LOG_AUTH_CHECK == 'true' && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        env:
          ARTIFACTS_DIR: ${{ steps.params.outputs.artifacts_dir }}
          VM_PROJECT: ${{ steps.params.outputs.vm_project }}
          VM_ZONE: ${{ steps.params.outputs.vm_zone }}
          RECEIVER_PREFIX: tee-attest-rcv
          RUN_SUFFIX: ${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          VERIFY_TIMEOUT_SECONDS: "600"
        run: bash scripts/ci/probes/node_log_auth_probe.sh verify

      - name: Add profile-specific artifact names
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          artifacts_dir="${{ steps.params.outputs.artifacts_dir }}"
          profile="${{ steps.params.outputs.profile }}"
          cp "${artifacts_dir}/instance.json" "${artifacts_dir}/instance-${profile}.json"
          cp "${artifacts_dir}/release-attestation.json" "${artifacts_dir}/release-attestation-${profile}.json"
          cp "${artifacts_dir}/tee-info.json" "${artifacts_dir}/tee-info-${profile}.json"
          cp "${artifacts_dir}/tee-attest-request.json" "${artifacts_dir}/tee-attest-request-${profile}.json"
          cp "${artifacts_dir}/tee-attest-response.json" "${artifacts_dir}/tee-attest-response-${profile}.json"
          cp "${artifacts_dir}/attestation-context.json" "${artifacts_dir}/attestation-context-${profile}.json"

      - name: Build attestation artifact index
        if: ${{ always() && steps.params.outcome == 'success' }}
        run: |
          set -euo pipefail
          source scripts/ci/logging.sh
          artifacts_dir="${{ steps.params.outputs.artifacts_dir }}"
          index_file="${artifacts_dir}/artifacts-index.txt"
          python3 scripts/ci/artifacts/build_artifact_index.py \
            --base-dir "${artifacts_dir}" \
            --output "${index_file}" \
            --entry "instance.json|VM metadata snapshot" \
            --entry "release-attestation.json|The node's /attestation/release answer (merod attest --serve)" \
            --entry "tee-info.json|MRTD the node read from its quote, and its release claim" \
            --entry "tee-attest-request.json|Nonce sent to /attestation/release" \
            --entry "tee-attest-response.json|Release attestation with quoteB64 for the verifiers" \
            --entry "attestation-context.json|Context and endpoint details" \
            --entry "measurement-policy-candidates.json|Derived policy candidates" \
            --entry "mrtd.json|MRTD from external verification" \
            --entry "profile-provenance-${{ steps.params.outputs.profile }}.json|Per-profile provenance record" \
            --entry "node-log-auth-result.json|Log-auth check: pushes seen by the receiver" \
            --entry "log-auth-receiver-serial.log|Log-auth receiver serial console" \
            --entry "serial-port-1.log|Serial logs when /attestation/release never answered"
          ci_artifact "artifact index saved to ${index_file}"

      - name: Require Intel Trust Authority API key
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        env:
          ITA_API_KEY: ${{ secrets.ITA_API_KEY }}
        run: |
          if [[ -z "${ITA_API_KEY}" ]]; then
            echo "::error::ITA_API_KEY is required for release-grade quote verification. Refusing to publish unverifiable MRTDs."
            exit 1
          fi

      - name: Verify quote externally (Intel Trust Authority)
        id: verify_external
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        env:
          ITA_API_KEY: ${{ secrets.ITA_API_KEY }}
        run: |
          artifacts_dir="${{ steps.params.outputs.artifacts_dir }}"
          profile="${{ steps.params.outputs.profile }}"
          ita_url="${ITA_APPRAISAL_URL:-https://api.trustauthority.intel.com/appraisal/v2/attest}"

          policy_flags=()
          if [[ -n "${ITA_POLICY_IDS:-}" ]]; then
            policy_flags+=(--policy-ids "${ITA_POLICY_IDS}")
          fi
          if [[ "${ITA_POLICY_MUST_MATCH:-true}" == "true" ]]; then
            policy_flags+=(--policy-must-match)
          fi

          python3 scripts/attestation/shared/verify_tdx_quote_ita.py \
            --attest-response "${artifacts_dir}/tee-attest-response.json" \
            --tee-info "${artifacts_dir}/tee-info.json" \
            --output-dir "${artifacts_dir}" \
            --ita-url "${ita_url}" \
            --ita-api-key "${ITA_API_KEY}" \
            "${policy_flags[@]}"

          claims_file="${artifacts_dir}/external-attestation-token-claims.json"
          if [[ ! -f "${claims_file}" ]]; then
            echo "::error::Missing external attestation claims file: ${claims_file}"
            exit 1
          fi
          # --keep-outofdate: since 2026-10-15 the probe hosts report UpToDate, but
          # the fleet's hosts are being patched in place and some may still report
          # OutOfDate. Drop it (and outofdate from DEFAULT_ALLOWED_TCB_STATUSES)
          # once they all report UpToDate.
          python3 scripts/attestation/shared/extract_tdx_policy_candidates.py \
            --claims "${claims_file}" \
            --attest-response "${artifacts_dir}/tee-attest-response.json" \
            --output-json "${artifacts_dir}/measurement-policy-candidates.json" \
            --allow-missing-tcb \
            --keep-outofdate

          mrtd="$(jq -r '.mrtd // empty' "${artifacts_dir}/mrtd.json" | tr '[:upper:]' '[:lower:]')"
          mrtd="${mrtd#0x}"
          if [[ ! "${mrtd}" =~ ^[a-f0-9]{96}$ ]]; then
            echo "::error::Invalid MRTD in ${artifacts_dir}/mrtd.json for profile '${profile}'. Expected 96 hex characters, got '${mrtd}'."
            exit 1
          fi

          tmp_mrtd_json="${artifacts_dir}/mrtd.normalized.json"
          jq --arg mrtd "${mrtd}" '.mrtd = $mrtd' "${artifacts_dir}/mrtd.json" > "${tmp_mrtd_json}"
          mv "${tmp_mrtd_json}" "${artifacts_dir}/mrtd.json"

          # Add RTMRs to mrtd file for complete measurement record (MRTD + RTMR0-3)
          jq -s '.[0] + {
            rtmr0: (.[1].policy.allowed_rtmr0[0] // ""),
            rtmr1: (.[1].policy.allowed_rtmr1[0] // ""),
            rtmr2: (.[1].policy.allowed_rtmr2[0] // ""),
            rtmr3: (.[1].policy.allowed_rtmr3[0] // "")
          }' "${artifacts_dir}/mrtd.json" "${artifacts_dir}/measurement-policy-candidates.json" > "${artifacts_dir}/mrtd-with-rtmrs.json"
          mv "${artifacts_dir}/mrtd-with-rtmrs.json" "${artifacts_dir}/mrtd-${profile}.json"
          cp "${artifacts_dir}/measurement-policy-candidates.json" "${artifacts_dir}/measurement-policy-candidates-${profile}.json"
          echo "mrtd=${mrtd}" >> "${GITHUB_OUTPUT}"
          echo "status=performed" >> "${GITHUB_OUTPUT}"
          echo "performed=true" >> "${GITHUB_OUTPUT}"

          {
            echo ""
            echo "# After Intel Trust Authority verification"
            for rel in ita-ci-verification-summary.json external-attestation-token-claims.json external-verification-response.json external-attestation-token.jwt; do
              if [[ -f "${artifacts_dir}/${rel}" ]]; then
                echo "${rel}|yes|ITA / quote verification artifact"
              else
                echo "${rel}|no|missing"
              fi
            done
          } >> "${artifacts_dir}/artifacts-index.txt"

      # mdma#480: RTMR1-3 are computed from the build, before it boots, and the
      # release's quote must match them. The build evidence (manifests, command
      # line, computed registers, root and initrd digests) goes out with the
      # attestation artifacts.
      - name: Compare the quote's RTMR1-3 with the computed ones
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mkosi-evidence
        run: |
          set -euo pipefail
          artifacts_dir="${{ steps.params.outputs.artifacts_dir }}"
          profile="${{ steps.params.outputs.profile }}"
          mkdir -p "${artifacts_dir}/build"
          cp "${EVIDENCE_DIR}"/{computed.json,cmdline.txt,uki.sha256,root.digest,initrd.digest} \
             "${EVIDENCE_DIR}"/merotee-node.manifest "${EVIDENCE_DIR}"/merotee-node.rendered.json "${artifacts_dir}/build/"
          cp "${EVIDENCE_DIR}/computed.json" "${artifacts_dir}/computed-rtmrs-${profile}.json"
          jq '(.data // .) | {quoteB64, eventLogB64}' "${artifacts_dir}/tee-attest-response.json" > "${RUNNER_TEMP}/evidence.json"
          python3 scripts/attestation/shared/compute_rtmr.py compare \
            "${EVIDENCE_DIR}/computed.json" "${RUNNER_TEMP}/evidence.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Build per-profile provenance record
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          artifacts_dir="${{ steps.params.outputs.artifacts_dir }}"
          profile="${{ steps.params.outputs.profile }}"

          image_file="${artifacts_dir}/image-${profile}.json"
          context_file="${artifacts_dir}/attestation-context-${profile}.json"
          mrtd_file="${artifacts_dir}/mrtd-${profile}.json"

          image_family="$(jq -r '.family // ""' "${image_file}")"
          image_self_link="$(jq -r '.selfLink // ""' "${image_file}")"
          mrtd_value=""
          if [[ -f "${mrtd_file}" ]]; then
            mrtd_value="$(jq -r '.mrtd // ""' "${mrtd_file}")"
          fi

          jq -n \
            --arg profile "${profile}" \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg image_name "${{ steps.params.outputs.image_name }}" \
            --arg image_project "${{ steps.params.outputs.image_project }}" \
            --arg image_family "${image_family}" \
            --arg image_self_link "${image_self_link}" \
            --arg verification_status "${{ steps.verify_external.outputs.status }}" \
            --arg mrtd "${mrtd_value}" \
            --slurpfile context "${context_file}" \
            '{
              profile: $profile,
              tag: $tag,
              commit_sha: $commit,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt,
              image: {
                name: $image_name,
                project: $image_project,
                family: $image_family,
                self_link: $image_self_link
              },
              attestation_context: $context[0],
              external_verification: {
                status: $verification_status,
                mrtd: $mrtd
              }
            }' > "${artifacts_dir}/profile-provenance-${profile}.json"

      - name: Record ephemeral target details
        if: ${{ success() && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          set -euo pipefail
          source scripts/ci/logging.sh
          result_line="$(ci_result "release-node-image-gcp-profile" "${{ job.status }}" "PROFILE_PIPELINE_STAGE" "profile=${{ steps.params.outputs.profile }}" "artifact=gcp-tdx-attestation-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}")"
          ci_info "${result_line}"
          summary_json="${RUNNER_TEMP}/release-node-image-gcp-profile-summary-${{ steps.params.outputs.profile }}.json"
          jq -n \
            --arg profile "${{ steps.params.outputs.profile }}" \
            --arg project "${{ steps.params.outputs.vm_project }}" \
            --arg zone "${{ steps.params.outputs.vm_zone }}" \
            --arg instance "${{ steps.params.outputs.instance_name }}" \
            --arg arch "${{ steps.params.outputs.cpu_architecture }}" \
            --arg image "${{ steps.params.outputs.image_name }}" \
            --arg base_url "${{ steps.endpoint.outputs.base_url }}" \
            --arg src_ranges "${{ steps.params.outputs.attestation_source_ranges }}" \
            --arg collect_outcome "${{ steps.collect_tee.outcome || 'skipped' }}" \
            --arg verify_outcome "${{ steps.verify_external.outcome || 'skipped' }}" \
            --arg log_auth_outcome "${{ env.LOG_AUTH_CHECK == 'true' && (steps.verify_log_auth.outcome || 'skipped') || 'skipped on this profile: locked-read-only ships logs only over https, and the receiver is plain http (debug and debug-read-only run the check)' }}" \
            --arg job_status "${{ job.status }}" \
            --arg result_line "${result_line}" \
            --arg artifact_name "gcp-tdx-attestation-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            '{
              title: "Workflow Summary",
              sections: [
                {
                  name: "Inputs / Targets",
                  lines: [
                    ("- Profile: " + $profile),
                    ("- Project: " + $project),
                    ("- Zone: " + $zone),
                    ("- Instance: " + $instance),
                    ("- CPU architecture: " + $arch),
                    ("- Image: " + $image),
                    ("- Base URL: " + $base_url),
                    ("- Firewall source ranges: " + $src_ranges)
                  ]
                },
                {
                  name: "Check Outcomes",
                  lines: [
                    ("- Collect TEE artifacts: " + $collect_outcome),
                    ("- External verification: " + $verify_outcome),
                    ("- Log push authenticated: " + $log_auth_outcome)
                  ]
                },
                {
                  name: "Result",
                  lines: [
                    ("- Job status: " + $job_status),
                    ("- " + $result_line)
                  ]
                },
                {
                  name: "Artifacts",
                  lines: [
                    ("- Artifact name: " + $artifact_name),
                    "- Artifact index: artifacts-index.txt"
                  ]
                },
                {
                  name: "Next",
                  lines: [
                    "- Use measurement-policy-candidates-profile.json files for policy promotion."
                  ]
                }
              ]
            }' > "${summary_json}"
          python3 scripts/ci/summary/write_workflow_summary.py \
            --input-json "${summary_json}" \
            --output "${GITHUB_STEP_SUMMARY}"

      - name: Upload attestation artifacts
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' && always() && steps.params.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcp-tdx-attestation-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.params.outputs.artifacts_dir }}
          if-no-files-found: warn

      - name: Cleanup ephemeral TDX VM
        if: ${{ steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' && always() }}
        run: |
          instance_name="${{ steps.params.outputs.instance_name }}"
          vm_project="${{ steps.params.outputs.vm_project }}"
          vm_zone="${{ steps.params.outputs.vm_zone }}"
          firewall_rule="${{ steps.params.outputs.firewall_rule }}"

          if [[ -n "${instance_name}" && -n "${vm_project}" && -n "${vm_zone}" ]]; then
            gcloud compute instances delete "${instance_name}" \
              --project "${vm_project}" \
              --zone "${vm_zone}" \
              --delete-disks=all \
              --quiet || true
          else
            echo "Direct instance cleanup skipped (instance parameters unavailable)."
          fi

          if [[ -n "${firewall_rule}" && -n "${vm_project}" ]]; then
            gcloud compute firewall-rules delete "${firewall_rule}" \
              --project "${vm_project}" \
              --quiet || true
          else
            echo "Direct firewall cleanup skipped (firewall parameters unavailable)."
          fi

          # The log-auth receiver and its rule. Best effort, and safe after a
          # partial setup; on master the sweep job catches what this misses.
          if [[ "${LOG_AUTH_CHECK}" != "true" ]]; then
            echo "No log-auth receiver on ${{ matrix.profile }} (check skipped); nothing to delete."
          elif [[ -n "${vm_project}" && -n "${vm_zone}" ]]; then
            VM_PROJECT="${vm_project}" VM_ZONE="${vm_zone}" \
            RECEIVER_PREFIX=tee-attest-rcv \
            RUN_SUFFIX="${{ matrix.profile }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              bash scripts/ci/probes/node_log_auth_probe.sh cleanup
          else
            echo "Direct log-auth receiver cleanup skipped (instance parameters unavailable)."
          fi

      # A branch build's image exists only to be measured here; it is never
      # published, so it goes once this run is done with it.
      - name: Delete branch build image
        if: ${{ always() && env.IMAGE_SUFFIX != '' && steps.auth_mode.outputs.run_full_pipeline == 'true' && steps.gcp_access.outputs.can_run == 'true' }}
        run: |
          image_name="${{ steps.params.outputs.image_name }}"
          image_project="${{ steps.params.outputs.image_project }}"
          if [[ -n "${image_name}" && -n "${image_project}" && "${image_name}" == *"${IMAGE_SUFFIX}" ]]; then
            gcloud compute images delete "${image_name}" --project "${image_project}" --quiet || true
          else
            echo "Branch image cleanup skipped (no suffixed image resolved)."
          fi

  cleanup_attestation_resources:
    name: Cleanup attestation resources
    runs-on: ubuntu-latest
    needs: [preflight, profile_pipeline]
    if: ${{ always() && needs.preflight.outputs.run_pipeline == 'true' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine GCP auth mode
        id: auth_mode
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          mode="none"
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            mode="wif"
          elif [[ -n "${SA_KEY}" ]]; then
            mode="key"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Require GCP auth for cleanup
        if: ${{ steps.auth_mode.outputs.mode == 'none' }}
        run: |
          echo "Missing GCP auth configuration for cleanup job."
          exit 1

      - name: Authenticate to GCP via workload identity
        if: ${{ steps.auth_mode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to GCP via service account key
        if: ${{ steps.auth_mode.outputs.mode == 'key' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Sweep current-run and stale CI attestation resources
        run: bash scripts/release/node-image-gcp/sweep-attestation-resources.sh

  publish_mrtds:
    name: Publish profile MRTDs
    runs-on: ubuntu-latest
    needs: [preflight, profile_pipeline, cleanup_attestation_resources]
    if: ${{ needs.preflight.outputs.run_pipeline == 'true' && github.ref == 'refs/heads/master' }}
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download attestation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gcp-tdx-attestation-*
          path: artifacts
          merge-multiple: true

      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Assemble published MRTD payload
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.image_version }}
        run: bash scripts/release/node-image-gcp/assemble-published-mrtd-payload.sh

      - name: Install cosign for keyless signing
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign release assets with Sigstore keyless
        env:
          COSIGN_YES: "true"
        run: bash scripts/release/node-image-gcp/sign-release-assets.sh

      - name: Verify generated signatures
        run: bash scripts/release/node-image-gcp/verify-generated-signatures.sh

      - name: Check if release assets already exist
        id: check_assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mero-tee-v${{ needs.preflight.outputs.image_version }}"
          count=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets | length' 2>/dev/null || echo "0")
          if [[ "$count" -gt 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag already has $count assets — skipping upload to avoid immutable-release conflict."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload MRTD release assets
        if: steps.check_assets.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          tag_name: mero-tee-v${{ needs.preflight.outputs.image_version }}
          # The commit this run built the image from. Unset, the tag lands on
          # the default branch's tip when this step runs, which is a later
          # commit whenever master moved during the build.
          target_commitish: ${{ github.sha }}
          make_latest: false
          body_path: artifacts/release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/published-mrtds.json
            artifacts/published-mrtds.json.sig
            artifacts/published-mrtds.json.pem
            artifacts/published-mrtds.json.bundle.json
            artifacts/release-provenance.json
            artifacts/release-provenance.json.sig
            artifacts/release-provenance.json.pem
            artifacts/release-provenance.json.bundle.json
            artifacts/node-image-gcp-release-sbom.spdx.json
            artifacts/node-image-gcp-release-sbom.spdx.json.sig
            artifacts/node-image-gcp-release-sbom.spdx.json.pem
            artifacts/node-image-gcp-release-sbom.spdx.json.bundle.json
            artifacts/node-image-gcp-checksums.txt
            artifacts/node-image-gcp-checksums.txt.sig
            artifacts/node-image-gcp-checksums.txt.pem
            artifacts/node-image-gcp-checksums.txt.bundle.json

      - name: Smoke test published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/verify-node-image-gcp-release-assets.sh "mero-tee-v${{ needs.preflight.outputs.image_version }}"

      - name: Upsert umbrella version release links
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.image_version }}
          TARGET_COMMIT: ${{ github.sha }}
        run: bash scripts/release/node-image-gcp/upsert-umbrella-release-links.sh


---
# Full data-disk encryption (see "The data disk" in calimero-init.sh.j2): the
# boot script formats a blank data disk as LUKS2 with dm-integrity and opens it
# on every boot. The kernel side (dm-crypt, dm-integrity) is asserted below.
- name: Install cryptsetup for the encrypted data disk
  apt:
    name: cryptsetup
    state: present

# Ensure tdx_guest module for RTMR3 extend (TDX Confidential VMs)
- name: Install linux-modules-extra for tdx_guest (RTMR3 extend)
  apt:
    name: "linux-modules-extra-{{ ansible_kernel }}"
    state: present
  ignore_errors: true
  when: ansible_kernel is defined

# Inject profile into kernel cmdline so it is measured into RTMR[2] (GCP TDX).
# This differentiates profiles at attestation time; cannot be faked without rebuilding.
- name: Ensure grub.d exists for profile drop-in
  file:
    path: /etc/default/grub.d
    state: directory
    mode: "0755"

- name: Add calimero.role and calimero.profile to kernel cmdline (measured into RTMR[2])
  copy:
    content: |
      # Role/profile kernel params for TDX attestation (RTMR[2]).
      # role differentiates node images from KMS role measurements.
      GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} calimero.role=node calimero.profile={{ lockdown_profile | default('locked-read-only') }}"
    dest: /etc/default/grub.d/50-calimero-profile.cfg
    mode: "0644"

- name: Update GRUB with profile kernel param
  command: update-grub
  changed_when: true

# Directories and config
- name: Create calimero base directory
  file:
    path: /etc/calimero
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create calimero init lib directory
  file:
    path: /usr/local/lib/calimero
    state: directory
    owner: root
    group: root
    mode: "0755"

# The oldest `tee-release-version` this image accepts: its own version. The
# KMS release that admits an image is always cut after the image is measured,
# so nothing older can be a legitimate choice, only a downgrade to an older
# (validly signed) policy. Under /etc/calimero, so the root hash measures it.
# calimero-init refuses a lower release and passes it to merod as
# MERO_TEE_MIN_VERSION. `image_version` is packer's `version` (versions.json
# `imageVersion`), passed by ubuntu.pkr.hcl.
- name: Bake the minimum tee-release-version (this image's version)
  copy:
    content: "{{ image_version }}\n"
    dest: /etc/calimero/min-tee-release-version
    owner: root
    group: root
    mode: "0644"
  when: image_version | default('') | length > 0

- name: Assert locked-read-only images carry a release floor
  assert:
    that:
      - image_version | default('') | length > 0
    fail_msg: >-
      image_version is not set, so this image would bake no minimum
      tee-release-version and any older signed release could be named in
      instance metadata. Build through build-and-release.sh / ubuntu.pkr.hcl,
      which pass versions.json imageVersion.
  when: lockdown_profile | default('locked-read-only') == 'locked-read-only'

- name: Render baked-in init script (R6)
  template:
    src: calimero-init.sh.j2
    dest: /usr/local/lib/calimero/init.sh
    owner: root
    group: root
    mode: "0755"

- name: Create calimero-init systemd service (R6)
  copy:
    content: |
      [Unit]
      Description=Calimero locked-down image init
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # The first boot formats the data disk with dm-integrity, which wipes the
      # whole device and runs at the disk's write throughput. A start timeout
      # would kill it halfway and leave a LUKS header with no identity token,
      # which the next boot (correctly) refuses to touch.
      TimeoutStartSec=infinity
      ExecStart=/usr/local/lib/calimero/init.sh

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/calimero-init.service

- name: Enable calimero-init at boot
  systemd:
    name: calimero-init.service
    enabled: true
    daemon_reload: true

- name: Ensure traefik starts after calimero-init
  file:
    path: /etc/systemd/system/traefik.service.d
    state: directory
    mode: "0755"

- name: Drop-in for traefik to run after calimero-init
  copy:
    content: |
      [Unit]
      After=calimero-init.service
    dest: /etc/systemd/system/traefik.service.d/after-calimero-init.conf
    mode: "0644"

- name: Ensure vmagent and vector config dirs exist for R7 defaults
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/vmagent
    - /etc/vector

- name: Copy default vmagent scrape config for R7
  copy:
    src: vmagent-scrape-config.yml
    dest: /etc/vmagent/scrape_config.yml
    owner: root
    group: root
    mode: "0644"

- name: Copy default vector partial config for R7
  copy:
    src: vector-partial-merod.yaml
    dest: /etc/vector/vector_partial.yaml
    owner: root
    group: root
    mode: "0644"

- name: Copy mero-auth configuration file
  copy:
    src: mero-auth-config.toml
    dest: /etc/calimero/auth.toml
    owner: root
    group: root
    mode: "0755"

- name: Create mero-auth systemd service file
  copy:
    content: |
        [Unit]
        Description=mero-auth
        # Requires, not just After: mero-auth's database lives on /mnt/data. If
        # calimero-init failed (the data disk could not be unlocked), starting
        # anyway would create that database on the ROOT filesystem under
        # /mnt/data -- in plaintext, and making the next boot mistake the
        # directory for a pre-disk node's state.
        Requires=calimero-init.service
        After=calimero-init.service

        [Service]
        # Default log level, not the verbose flag it used to run with: this
        # unit's output is shipped to an endpoint set in instance metadata, and
        # verbose auth logging is request-level detail about who authenticates
        # to this node.
        ExecStart=/usr/local/bin/mero-auth --config /etc/calimero/auth.toml
        Restart=always
        # A core dump of this process is its keys, written to disk.
        LimitCORE=0

        [Install]
        WantedBy=multi-user.target
    dest: /etc/systemd/system/mero-auth.service

- name: Create merod systemd service file
  copy:
    content: |
        [Unit]
        Description=merod
        # Requires: never run against /mnt/data unless calimero-init unlocked
        # and mounted it (see mero-auth above).
        Requires=calimero-init.service
        After=calimero-init.service

        [Service]
        EnvironmentFile=-/etc/calimero/merod.env
        ExecStart=/usr/local/bin/merod --home /mnt/data/calimero --node default run
        Restart=always
        # A core dump of merod is its signing identity and every group key.
        LimitCORE=0

        [Install]
        WantedBy=multi-user.target
    dest: /etc/systemd/system/merod.service

- name: Render fleet sidecar script (bakes MDMA URL into image)
  template:
    src: fleet-sidecar.sh.j2
    dest: /usr/local/lib/calimero/fleet-sidecar.sh
    owner: root
    group: root
    mode: "0755"
    # This template is a bash script, and bash's array-length form `${#arr[@]}`
    # opens with the same two characters as a Jinja comment. Jinja then reads
    # the rest of the file looking for `#}`, hits EOF, and the render dies with
    # "Missing end of comment tag" -- which is what broke the 2.3.55 and 2.3.56
    # node images. The file has no Jinja comments in it (only the two variables
    # below), so moving the comment delimiter somewhere bash cannot produce
    # costs nothing and retires the whole class.
    comment_start_string: "{@#"
    comment_end_string: "#@}"
  when: merod_mode == "read-only"

- name: Create fleet sidecar systemd service
  copy:
    content: |
        [Unit]
        Description=Fleet HA sidecar (polls MDMA for group assignments)
        # Requires calimero-init: the sidecar's state, fleet token included,
        # lives on the encrypted data disk (/mnt/data/fleet), and must never be
        # written to the root filesystem because the disk failed to unlock.
        Requires=calimero-init.service
        After=calimero-init.service merod.service
        Wants=merod.service

        [Service]
        ExecStart=/usr/local/lib/calimero/fleet-sidecar.sh
        Restart=always
        RestartSec=5

        [Install]
        WantedBy=multi-user.target
    dest: /etc/systemd/system/fleet-sidecar.service
  when: merod_mode == "read-only"

- name: Enable fleet sidecar at boot
  systemd:
    name: fleet-sidecar.service
    enabled: true
    daemon_reload: true
  when: merod_mode == "read-only"

# --- Nothing secret persists on the boot disk -------------------------------
#
# TDX encrypts this VM's memory; the boot disk is as readable to the cloud
# project as the data disk, and unlike the data disk it is not encrypted. So
# every path by which memory reaches it is closed here: the journal, core
# dumps and swap. Applied on every profile -- none of them needs these, and a
# debug-read-only node still holds real fleet keys.

# Journald keeps logs in /run (RAM) only. Units still log to it, and vector
# still ships it; nothing is written to /var/log/journal. ForwardToSyslog=no so
# rsyslog (present on the Ubuntu base) cannot write the same lines to
# /var/log/syslog instead; merod-lockdown also masks rsyslog on locked-read-only.
- name: Ensure journald drop-in directory exists
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Keep the journal in memory only
  copy:
    content: |
      # calimero: logs never persist to the (unencrypted) boot disk.
      [Journal]
      Storage=volatile
      ForwardToSyslog=no
      ForwardToWall=no
    dest: /etc/systemd/journald.conf.d/60-calimero-volatile.conf
    mode: "0644"

- name: Remove any persistent journal left by the base image
  file:
    path: /var/log/journal
    state: absent

# Core dumps are process memory written to disk: for merod that is its signing
# identity and every group key. Off at every layer, so no single one being
# re-enabled by a package brings them back: the kernel pattern pipes to
# /bin/false (sysctl.d/60 sorts after systemd-coredump's 50-coredump.conf),
# setuid dumps are off, systemd gives every unit a zero core limit, and
# systemd-coredump (if installed) stores nothing.
- name: Disable kernel core dumps
  copy:
    content: |
      # calimero: no process memory is ever written to disk.
      kernel.core_pattern=|/bin/false
      fs.suid_dumpable=0
    dest: /etc/sysctl.d/60-calimero-no-coredump.conf
    mode: "0644"

- name: Ensure systemd manager drop-in directory exists
  file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"

- name: Give every unit a zero core-dump limit
  copy:
    content: |
      [Manager]
      DefaultLimitCORE=0
    dest: /etc/systemd/system.conf.d/60-calimero-no-coredump.conf
    mode: "0644"

- name: Ensure systemd-coredump drop-in directory exists
  file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    mode: "0755"

- name: Store nothing if systemd-coredump is ever present
  copy:
    content: |
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    dest: /etc/systemd/coredump.conf.d/60-calimero-no-coredump.conf
    mode: "0644"

# apport and whoopsie collect crash dumps (and apport rewrites core_pattern
# when it starts). Leaf packages: nothing on this image depends on them.
- name: Purge crash reporters
  apt:
    name:
      - apport
      - whoopsie
    state: absent
    purge: true

- name: Mask the systemd-coredump socket
  systemd:
    name: systemd-coredump.socket
    masked: true
    daemon_reload: true

# No swap: a page swapped out is guest memory in plaintext on a host disk. The
# GCP Ubuntu base ships none; this makes sure nothing in the build added one,
# and calimero-init asserts `swapon` is empty at every boot before it fetches a
# key. (swap.target itself is masked on locked-read-only by merod-lockdown.)
- name: Remove swap entries from /etc/fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^[^#].*\sswap\s'
    state: absent

- name: Remove swap files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /swap.img
    - /swapfile

# --- Storage-encryption conformance ------------------------------------------
#
# calimero-init refuses to create a locked-read-only node without a
# KMS-encrypted store, and it creates one with `merod init --kms-url`. A merod
# that predates that flag cannot encrypt from the first write, so every new node
# on such an image would stop at boot. Catch it here, at build time, instead:
# the flag is a capability probe that needs no node, network or config.
- name: Probe whether the baked merod can encrypt its store at init
  command: /usr/local/bin/merod --node conformance init --help
  register: merod_kms_init_help
  changed_when: false
  failed_when: false
  when: lockdown_profile | default('locked-read-only') == 'locked-read-only'

- name: Assert the baked merod can create a KMS-encrypted store
  assert:
    that:
      - merod_kms_init_help.rc == 0
      - "'--kms-url' in merod_kms_init_help.stdout"
    fail_msg: >-
      The locked-read-only profile only creates nodes with a KMS-encrypted
      store, but the baked merod ({{ merod_version | default('unknown') }}) has
      no `init --kms-url`, so it can only create a plaintext one. Bump
      merodVersion in mero-tee/versions.json to a core release carrying it.
  when: lockdown_profile | default('locked-read-only') == 'locked-read-only'

# --- Data-disk-encryption conformance ----------------------------------------
#
# The same shape as the store assert above. calimero-init refuses to create a
# locked-read-only node's data disk without encryption, and it encrypts with
# `merod kms disk-key` + cryptsetup LUKS2/dm-integrity. A merod without the
# subcommand, a missing cryptsetup, or a kernel without dm-integrity would each
# make every NEW locked-read-only node stop at boot. Catch them here.
- name: Probe whether the baked merod can fetch a data-disk key
  command: /usr/local/bin/merod kms disk-key --help
  register: merod_disk_key_help
  changed_when: false
  failed_when: false
  when: lockdown_profile | default('locked-read-only') == 'locked-read-only'

- name: Assert the baked merod can unlock an encrypted data disk
  assert:
    that:
      - merod_disk_key_help.rc == 0
      - "'--key-out' in merod_disk_key_help.stdout"
      - "'--create-identity' in merod_disk_key_help.stdout"
    fail_msg: >-
      The locked-read-only profile only creates nodes with an encrypted data
      disk, keyed by `merod kms disk-key`, but the baked merod
      ({{ merod_version | default('unknown') }}) has no such subcommand. Every
      new node would refuse to boot. Bump merodVersion in
      mero-tee/versions.json to a core release carrying it.
  when: lockdown_profile | default('locked-read-only') == 'locked-read-only'

- name: Probe cryptsetup and the kernel's dm-crypt / dm-integrity support
  shell: |
    set -euo pipefail
    cryptsetup --version
    # The kernel the image will boot, not necessarily the build host's running
    # one: the newest installed under /lib/modules.
    kver="$(ls -1 /lib/modules | sort -V | tail -n1)"
    echo "kernel=${kver}"
    modinfo -k "${kver}" dm_crypt >/dev/null
    modinfo -k "${kver}" dm_integrity >/dev/null
  args:
    executable: /bin/bash
  register: disk_crypto_probe
  changed_when: false
  failed_when: false
  when: lockdown_profile | default('locked-read-only') == 'locked-read-only'

- name: Assert the image can create LUKS2 volumes with integrity
  assert:
    that:
      - disk_crypto_probe.rc == 0
    fail_msg: >-
      cryptsetup is missing or the image's kernel has no dm_crypt/dm_integrity
      module ({{ disk_crypto_probe.stdout | default('') }}
      {{ disk_crypto_probe.stderr | default('') }}). calimero-init could not
      encrypt or open the data disk. On Ubuntu, dm_integrity can live in
      linux-modules-extra for the kernel flavour.
  when: lockdown_profile | default('locked-read-only') == 'locked-read-only'

# --- Delegated-execution conformance -----------------------------------------
#
# A relay image has one cross-repo dependency the build cannot infer: the baked
# merod must actually implement `server.admin.public_intents` and the
# `GET .../intents` descriptor. Pin `merodVersion` at a core release that
# predates them and the image still builds, still boots, and still reports
# itself to MDMA — it simply never serves a client, because the config key is
# ignored and the discovery read 404s. That failure appears in a browser, days
# later, as "the relay does not answer".
#
# So the invariant is asserted here instead of documented. The flag on
# `merod init` and the config key are the same feature, and the flag is the part
# a CLI can be asked about without a node, a network or a config file — which
# makes it a clean capability probe for the baked binary.
#
# EITHER SPELLING SATISFIES IT, and that is required rather than lenient. Core
# renamed `--public-intents` to `--delegated-access` when the flag grew to
# govern reads as well, keeping the old name as a clap alias — and a clap alias
# is HIDDEN from `--help`. So the probe sees exactly one of the two names, and
# which one depends on the release pinned:
#
#   merod before the rename   help lists --public-intents
#   merod after the rename    help lists --delegated-access
#
# Asserting either name alone therefore fails against half the releases that
# implement the feature perfectly well. Accepting both keeps what this assert is
# actually for — catching a `merodVersion` pinned at a release with no delegated
# execution at all, which lists neither. Tighten to `--delegated-access` once
# `merodVersion` is past the rename and the alias has been dropped upstream.
- name: Probe whether the baked merod supports delegated execution
  command: /usr/local/bin/merod --node conformance init --help
  register: merod_init_help
  changed_when: false
  failed_when: false
  when: fleet_delegated_access | default(false) | bool

- name: Assert the baked merod can serve delegated execution
  assert:
    that:
      - merod_init_help.rc == 0
      - >-
        '--delegated-access' in merod_init_help.stdout
        or '--public-intents' in merod_init_help.stdout
    fail_msg: >-
      This image enables delegated execution (fleet_delegated_access), but the
      baked merod ({{ merod_version | default('unknown') }}) lists neither
      --delegated-access nor --public-intents, so it implements neither the
      config key nor GET /admin-api/contexts/<ctx>/intents.
      Bump merodVersion in mero-tee/versions.json to a core release carrying
      them, or build with -e fleet_delegated_access=false.
  when: fleet_delegated_access | default(false) | bool

# The other half of the posture. Traefik is the only gate on these nodes (merod
# runs in proxy auth mode), so an image that set the merod key but shipped a
# routing file without the exemption would look configured and serve nothing —
# and one with the exemption but no merod support is the case above. Asserting
# the rendered file keeps a template regression from reaching a release.
#
# Read unconditionally, because one of the two exemptions below is asserted on
# every image rather than only on relays.
- name: Read the rendered traefik routing file
  slurp:
    path: /etc/traefik/routing.yml
  register: traefik_routing

# Admission is not a hosted capability and is served by EVERY node: the
# `admitters` list is chosen by the inviter, who may name a peer's self-hosted
# node, so gating this would make a peer-to-peer flow cloud-only. A node named
# in no invitation refuses every request to the route, so serving it grants no
# authority — which is why this assertion is not conditioned on the profile.
- name: Assert traefik exempts the direct-admission path on every image
  assert:
    that:
      - "'node-api-admit' in (traefik_routing.content | b64decode)"
      - "'/admin-api/namespaces/[0-9a-f]{64}/admit' in (traefik_routing.content | b64decode)"
      # The catch-all must stay guarded: the exemption is one anchored path, not
      # a prefix over every namespace route.
      - "'auth-node' in (traefik_routing.content | b64decode)"
    fail_msg: >-
      /etc/traefik/routing.yml does not carry the anchored node-api-admit
      exemption (or has lost the auth-node guard on the catch-all), so a joiner
      holding only an invitation cannot reach direct admission on this node.

# Delegated execution IS hosted — the node authors on someone else's behalf —
# so this half is asserted only where the image was built to relay.
- name: Assert traefik exempts the delegated-execution path on a relay
  assert:
    that:
      - "'node-api-intents' in (traefik_routing.content | b64decode)"
      - "'/admin-api/contexts/[0-9a-f]{64}/intents' in (traefik_routing.content | b64decode)"
      - "'auth-node' in (traefik_routing.content | b64decode)"
    fail_msg: >-
      This image enables delegated execution but /etc/traefik/routing.yml does
      not carry the anchored node-api-intents exemption (or has lost the
      auth-node guard on the catch-all).
  when: fleet_delegated_access | default(false) | bool

# --- Recovery-envelope conformance -------------------------------------------
#
# The same class of cross-repo dependency as the block above, for the sidecar's
# recovery-envelope writer (calimero-network/mdma#223). It shells out to
# `meroctl account seal-to`, which arrived in core#3918 — pin `merodVersion` at
# a release that predates it and the image still builds, still boots, and the
# sidecar still runs. `seal_for_account` simply fails on every pass, logs a
# WARN, and writes nothing.
#
# That failure direction is the safe one, and that is exactly what makes it
# dangerous to leave unasserted: nothing breaks, no envelope is ever written,
# and the gap surfaces when someone loses their last device and finds there is
# nothing to recover from — the one moment no retroactive fix exists.
#
# `account --help` is the part a CLI answers without a node, a network or a
# config file, so it probes the baked binary the same way `--public-intents`
# probes merod. Gated on `merod_mode` because that is what gates the sidecar
# itself.
- name: Probe whether the baked meroctl can seal to an account root
  command: /usr/local/bin/meroctl account --help
  register: meroctl_account_help
  changed_when: false
  failed_when: false
  when: merod_mode == "read-only"

- name: Assert the baked meroctl can seal to an account root
  assert:
    that:
      - meroctl_account_help.rc == 0
      - "'seal-to' in meroctl_account_help.stdout"
    fail_msg: >-
      This image ships the fleet sidecar, whose recovery-envelope writer calls
      `meroctl account seal-to`, but the baked meroctl
      ({{ meroctl_version | default(merod_version, true) | default('unknown') }})
      has no such subcommand. It arrived in calimero-network/core#3918
      (0.11.0-rc.34). The sidecar would run and silently write no envelopes, so
      device loss would stay unrecoverable. Bump merodVersion in
      mero-tee/versions.json to a core release carrying it.
  when: merod_mode == "read-only"

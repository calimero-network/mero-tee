# Calimero Authentication Service Configuration

# Server configuration
#
# Loopback only. Traefik is the only client (`auth-service` and the `auth-node`
# forwardAuth both dial http://127.0.0.1:3001), and the GCP firewall was the
# only thing keeping mero-auth's own listener -- CORS allow-all, the token
# endpoints -- off the network when it bound every interface.
listen_addr = "127.0.0.1:3001"

# JWT token settings
[jwt]
issuer = "calimero-auth"
access_token_expiry = 1800     # 30 minutes
refresh_token_expiry = 2592000 # 30 days

# Storage configuration
[storage]
type = "rocksdb"
path = "/mnt/data/calimero/default/auth_db"

# CORS configuration
[cors]
allow_all_origins = true
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["Authorization", "Content-Type", "Accept", "X-CSRF-Token"]
exposed_headers = ["X-Auth-Error"]
max_age = 100                                                                 # Match the accesscontrolmaxage from docker-compose
vary_header = true                                                            # Match addvaryheader from docker-compose

# Security configuration
[security]
# Request size limits (in bytes)
max_body_size = 1048576 # 1MB default request body size limit

# Rate limiting settings
[security.rate_limit]
rate_limit_rpm = 300  # Requests per minute (increased from 50)
rate_limit_burst = 50 # Burst size for rate limiting (increased from 20)

# Security headers configuration
[security.headers]
enabled = true
hsts_max_age = 31536000                             # 1 year in seconds
hsts_include_subdomains = true
frame_options = "DENY"                              # DENY, SAMEORIGIN, or ALLOW-FROM
content_type_options = "nosniff"
referrer_policy = "strict-origin-when-cross-origin"

# Content Security Policy
[security.headers.csp]
enabled = true
default_src = ["'self'"]
script_src = ["'self'", "'unsafe-inline'", "'unsafe-eval'"]
style_src = ["'self'", "'unsafe-inline'"]

# Authentication providers: none in this file, and no providers table.
#
# A fleet relay is operated by Calimero and serves several tenants' namespaces
# at once, so nobody holds a password login on it. The one way in is
# device-key login (`account_proof`): a keyholder proves an account root and a
# certified device, and gets a session scoped to its own contexts. That
# provider needs this node's device signing key, which only exists at runtime,
# so `mero-auth-start` appends the `providers` and `account_proof` tables to a
# copy of this file once the fleet sidecar has recorded the key, on relay
# images only.
# Declaring either table here would make that copy declare it twice, which TOML
# refuses; scripts/ci/tests/mero-auth-device-login-test.sh checks both.
#
# Without the appended tables no provider is enabled and no new token can be
# minted: `create_providers` returns an empty set cleanly, and token
# *validation* still works for `auth-node`.
#
# `user_password` was the only provider that ever worked here, and it is off.
# A `near_wallet = true` entry and a `[near]` block pointing at NEAR testnet
# also sat here once, and never did anything: `providers` is a
# `HashMap<String, bool>`, so an unregistered name matches nothing, and the
# `[near]` block was discarded in silence. The image was advertising a login it
# could not perform.
#
# What this does NOT affect: the fleet sidecar talks to
# `http://127.0.0.1:<port>/admin-api/...` directly and `meroctl` uses the local
# `--home`, so neither passes through Traefik's `auth-node` forwardAuth.

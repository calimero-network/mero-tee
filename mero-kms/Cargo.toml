[package]
name = "mero-kms-phala"
version = "2.3.50"
authors = ["Calimero Limited <info@calimero.network>"]
edition = "2021"
repository = "https://github.com/calimero-network/mero-tee"
license = "MIT OR Apache-2.0"
description = "Key management service for merod nodes running in Phala Cloud TEE"
publish = false

[[bin]]
name = "mero-kms-phala"
path = "src/main.rs"

[features]
# DEV/TEST ONLY. Compiles the mock attestation path. Default OFF so the
# production KMS binary contains no mock-attestation code.
mock-attestation = ["calimero-tee-attestation/mock-attestation"]

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
dstack-sdk = { git = "https://github.com/Dstack-TEE/dstack.git", rev = "14b850d9da172cc6cf943365bc37771c550c881f" }
dstack-attest = { git = "https://github.com/Dstack-TEE/dstack.git", rev = "14b850d9da172cc6cf943365bc37771c550c881f" }
eyre = "0.6"
hex = "0.4"
libp2p-identity = "0.2"
rand = "0.9"
redis = { version = "1.0", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# From calimero-network/core (git dependency; 0.11.0-rc.13)
# rev 3ab6ee9d is core master's tip. It contains #3269, which feature-gates the
# mock attestation path in calimero-tee-attestation behind that crate's
# default-off `mock-attestation` feature (see [features] above).
calimero-server-primitives = { git = "https://github.com/calimero-network/core", rev = "3ab6ee9d6c69bb20e5a43083eb1b46d920751b98" }
calimero-tee-attestation = { git = "https://github.com/calimero-network/core", rev = "3ab6ee9d6c69bb20e5a43083eb1b46d920751b98" }
thiserror = "2.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

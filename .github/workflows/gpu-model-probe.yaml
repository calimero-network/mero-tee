name: GPU model probe
run-name: GPU model probe (${{ inputs.model_repo || 'Qwen/Qwen3.5-122B-A10B-GPTQ-Int4' }})

# Measures what one confidential H100 can serve to agents
# (docs/design/private-agents.md, "The model"): pins a Hugging Face model to a
# commit and the sha256 of every file, boots an a3-highgpu-1g VM with TDX,
# serves the model with vLLM on loopback and runs a Hyperfeed-shaped load at
# rising concurrency (scripts/release/model/). The report gives time to first
# token, decode speed per user and turns per day at full load.
#
# Builds no image and publishes nothing. The VM opens no port and is deleted at
# the end, or by GCP after --max-run-duration if this run dies first.
#
# Run it from the Actions tab, or add the `gpu-probe` label to a pull request
# to run it with the defaults on that branch.

on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: "Hugging Face model repo"
        required: true
        default: "Qwen/Qwen3.5-122B-A10B-GPTQ-Int4"
      model_revision:
        description: "Branch, tag or commit to pin"
        required: true
        default: "main"
      provisioning:
        description: "GCP provisioning model (confidential GPUs are spot or flex-start only)"
        required: true
        type: choice
        options:
          - SPOT
          - FLEX_START
      confidential:
        description: "Boot with TDX and the GPU in confidential-computing mode"
        required: true
        type: boolean
        default: true
      zones:
        description: "Zones to try in order"
        required: true
        default: "us-central1-a,europe-west4-c,us-east5-a,asia-southeast1-c"
      driver:
        description: "NVIDIA server driver branch"
        required: true
        default: "580"
      vllm_version:
        description: "vLLM version (empty: latest, recorded in the report)"
        required: false
        default: ""
      max_model_len:
        description: "Context length vLLM reserves per request"
        required: true
        default: "32768"
      levels:
        description: "Concurrency levels to sweep"
        required: true
        default: "1,8,16,32,48"
  pull_request:
    types: [labeled]

concurrency:
  group: gpu-model-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VM_PROJECT: ${{ vars.GCP_ATTESTATION_PROJECT_ID != '' && vars.GCP_ATTESTATION_PROJECT_ID || 'cloud-486420' }}
  MODEL_REPO: ${{ inputs.model_repo || 'Qwen/Qwen3.5-122B-A10B-GPTQ-Int4' }}
  MODEL_REVISION: ${{ inputs.model_revision || 'main' }}
  PROVISIONING: ${{ inputs.provisioning || 'SPOT' }}
  CONFIDENTIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.confidential || 'true' }}
  VM_ZONES: ${{ inputs.zones || 'us-central1-a,europe-west4-c,us-east5-a,asia-southeast1-c' }}
  DRIVER: ${{ inputs.driver || '580' }}
  VLLM_VERSION: ${{ inputs.vllm_version }}
  MAX_MODEL_LEN: ${{ inputs.max_model_len || '32768' }}
  LEVELS: ${{ inputs.levels || '1,8,16,32,48' }}

jobs:
  probe:
    name: Serve and measure the model on a confidential H100
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'gpu-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the model files
        run: |
          set -euo pipefail
          mkdir -p probe
          python3 scripts/release/model/resolve-hf-files.py "${MODEL_REPO}" "${MODEL_REVISION}" probe/model-files.json

      - name: Authenticate to GCP via service account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Boot, serve and measure
        env:
          MODEL_FILES: probe/model-files.json
          PROBE_NAME: gpu-probe-${{ github.run_number }}-${{ github.run_attempt }}
          OUT_DIR: probe
          WAIT_TIMEOUT_MINUTES: "170"
        run: bash scripts/release/model/run-gpu-model-probe.sh

      - name: Summarize
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [[ -f probe/report.json ]] || exit 0
          {
            echo "### $(jq -r '.model.repo + "@" + .model.revision[0:12]' probe/report.json)"
            echo
            echo "GPU: $(jq -r .gpu probe/report.json), driver $(jq -r .driver probe/report.json), vLLM $(jq -r .vllm probe/report.json)"
            echo
            echo "Confidential computing: $(jq -r '.confidential_compute.features + " / " + .confidential_compute.ready_state' probe/report.json)"
            echo
            echo "| Concurrency | Turns/s | Turns/day at full load | TTFT p50 | TTFT p95 | Decode tok/s per user | Total tok/s |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '.load.levels[] | if .error then "| \(.concurrency) | error: \(.error) | | | | | |"
              else "| \(.concurrency) | \(.turns_per_s) | \(.turns_per_day_full_load) | \(.ttft_p50_s)s | \(.ttft_p95_s)s | \(.decode_tps_per_user_p50) | \(.total_tokens_per_s) |" end' probe/report.json
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload probe artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-model-probe-${{ github.run_id }}
          path: probe/
          if-no-files-found: ignore

name: KMS TDX image probe
run-name: KMS TDX image probe (${{ inputs.profile }}, ${{ inputs.node_release_tag }}${{ inputs.with_agent == 'true' && ', with agent' || '' }})

# Builds the mero-kms TDX cluster image from this commit and runs a two-replica
# cluster on real TDX VMs (scripts/release/kms/run-cluster-probe.sh, the same
# probe Release mero-kms runs on its release images; docs/design/gcp-tdx-kms.md).
#
# With `with_agent`, it first builds the private agent image from this commit
# (docs/design/private-agents.md) with mero-agent-gate and the stub agent,
# measures it on a TDX VM (scripts/release/agent/run-agent-probe.sh: ITA, then a
# secret provisioned through mero-agent-provision), and builds the KMS with both
# the node and that agent allowlist -- the KMS a release serving agents ships.
#
# Publishes nothing, and deletes its images, VMs and firewall rules at the end.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "KMS profile"
        required: true
        type: choice
        options:
          - locked-read-only
          - debug
      node_release_tag:
        description: "Node release whose allowlist the KMS serves (mero-tee-v<version>)"
        required: true
        default: "mero-tee-v2.3.72"
      wait_timeout_minutes:
        description: "How long to wait for each replica to hold the root"
        required: true
        default: "15"
      with_agent:
        description: "Also build and measure the agent image, and serve it from the KMS"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

concurrency:
  group: kms-tdx-image-probe-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

env:
  PACKER_GITHUB_API_TOKEN: ${{ github.token }}
  PACKER_GCP_PROJECT_ID: ${{ vars.GCP_PACKER_PROJECT_ID }}
  PACKER_GCP_REGION: ${{ vars.GCP_PACKER_REGION }}
  PACKER_GCP_ZONE: ${{ vars.GCP_PACKER_ZONE }}
  PACKER_GCP_SUBNETWORK: ${{ vars.GCP_PACKER_SUBNETWORK }}
  VM_PROJECT: ${{ vars.GCP_ATTESTATION_PROJECT_ID != '' && vars.GCP_ATTESTATION_PROJECT_ID || 'cloud-486420' }}
  VM_ZONE: ${{ vars.GCP_ATTESTATION_ZONE != '' && vars.GCP_ATTESTATION_ZONE || 'europe-west4-a' }}
  VM_MACHINE_TYPE: ${{ vars.GCP_ATTESTATION_MACHINE_TYPE != '' && vars.GCP_ATTESTATION_MACHINE_TYPE || 'c3-standard-4' }}
  ITA_APPRAISAL_URL: ${{ vars.ITA_APPRAISAL_URL }}
  KMS_PORT: "8080"
  # Never a release: a KMS probe image always carries a suffix and its own family.
  IMAGE_SUFFIX: ${{ format('-k{0}-{1}', github.run_number, github.run_attempt) }}
  PROFILE: ${{ inputs.profile }}
  WITH_AGENT: ${{ inputs.with_agent }}

jobs:
  probe:
    name: Build and run a two-replica KMS cluster (${{ inputs.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: kms-tdx-image-probe

      - name: Build mero-kms
        run: |
          cargo build -p mero-kms --release --locked
          mkdir -p probe
          cp target/release/mero-kms probe/mero-kms
          sha256sum probe/mero-kms | tee probe/mero-kms.sha256

      - name: Build mero-agent-gate and stage the stub agent
        if: ${{ inputs.with_agent == 'true' }}
        run: |
          set -euo pipefail
          cargo build -p mero-agent-gate --release --locked
          mkdir -p probe/agent
          cp target/release/mero-agent-gate target/release/mero-agent-provision probe/agent/
          cp scripts/agent/stub-mero-agent.py probe/agent/mero-agent
          # A throwaway provisioner baked into the image's list; the key never
          # leaves the run.
          probe/agent/mero-agent-provision keygen --out "${RUNNER_TEMP}/provisioner.key" > probe/agent/provisioners

      - name: Fetch the node allowlist the KMS serves
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_TAG: ${{ inputs.node_release_tag }}
        run: |
          set -euo pipefail
          gh release download "${NODE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "published-mrtds.json" --dir probe
          jq --arg p "${PROFILE}" '.profiles[$p] | {
              allowed_tcb_statuses, allowed_mrtd,
              allowed_rtmr0, allowed_rtmr1, allowed_rtmr2, allowed_rtmr3
            }' probe/published-mrtds.json > probe/node-allowlist.json
          jq -e 'all(.[]; type == "array" and length > 0)' probe/node-allowlist.json >/dev/null \
            || { echo "::error::${NODE_TAG} has no complete ${PROFILE} node allowlist"; exit 1; }
          cat probe/node-allowlist.json

      - name: Authenticate to GCP via service account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: v1.11.2

      - name: Build the agent image
        if: ${{ inputs.with_agent == 'true' }}
        working-directory: mero-tee
        env:
          IMAGE_ROLE: agent
          MERO_AGENT_BINARY: ../probe/agent/mero-agent
          MERO_AGENT_GATE_BINARY: ../probe/agent/mero-agent-gate
          MERO_AGENT_PROVISIONERS_FILE: ../probe/agent/provisioners
          PACKER_LOG: 1
        run: |
          set -euo pipefail
          ./init.sh
          ./build-and-release.sh "${PROFILE}" 2>&1 | tee /tmp/packer-agent-build.log

      - name: Boot, measure and provision the agent
        if: ${{ inputs.with_agent == 'true' }}
        env:
          PROBE_NAME: agent-probe${{ env.IMAGE_SUFFIX }}
          WAIT_TIMEOUT_MINUTES: ${{ inputs.wait_timeout_minutes }}
          ITA_API_KEY: ${{ secrets.ITA_API_KEY }}
          PROVISION_BIN: probe/agent/mero-agent-provision
          PROVISIONER_KEY: ${{ runner.temp }}/provisioner.key
          OUT_DIR: probe/agent
        run: |
          set -euo pipefail
          version="$(jq -r '.imageVersion' mero-tee/versions.json)"
          export IMAGE="merotee-agent-${PROFILE}-${version//./-}${IMAGE_SUFFIX}"
          export IMAGE_PROJECT="${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          bash scripts/release/agent/run-agent-probe.sh
          # The KMS keeps one TCB list for every role (the mero-kms role
          # asserts the two files agree), so the agent entry takes the node's.
          jq --slurpfile node probe/node-allowlist.json \
            '{allowed_tcb_statuses: $node[0].allowed_tcb_statuses,
              allowed_mrtd, allowed_rtmr0, allowed_rtmr1, allowed_rtmr2, allowed_rtmr3}' \
            "probe/agent/agent-attestation-policy.${PROFILE}.json" > probe/agent-allowlist.json
          cat probe/agent-allowlist.json

      - name: Build the KMS image
        working-directory: mero-tee
        env:
          IMAGE_ROLE: kms
          MERO_KMS_BINARY: ../probe/mero-kms
          KMS_NODE_POLICY_FILE: ../probe/node-allowlist.json
          PACKER_LOG: 1
        run: |
          set -euo pipefail
          if [[ "${WITH_AGENT}" == "true" ]]; then
            export KMS_AGENT_POLICY_FILE=../probe/agent-allowlist.json
          fi
          ./init.sh
          ./build-and-release.sh "${PROFILE}" 2>&1 | tee /tmp/packer-build.log

      - name: Show build log on failure
        if: ${{ failure() }}
        run: tail -200 /tmp/packer-agent-build.log /tmp/packer-build.log 2>/dev/null || true

      - name: Resolve names
        id: names
        run: |
          set -euo pipefail
          version="$(jq -r '.imageVersion' mero-tee/versions.json)"
          {
            echo "image=merotee-kms-${PROFILE}-${version//./-}${IMAGE_SUFFIX}"
            echo "image_project=${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run the two-replica cluster and verify both quotes
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          IMAGE_PROJECT: ${{ steps.names.outputs.image_project }}
          PROBE_NAME: kms-probe${{ env.IMAGE_SUFFIX }}
          WAIT_TIMEOUT_MINUTES: ${{ inputs.wait_timeout_minutes }}
          ITA_API_KEY: ${{ secrets.ITA_API_KEY }}
          OUT_DIR: probe
        run: bash scripts/release/kms/run-cluster-probe.sh

      - name: Upload probe artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kms-tdx-image-probe-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            probe/
            !probe/agent/mero-agent-gate
            !probe/agent/mero-agent-provision
          if-no-files-found: ignore

      - name: Delete the probe image
        if: ${{ always() }}
        run: |
          image="${{ steps.names.outputs.image }}"
          [[ -n "${image}" && "${image}" == *"${IMAGE_SUFFIX}" ]] && gcloud compute images delete \
            "${image}" --project "${{ steps.names.outputs.image_project }}" --quiet || true

      - name: Delete the agent probe image
        if: ${{ always() && inputs.with_agent == 'true' }}
        run: |
          version="$(jq -r '.imageVersion' mero-tee/versions.json)"
          gcloud compute images delete "merotee-agent-${PROFILE}-${version//./-}${IMAGE_SUFFIX}" \
            --project "${PACKER_GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT}}" --quiet || true

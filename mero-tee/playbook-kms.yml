---
# mero-kms TDX cluster image (docs/design/gcp-tdx-kms.md). Same base, lockdown
# and dm-verity root as the node image (playbook.yml); none of the node's
# services. Built by mkosi with ROLE=kms (mero-tee/mkosi-image/build.sh).
- hosts: all
  become: true
  pre_tasks:
    - name: Refresh apt metadata cache only (avoid non-deterministic full upgrades)
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    # Shippers first: the mero-kms role writes their KMS-specific config into
    # the directories they create. Off until kms-init finds an endpoint.
    - role: ansible/roles/node-exporter
      vars:
        version: "{{ node_exporter_version }}"
        cpu_architecture: "amd64"

    - role: ansible/roles/vmagent
      vars:
        vmagent_version: "{{ vmagent_version }}"
        cpu_architecture: "amd64"

    - role: ansible/roles/vector
      vars:
        version: "{{ vector_version }}"

    - role: ansible/roles/mero-kms

    - role: ansible/roles/cleanup

    - role: ansible/roles/merod-lockdown
      when: lockdown_profile == 'locked-read-only'

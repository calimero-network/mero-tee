---
- name: Install apache2-utils for htpasswd
  package:
    name: apache2-utils
    state: present

- name: Require Traefik to be pinned for this version
  assert:
    that: build_inputs.traefik.version == traefik_version
    fail_msg: >-
      build-inputs.lock.json pins Traefik {{ build_inputs.traefik.version }} but the
      build asked for {{ traefik_version }}. Run scripts/release/pin-build-inputs.sh.

- name: Download Traefik from GitHub releases (sha256-pinned)
  get_url:
    url: "https://github.com/traefik/traefik/releases/download/v{{ traefik_version }}/traefik_v{{ traefik_version }}_linux_{{ cpu_architecture }}.tar.gz"
    dest: "/tmp/traefik_v{{ traefik_version }}_linux_{{ cpu_architecture }}.tar.gz"
    checksum: "sha256:{{ build_inputs.traefik.sha256['traefik_v' ~ traefik_version ~ '_linux_' ~ cpu_architecture ~ '.tar.gz'] }}"
    mode: "0644"
    timeout: 120
  register: traefik_download
  retries: 5
  delay: 10
  until: traefik_download is succeeded

- name: Extract Traefik
  unarchive:
    src: "/tmp/traefik_v{{ traefik_version }}_linux_{{ cpu_architecture }}.tar.gz"
    dest: /usr/local/bin
    mode: "0755"
    remote_src: yes

- name: Remove the Traefik archive
  file:
    path: "/tmp/traefik_v{{ traefik_version }}_linux_{{ cpu_architecture }}.tar.gz"
    state: absent

- name: Create traefik base directory
  file:
    path: /etc/traefik
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy traefik configuration file
  copy:
    src: traefik-config.yml
    dest: /etc/traefik/config.yml
    owner: root
    group: root
    mode: "0755"

# A template, not a copy: the delegated-execution router is only present on an
# image built as a relay (`fleet_delegated_access`), so the routing file is
# profile-specific — which also means it changes the image's root hash and
# therefore its measurements, exactly as a security-relevant edge change should.
- name: Render traefik routing file
  template:
    src: traefik-routing.yml.j2
    dest: /etc/traefik/routing.yml
    owner: root
    group: root
    mode: "0755"

- name: Create traefik systemd service file
  copy:
    content: |
      [Unit]
      Description=traefik

      [Service]
      ExecStart=/usr/local/bin/traefik --configFile=/etc/traefik/config.yml
      Restart=always

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/traefik.service

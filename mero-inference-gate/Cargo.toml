[package]
name = "mero-inference-gate"
version = "2.3.112"
authors = ["Calimero Limited <info@calimero.network>"]
edition = "2021"
repository = "https://github.com/calimero-network/mero-tee"
license = "MIT OR Apache-2.0"
description = "Attested TLS front for the private inference TDX image"
publish = false

[lib]
path = "src/lib.rs"

# Runs inside the inference TD: serves /attest and proxies /v1 to vLLM.
[[bin]]
name = "mero-inference-gate"
path = "src/main.rs"

[features]
# DEV/TEST ONLY, as in mero-agent-gate: compiles mock quote generation into
# the gate. Default OFF.
mock-attestation = ["calimero-tee-attestation/mock-attestation"]

[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.23"
bytes = "1"
eyre = "0.6"
futures-util = "0.3"
hex = "0.4"
rand_core = { version = "0.9", features = ["os_rng"] }
# The TLS key: ECDSA P-256, made in memory at every start, bound into quotes.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "process", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Same core rev as mero-kms and mero-agent-gate: one quote implementation.
calimero-tee-attestation = { git = "https://github.com/calimero-network/core", rev = "23cf02c965a2ca2f9eb4d8abe47ce54a763c7fab" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

name: CI workflow and shell lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/release/**"
      - "scripts/policy/**"
      - "scripts/attestation/**"
      - "scripts/ci/**"
      - "scripts/agent/**"
      - "scripts/inference/**"
      - "scripts/image/**"
      - "mero-tee/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "scripts/release/**"
      - "scripts/policy/**"
      - "scripts/attestation/**"
      - "scripts/ci/**"
      - "scripts/agent/**"
      - "scripts/inference/**"
      - "scripts/image/**"
      - "mero-tee/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        id: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -shellcheck=

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        id: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          shell_files=(scripts/release/**/*.sh scripts/policy/**/*.sh scripts/ci/**/*.sh scripts/agent/**/*.sh scripts/inference/**/*.sh mero-tee/**/*.sh
                       mero-tee/mkosi-*/mkosi.postinst mero-tee/mkosi-*/mkosi.finalize)
          if [[ "${#shell_files[@]}" -eq 0 ]]; then
            echo "No shell files matched lint paths."
            exit 0
          fi

          shellcheck "${shell_files[@]}"

      # The init-script tests below slice the templates' bash out with `sed` and
      # `awk`, which exercises the bash but never asks whether Jinja can parse
      # the file.
      # `${#arr[@]}` opens with Jinja's comment delimiter, so a counted array
      # makes Ansible swallow the rest of the template and die with "Missing end
      # of comment tag" -- minutes into an image build, and only on the
      # profiles that render the template. That took out the 2.3.55 and 2.3.56 node
      # images and then every later `Release mero-kms` run with it, because that
      # workflow refuses to publish without the node release's published-mrtds.
      # Parsing each template here costs a second and fails on the PR instead.
      - name: Check Ansible templates parse
        id: ansible_templates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet jinja2 pyyaml
          python3 scripts/ci/check-ansible-templates.py

      # Parsing the templates is not loading the playbook. A task file can be
      # valid YAML and still fail to load: a free-form `shell: |` string is split
      # into key=value arguments, so one apostrophe in a shell COMMENT ("the build
      # host's kernel") is an unbalanced quote and Ansible refuses the whole task
      # file. That stopped every profile of the 2.3.72 node image in packer, and
      # with it the KMS release that waits on the image's measurements. Loading
      # the playbook per profile takes seconds and fails here instead.
      - name: Check the playbook loads for every profile
        id: ansible_syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ansible-core
          cd mero-tee
          for profile in locked-read-only debug-read-only debug; do
            ansible-playbook -i localhost, --syntax-check playbook.yml \
              -e lockdown_profile="${profile}" -e image_version=0.0.0 \
              -e merod_version=0.0.0 -e cpu_architecture=amd64 \
              -e traefik_version=0.0.0 -e node_exporter_version=0.0.0 \
              -e vmagent_version=0.0.0 -e vector_version=0.0.0 </dev/null
          done
          # The inference image's playbook too (docs/design/private-inference.md).
          for profile in locked-read-only debug-read-only debug; do
            ansible-playbook -i localhost, --syntax-check playbook-inference.yml \
              -e lockdown_profile="${profile}" -e image_version=0.0.0 -e cpu_architecture=amd64 \
              -e node_exporter_version=0.0.0 -e vmagent_version=0.0.0 -e vector_version=0.0.0 </dev/null
          done

      # A KMS join refused over differing registers is diagnosed from the two
      # replicas' CCEL event logs; the tool must parse, replay and diff them.
      - name: Check the TDX event log tool parses, replays and diffs logs
        id: tdx_event_log_test
        shell: bash
        run: scripts/ci/tests/tdx-event-log-test.sh

      # The UKI TDX probe (uki-tdx-probe.yaml) reads its evidence back from a
      # serial console and checks the firmware measured the UKI it built, by
      # Authenticode hash; the tool must reassemble, replay and find it.
      - name: Check the UKI probe evidence tool
        id: uki_probe_evidence_test
        shell: bash
        run: scripts/ci/tests/uki-probe-evidence-test.sh

      # compute_rtmr.py predicts a UKI image's RTMR1 and RTMR2 from its build
      # output; its fixed events and section names are pinned to what a GCP
      # TDX VM measured.
      - name: Check the RTMR calculator
        id: compute_rtmr_test
        shell: bash
        run: scripts/ci/tests/compute-rtmr-test.sh

      # render_role_tree.py gives the mkosi images the files the Ansible roles
      # write; it must do what Ansible does, and render every node role.
      - name: Check the role renderer
        id: render_role_tree_test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -q python3-jinja2 python3-yaml >/dev/null
          scripts/ci/tests/render-role-tree-test.sh

      # A KMS image bakes its node (and agent) allowlist into the measured
      # kms.env and the release signs that image, so only the node release's
      # own signed policy, in shapes kms.env carries intact, may become one.
      # After the renderer's step (jinja2) and the playbook load (ansible-core):
      # the role's asserts run under both, and may not be skipped here.
      - name: Check the KMS allowlists are verified and well-formed
        id: kms_node_allowlist_test
        shell: bash
        run: scripts/ci/tests/kms-node-allowlist-test.sh

      # The release names its mkosi images; mdma and the rest of the release
      # find them by the names they build themselves.
      - name: Check the release image names
        id: release_image_name_test
        shell: bash
        run: scripts/ci/tests/release-image-name-test.sh

      # Secrets must be CREATED restricted, not created loose and tightened.
      # None of these units set `UMask=`, so systemd's default 0022 makes a
      # token 0644 and a later `chmod` closes the window only after the secret
      # is already on disk world-readable. calimero-init writes the
      # observability token on every node at boot; it is a linear boot script
      # with nothing to source, so the check is static.
      - name: Check every token file is created under a restrictive umask
        id: secret_umask_test
        shell: bash
        run: scripts/ci/tests/secret-file-umask-test.sh

      # server-port / swarm-port are host-set metadata that reach merod's
      # arguments and a loopback URL, so they must be ports.
      - name: Check port metadata is a port or the default
        id: metadata_port_test
        shell: bash
        run: scripts/ci/tests/metadata-port-test.sh

      # merod admits browser pages from any origin on a node that takes callers'
      # identity from the proxy, so a relay sets no allowed_origins (that list is
      # also the CORS allow-list, which shut every hosted app out) and drops the
      # one 2.3.109 wrote into config.toml, which persists on the data disk.
      - name: Check a relay pins no browser origin
        id: no_origin_pin_test
        shell: bash
        run: scripts/ci/tests/calimero-init-no-origin-pin-test.sh

      - name: Check the data disk is mounted before use
        id: data_disk_test
        shell: bash
        run: scripts/ci/tests/calimero-init-data-disk-test.sh

      # TDX protects memory, not disks, so merod's store -- the node's admitted
      # signing identity and account root -- must be encrypted with a KMS key,
      # and from `merod init` onwards. Runs the decision against a stub merod:
      # locked-read-only never creates a plaintext store, and a KMS that cannot
      # be verified (no tee-release-version) is never used.
      - name: Check new nodes get a KMS-encrypted store
        id: store_encryption_test
        shell: bash
        run: scripts/ci/tests/calimero-init-store-encryption-test.sh

      # The store is not the whole disk: config.toml, the TLS key, mero-auth's
      # database and the fleet token sit beside it. So the data disk itself is
      # LUKS2 with integrity, keyed from the KMS. Runs the disk block against
      # stub cryptsetup/blkid/mount/merod: only a disk blkid reports blank is
      # ever formatted, an existing LUKS disk is reopened from its header token,
      # a plain one is mounted and warned about, anything else stops the boot,
      # the key never outlives the script -- and tee-release-version cannot go
      # below the image's own version.
      - name: Check the data disk is encrypted and never reformatted
        id: disk_encryption_test
        shell: bash
        run: scripts/ci/tests/calimero-init-disk-encryption-test.sh

      # Each image's RTMR3 extend is what its KMS policy entry matches, so the
      # node, KMS, agent and inference init scripts' one shared block is
      # executed and the v3 event (role, profile, dm-verity roothash) checked
      # byte for byte.
      - name: Check calimero-init, kms-init, agent-init and inference-init extend RTMR3 (v3)
        id: init_rtmr3_test
        shell: bash
        run: scripts/ci/tests/init-rtmr3-test.sh

      # The agent image's data disk (docs/design/private-agents.md) is the
      # node's encrypted-disk logic narrowed: only ever LUKS2 with integrity,
      # keyed from the KMS, never plain, never reformatted, never on a
      # downgraded release.

      - name: Check the agent's data disk is encrypted and never reformatted
        id: agent_data_disk_test
        shell: bash
        run: scripts/ci/tests/agent-init-data-disk-test.sh

      # An agent TD hosts several owners' agents, one per slot: each slot's
      # keys and secrets are its group's alone, and its unit runs as its own
      # user, writes only its own state and sees no other agent's processes.
      - name: Check each agent slot is its own user's alone
        id: agent_slots_test
        shell: bash
        run: scripts/ci/tests/agent-init-slots-test.sh

      # The agent image's mero-bot launcher: it starts mero-bot only once the
      # owner has provisioned it, with its allowlisted secrets and nothing else
      # in its environment, never a secret in an argv, and restarts on new ones.
      - name: Check the mero-bot launcher passes only its secrets
        id: mero_bot_launcher_test
        shell: bash
        run: scripts/ci/tests/mero-bot-agent-launcher-test.sh

      # inference-init against stubs: measure-only extends RTMR3 with the image
      # alone; a model's configuration is measured as its second event; code
      # from a repository, a moving revision, an open gate or weights that do
      # not hash to model-sha256 stop the boot before vLLM starts; a GPU outside
      # confidential-computing mode stops a locked-read-only boot.
      - name: Check inference-init measures the model and refuses what it must
        id: inference_init_test
        shell: bash
        run: scripts/ci/tests/inference-init-test.sh

      # The inference image's model configuration (docs/design/private-inference.md):
      # metadata can set only allowlisted vLLM flags, never remote code; the
      # canonical bytes measured into RTMR3 match mdma's; the weights digest
      # covers exactly the files kept; vLLM listens on loopback only.
      - name: Check the inference image's model configuration
        id: inference_model_test
        shell: bash
        run: python3 scripts/ci/tests/inference-model-test.py

      # Node metrics must say which node they came from. The scrape target is
      # `localhost:9100` on every node, so without identifying labels the whole
      # fleet collapses into one series and samples interleave -- plausible,
      # wrong, and invisible until a second node exists.
      - name: Check vmagent labels its samples with the node identity
        id: vmagent_identity_test
        shell: bash
        run: scripts/ci/tests/vmagent-node-identity-test.sh

      # Which image a node runs. `locked-read-only` is production; the debug
      # profiles are rebuilt freely and use Let's Encrypt staging. Without the
      # field, a log line from a throwaway node reads exactly like one from
      # production -- and the placeholder shipping unsubstituted would be worse
      # still, since every node would report the literal string.
      - name: Check vector stamps and indexes the image profile
        id: vector_profile_test
        shell: bash
        run: scripts/ci/tests/vector-image-profile-test.sh

      # The shippers' configure scripts paste instance-metadata values into
      # vector's YAML and vmagent's systemd unit. A newline there is an extra
      # ExecStart running as root, beside a node's storage key or a KMS
      # replica's cluster root. Also pins the KMS image's own labels.
      - name: Check shipper configs refuse injected URLs and tokens
        id: observability_injection_test
        shell: bash
        run: scripts/ci/tests/observability-config-injection-test.sh

      # Every ingress router must carry a request-rate limit, first in its
      # chain. Two of these routes verify signatures for callers holding no
      # credential -- deliberately, since a credential would make both features
      # unreachable for the callers they exist for -- so an unlimited ingress is
      # a way to spend a node's CPU from anywhere. A limit placed after
      # `auth-node` is worse than none in one respect: it pays for a forwardAuth
      # subrequest per flooded request, so a flood of the node becomes a flood of
      # its auth service.
      - name: Check every ingress router is rate limited, first in its chain
        id: traefik_rate_limit_test
        shell: bash
        run: scripts/ci/tests/traefik-rate-limit-test.sh

      # mero-auth checks a scoped token against X-Forwarded-Uri/-Method. If
      # traefik trusts the client's values, the caller picks the route its token
      # is checked against (mero-tee#339).
      - name: Check forwardAuth does not trust client X-Forwarded-* headers
        id: traefik_forward_auth_test
        shell: bash
        run: scripts/ci/tests/traefik-forward-auth-test.sh

      # merod scopes a device-key session by X-Auth-Account / X-Auth-Device
      # (server.proxy_identity). Only mero-auth may write them: auth-node
      # replaces them, and every entrypoint strips a client's.
      - name: Check a client cannot name the account merod scopes it as
        id: traefik_proxy_identity_test
        shell: bash
        run: scripts/ci/tests/traefik-proxy-identity-test.sh

      # mero-auth's account_proof provider refuses to start without the node's
      # key, and a mero-auth that does not start takes forwardAuth down.
      - name: Check mero-auth-start enables device-key login only with a node key
        id: mero_auth_device_login_test
        shell: bash
        run: scripts/ci/tests/mero-auth-device-login-test.sh

      # Everything under /admin-api/tee/ except info and attest is on core's
      # protected router, which only traefik guards on these nodes.
      - name: Check the public TEE router serves only info and attest
        id: traefik_tee_route_test
        shell: bash
        run: scripts/ci/tests/traefik-tee-route-test.sh

      # The sealed-transport router is exempt from auth-node because forwardAuth
      # cannot see inside an envelope. It is safe only relay-only, on exact
      # paths, rate limited, and in front of a merod (>= 0.11.0-rc.52) that
      # refuses opened requests for any route a proxy guards.
      - name: Check the sealed-transport router cannot bypass auth-node
        id: traefik_sealed_route_test
        shell: bash
        run: scripts/ci/tests/traefik-sealed-route-test.sh

      # Releases accept TCB status `outofdate` only while GCP's TDX hosts report
      # it; the first probe that reports `uptodate` must fail the release and
      # name the change, so the allowlist narrows as soon as hosts are patched.
      - name: Check a patched probe host stops a release that accepts outofdate
        id: tcb_outofdate_gate_test
        shell: bash
        run: scripts/ci/tests/tcb-outofdate-gate-test.sh

      # The delegated routers (`/intents`, `/presence-intents`,
      # `/context-intents`, `/governance-intents`) skip auth-node
      # on relays. Routes requests through every router the way Traefik does,
      # so a looser pattern (uppercase hex, any id length, a trailing slash, one
      # more segment) fails here instead of opening a protected route.
      - name: Check the delegated routes serve exactly their own paths
        id: traefik_delegated_route_test
        shell: bash
        run: scripts/ci/tests/traefik-delegated-route-test.sh

      # The log-auth check (staging probe, node and KMS releases) only runs on
      # real GCP; this pins what could make it lie without any cloud: the
      # receiver's token classification, the verdict read from it, and how the
      # KMS and agent probes get the two keys and find the receiver.
      - name: Check the log-auth probe tells an authenticated push from one without a token
        id: log_auth_probe_test
        shell: bash
        run: scripts/ci/tests/node-log-auth-probe-test.sh

      # Release probe VMs are created through gcp_create_instance, which retries
      # GCP's transient errors (run 39287102050 lost a release to one "Internal
      # error"), fails at once on deterministic ones, and deletes a half-created
      # instance before retrying under the same name.
      - name: Check probe VM creation retries only transient GCP errors
        id: gcp_create_instance_test
        shell: bash
        run: scripts/ci/tests/gcp-create-instance-retry-test.sh

      # Relays set `server.sealed.forward_auth` so a sealed login or logged-in
      # call is checked by the same mero-auth traefik's auth-node asks, on a
      # merod (>= 0.11.0-rc.84) that knows the key, and never fatally.
      - name: Check sealed requests are guarded by traefik's own mero-auth
        id: sealed_forward_auth_test
        shell: bash
        run: scripts/ci/tests/sealed-forward-auth-test.sh

      # Every binary the image build downloads is pinned by sha256 in
      # mero-tee/build-inputs.lock.json, for the versions versions.json names,
      # and every download in the image's Ansible is checked against it.
      - name: Check every image build input is pinned by sha256
        id: build_inputs_pinned_test
        shell: bash
        run: scripts/ci/tests/build-inputs-pinned-test.sh

      # Release mero-kms signs each agent allowlist and verifies what it signed.
      # Signing writes a .bundle.json beside each, which the allowlists' glob
      # also matches: 2.3.114 verified its bundles as assets and published nothing.
      - name: Check the release signs and verifies only the agent allowlists
        id: kms_agent_policy_signing_test
        shell: bash
        run: scripts/ci/tests/kms-agent-policy-signing-test.sh

      # Logs leave the TEE for an endpoint the VM operator chooses. Every image
      # routes them through egress-guard.vrl first; runs it with the pinned
      # Vector release and validates each generated config.
      - name: Check logs leave only through the egress guard
        id: log_egress_guard_test
        shell: bash
        run: scripts/ci/tests/log-egress-guard-test.sh

      - name: Summarize lint outcomes
        if: ${{ always() }}
        run: |
          set -euo pipefail
          source scripts/ci/logging.sh
          result_line="$(ci_result "ci-workflow-lint" "${{ job.status }}" "ACTIONLINT_SHELLCHECK" "ref=${GITHUB_REF_NAME}" "run_id=${GITHUB_RUN_ID}")"
          ci_info "${result_line}"
          python3 scripts/ci/summary/write_workflow_summary.py \
            --output "${GITHUB_STEP_SUMMARY}" \
            --inputs-line "- Ref: ${GITHUB_REF_NAME}" \
            --checks-line "- actionlint: ${{ steps.actionlint.outcome }}" \
            --checks-line "- shellcheck: ${{ steps.shellcheck.outcome }}" \
            --checks-line "- mero-auth device-key login test: ${{ steps.mero_auth_device_login_test.outcome }}" \
            --checks-line "- traefik proxy identity test: ${{ steps.traefik_proxy_identity_test.outcome }}" \
            --checks-line "- TDX event log tool test: ${{ steps.tdx_event_log_test.outcome }}" \
            --checks-line "- UKI probe evidence tool test: ${{ steps.uki_probe_evidence_test.outcome }}" \
            --checks-line "- RTMR calculator test: ${{ steps.compute_rtmr_test.outcome }}" \
            --checks-line "- role renderer test: ${{ steps.render_role_tree_test.outcome }}" \
            --checks-line "- KMS allowlists verified and well-formed: ${{ steps.kms_node_allowlist_test.outcome }}" \
            --checks-line "- release image name test: ${{ steps.release_image_name_test.outcome }}" \
            --checks-line "- token files created under umask: ${{ steps.secret_umask_test.outcome }}" \
            --checks-line "- port metadata is a port or the default: ${{ steps.metadata_port_test.outcome }}" \
            --checks-line "- relay pins no browser origin: ${{ steps.no_origin_pin_test.outcome }}" \
            --checks-line "- data disk mounted before use: ${{ steps.data_disk_test.outcome }}" \
            --checks-line "- new nodes get a KMS-encrypted store: ${{ steps.store_encryption_test.outcome }}" \
            --checks-line "- data disk encrypted, never reformatted: ${{ steps.disk_encryption_test.outcome }}" \
            --checks-line "- init scripts extend RTMR3 (v3): ${{ steps.init_rtmr3_test.outcome }}" \
            --checks-line "- agent data disk encrypted, never reformatted: ${{ steps.agent_data_disk_test.outcome }}" \
            --checks-line "- agent slots isolated per user: ${{ steps.agent_slots_test.outcome }}" \
            --checks-line "- mero-bot launcher passes only its secrets: ${{ steps.mero_bot_launcher_test.outcome }}" \
            --checks-line "- vmagent node identity labels: ${{ steps.vmagent_identity_test.outcome }}" \
            --checks-line "- vector image profile field: ${{ steps.vector_profile_test.outcome }}" \
            --checks-line "- ingress routers rate limited: ${{ steps.traefik_rate_limit_test.outcome }}" \
            --checks-line "- forwardAuth ignores client X-Forwarded-*: ${{ steps.traefik_forward_auth_test.outcome }}" \
            --checks-line "- sealed router cannot bypass auth-node: ${{ steps.traefik_sealed_route_test.outcome }}" \
            --checks-line "- delegated routes serve exactly their own paths: ${{ steps.traefik_delegated_route_test.outcome }}" \
            --checks-line "- public TEE router serves only info and attest: ${{ steps.traefik_tee_route_test.outcome }}" \
            --checks-line "- log-auth probe verdicts: ${{ steps.log_auth_probe_test.outcome }}" \
            --checks-line "- probe VM create retry: ${{ steps.gcp_create_instance_test.outcome }}" \
            --checks-line "- sealed requests guarded by mero-auth: ${{ steps.sealed_forward_auth_test.outcome }}" \
            --checks-line "- image build inputs pinned by sha256: ${{ steps.build_inputs_pinned_test.outcome }}" \
            --checks-line "- release signs only the agent allowlists: ${{ steps.kms_agent_policy_signing_test.outcome }}" \
            --checks-line "- logs leave only through the egress guard: ${{ steps.log_egress_guard_test.outcome }}" \
            --result-line "- Job status: ${{ job.status }}" \
            --result-line "- ${result_line}" \
            --artifacts-line "- n/a" \
            --next-line "- Fix first failing lint stage and rerun."
